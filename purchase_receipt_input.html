<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>구매품 입고</title>
<style>
:root{--line:#9daab6;--line2:#c5ced6;--ink:#344758}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:"Malgun Gothic","맑은 고딕",Arial,sans-serif;font-size:12px;color:var(--ink);background:#fff;overflow:hidden}button,input,select{font:inherit;color:inherit}
.screen{height:100%;display:flex;flex-direction:column}.title{height:46px;padding:9px 14px 4px;border-bottom:2px solid #3977ad;display:flex;align-items:center;gap:14px}.title h1{margin:0;font-size:21px;font-weight:500;color:#4b5b69}.title h1:before{content:'◯';margin-right:6px;color:#8795a1}.title .plant{margin-left:auto;display:flex;align-items:center;gap:6px;color:#6b7885}
.filters{padding:7px 14px;border-bottom:1px solid var(--line2);background:#fafbfc;display:flex;gap:6px;align-items:center;flex-wrap:wrap}.label{font-weight:700}.field{height:27px;border:1px solid #b7c2cb;background:#fff;padding:0 7px;outline:none}.field:focus{border-color:#4e88bb}
.histbar{margin:6px 14px 0;height:24px;border:1px solid var(--line);background:linear-gradient(#e9f2f9,#dbe8f2);display:flex;align-items:center;justify-content:center;font-weight:700;color:#536677}
.gridbox{flex:1;min-height:0;margin:6px 14px;border:1px solid var(--line);display:flex;flex-direction:column;background:#fff}.grid-title{height:26px;display:flex;align-items:center;justify-content:center;background:linear-gradient(#deebf5,#caddea);border-bottom:1px solid var(--line);font-weight:700;color:#536677}
.tablewrap{flex:1;min-height:0;overflow:auto}table{border-collapse:collapse;min-width:1620px;width:100%;table-layout:fixed}th,td{height:25px;padding:0 5px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}th{position:sticky;top:0;z-index:2;text-align:center;background:linear-gradient(#dbe9f4,#c7d9e8);color:#405266;font-weight:700}tbody tr:nth-child(even) td{background:#fafcfd}tbody tr:hover td{background:#edf6fd}tbody tr.sel td{background:#2e78bd;color:#fff}.c{text-align:center}.r{text-align:right}
tfoot th{position:sticky;bottom:0;background:linear-gradient(#e6eef5,#d3e0ea)}
.applybar{height:38px;margin:0 14px;border:1px solid var(--line);border-top:0;background:#eef3f6;display:flex;align-items:center;gap:7px;padding:0 8px;justify-content:flex-start}
.btn{height:28px;min-width:70px;border:1px solid #9ca9b5;background:linear-gradient(#fff,#dfe6eb)}.btn:hover{background:#fff}.btn.primary{background:linear-gradient(#f9ffff,#d2e7f6);color:#1e5e91}.btn.warn{color:#a63a2f}
.foot{height:42px;display:flex;align-items:center;padding:5px 14px;border-top:1px solid var(--line);background:#eef2f5;gap:5px}.msg{margin-left:10px;color:#687784}.foot .right{margin-left:auto;color:#7c8993}
@media(max-width:900px){.title h1{font-size:18px}}
</style>
</head>
<body>
<div class="screen">
  <div class="title"><h1>구매품 입고</h1></div>
  <section class="filters">
    <span class="label">협력업체</span><input id="vendorQ" class="field" style="width:190px" placeholder="협력업체">
    <span class="label">제번</span><input id="jobQ" class="field" style="width:190px" placeholder="제번">
    <span class="label">품명</span><input id="itemQ" class="field" style="width:190px" placeholder="품명">
    <button class="btn" onclick="search()">⌕ 조회</button>
    <label class="label" style="margin-left:12px;cursor:pointer"><input type="checkbox" id="showDone" onchange="search()" style="vertical-align:-1px"> 입고완료 포함</label>
  </section>
  <div class="histbar">입고이력</div>
  <div class="gridbox">
    <div class="grid-title">입고 처리 대기 리스트</div>
    <div class="tablewrap"><table>
      <colgroup><col style="width:44px"><col style="width:40px"><col style="width:104px"><col style="width:112px"><col style="width:96px"><col style="width:48px"><col style="width:58px"><col style="width:76px"><col style="width:140px"><col style="width:64px"><col style="width:74px"><col style="width:74px"><col style="width:110px"><col style="width:76px"><col style="width:82px"><col style="width:92px"><col style="width:92px"><col style="width:92px"><col style="width:70px"></colgroup>
      <thead><tr><th>No</th><th><input type="checkbox" id="chkAll" onclick="chkAllToggle(this)" title="전체선택 / 전체해제"></th><th>협력업체</th><th>제번</th><th>품명</th><th>공정</th><th>공정명</th><th>품번</th><th>부품명</th><th>재질</th><th>발주수량</th><th>입고수량</th><th>규격</th><th>입고단가</th><th>입고금액</th><th>발주월</th><th>입고예정일</th><th>입고월</th><th>발주자</th></tr></thead>
      <tbody id="body"></tbody>
      <tfoot><tr><th colspan="10" class="r">합계</th><th class="r" id="sumOrd">0</th><th class="r" id="sumIn">0</th><th></th><th class="r" id="sumPrice">0</th><th class="r" id="sumAmt">0</th><th colspan="4"></th></tr></tfoot>
    </table></div>
  </div>
  <div class="applybar"><span class="label">입고일</span><input id="inDate" class="field" type="date"><button class="btn primary" onclick="applyReceipt()">▣ 입고처리</button><span id="selectedText" style="color:#68757f">선택 0건</span></div>
  <footer class="foot"><button class="btn" onclick="search()">⌕ 검색</button><button class="btn" onclick="save()">▣ 저장</button><button class="btn" onclick="window.parent?.closeActive?.()">⊠ 닫 기</button><button class="btn warn" onclick="cancelOrder()">✖ 발주취소</button><button class="btn warn" onclick="cancelReceipt()">✖ 입고취소</button><span class="msg" id="message">입고 처리 대기 자료를 조회했습니다.</span><span class="right" id="countText"></span></footer>
</div>
<script>
const rows=[];
let view=[...rows];
let dirty=false;   /* v26: 입고취소만 하고 저장하는 경우도 DB에 반영하기 위한 변경 플래그 */
const money=v=>Number(v||0).toLocaleString('ko-KR');
function render(){body.innerHTML=view.map((r,i)=>`<tr onclick="pick(event,${r.no})"><td class="c">${i+1}</td><td class="c"><input type="checkbox" data-no="${r.no}" onchange="summary()"></td><td>${r.vendor}</td><td>${r.job}</td><td>${r.item}</td><td class="c">${r.proc}</td><td class="c">${r.procName}</td><td>${r.part}</td><td>${r.partName}</td><td class="c">${r.mat}</td><td class="r">${r.ord}</td><td class="r">${r.inQty}</td><td>${r.spec}</td><td class="r">${money(r.price)}</td><td class="r">${money(r.amt)}</td><td class="c">${r.odate}</td><td class="c">${r.edate}</td><td class="c">${r.idate}</td><td class="c">${r.owner}</td></tr>`).join('');
sumOrd.textContent=money(view.reduce((a,r)=>a+(r.ord||0),0));sumIn.textContent=money(view.reduce((a,r)=>a+(r.inQty||0),0));sumPrice.textContent=money(view.reduce((a,r)=>a+(r.price||0),0));sumAmt.textContent=money(view.reduce((a,r)=>a+(r.amt||0),0));countText.textContent=`${view.length}건`;summary()}
/* v252: 제목행 마스터 체크박스 — 전체선택/해제, 부분선택은 중간 표시 (원재료 입고와 동일) */
function chks(){return [...document.querySelectorAll('#body input[type=checkbox]')]}
function chkAllToggle(el){chks().forEach(c=>c.checked=el.checked);summary();
 msg(el.checked?`${chks().length}건을 모두 선택했습니다.`:'선택을 모두 해제했습니다.')}
function syncChkAll(){
 const all=document.getElementById('chkAll');if(!all)return;
 const cs=chks(),on=cs.filter(c=>c.checked).length;
 all.checked=cs.length>0&&on===cs.length;all.indeterminate=on>0&&on<cs.length;
}
function pick(e,no){if(e.target.tagName==='INPUT')return;const cb=document.querySelector(`#body input[data-no="${no}"]`);if(cb){cb.checked=!cb.checked;summary()}}
function selected(){const ids=[...document.querySelectorAll('#body input:checked')].map(x=>Number(x.dataset.no));return rows.filter(r=>ids.includes(r.no))}
function summary(){const s=selected();selectedText.textContent=`선택 ${s.length}건`;document.querySelectorAll('#body tr').forEach(tr=>tr.classList.toggle('sel',!!tr.querySelector('input:checked')));syncChkAll()}
/* 저장이 끝난(입고완료) 행은 대기 리스트에서 감춘다. [입고완료 포함] 을 켜면 다시 보이고 입고취소할 수 있다. */
function passFilter(r){
 const v=vendorQ.value.trim().toLowerCase(),j=jobQ.value.trim().toLowerCase(),it=itemQ.value.trim().toLowerCase();
 if(v&&!String(r.vendor||'').toLowerCase().includes(v))return false;
 if(j&&!String(r.job||'').toLowerCase().includes(j))return false;
 if(it&&!String(r.item||'').toLowerCase().includes(it))return false;
 if(!showDone.checked&&(r.status||'대기')!=='대기')return false;
 return true;
}
function applyFilter(){view=rows.filter(passFilter)}
function search(){applyFilter();render();msg(`검색 결과 ${view.length}건입니다.${showDone.checked?'':' (입고완료 건은 숨김)'}`)}
/* v95: 입고처리 = 즉시 DB 반영. 처리된 행은 대기 목록에서 빠지고 완료 팝업이 뜬다 ([입고완료 포함] 을 켜면 다시 보임). DB 미연결이면 종전처럼 화면만 바꾸고 [저장] 으로 반영. */
async function applyReceipt(){const s=selected();if(!s.length)return msg('입고 처리할 행을 선택하세요.');const d=inDate.value||new Date().toISOString().slice(0,10);
 s.forEach(r=>{r.idate=d;if(r.inQty===''||r.inQty==null||Number(r.inQty)===0)r.inQty=Number(r.ord)||0;/* v62: 입고수량 미입력 = 발주수량 */r.amt=(Number(r.price)||0)*(Number(r.inQty)||0);r.status='입고'});dirty=true;
 if(!window.MESDB||!MESDB.online){render();return msg(`${s.length}건을 ${d} 입고 처리했습니다. (DB 미연결 - 로컬, [저장]으로 반영)`)}
 msg('입고 반영 중…');
 try{await MESDB.syncLines()}catch(e){}
 let rl=0;try{rl=MESDB.reloadLines?await MESDB.reloadLines():0}catch(e){rl=-1}
 if(rl===-1){render();return msg('입고 처리 저장 실패: DB 반영이 되지 않았습니다. [저장]을 다시 눌러주세요.')}
 dirty=false;applyFilter();render();
 msg(`${s.length}건을 ${d} 입고 처리했습니다. (DB 저장 완료${showDone.checked?'':' - 대기 목록에서 제외'}) 검사실적등록에서 검사하세요.`)}
function cancelReceipt(){dirty=true;const s=selected();if(!s.length)return msg('입고취소할 행을 선택하세요.');s.forEach(r=>{r.idate='';r.amt=0;r.status='대기'});render();msg(`${s.length}건의 입고를 취소했습니다.`)}
async function cancelOrder(){const s=selected();if(!s.length)return msg('발주취소할 행을 선택하세요.');const done=s.filter(r=>r.status&&r.status!=='대기');if(done.length)return msg(`입고·확정된 ${done.length}건은 발주취소할 수 없습니다. 입고취소 후 진행하세요.`);if(!confirm(`발주 ${s.length}건을 취소(삭제)합니다. 되돌릴 수 없습니다. 계속할까요?`))return;const ids=s.map(r=>r.no);if(window.MESDB&&MESDB.online){try{await MESDB.delLines(ids)}catch(e){return msg('발주취소 실패: '+String(e.message||e).slice(0,120))}}for(let i=rows.length-1;i>=0;i--)if(ids.includes(rows[i].no))rows.splice(i,1);view=view.filter(r=>!ids.includes(r.no));render();msg(`${ids.length}건의 발주를 취소했습니다.${(window.MESDB&&MESDB.online)?' (DB 삭제 완료)':' (DB 미연결 - 로컬)'}`)}
async function save(){const applied=rows.filter(r=>r.status==='입고').length;
  if(!applied&&dirty){if(!window.MESDB||!MESDB.online)return msg('입고취소 내용을 저장했습니다. (DB 미연결 - 로컬)');
   try{await MESDB.syncLines();dirty=false;return msg('입고취소 내용을 DB에 반영했습니다. (해당 라인은 발주 상태로 복귀)')}
   catch(e){return msg('저장 실패: '+String(e.message||e).slice(0,140))}}const checked=[...document.querySelectorAll('tbody input:checked')].length;if(!applied){alert('입고 처리된 행이 없습니다.\n\n행을 선택하고 [입고처리] 버튼으로 먼저 입고 처리한 뒤 [저장]을 눌러주세요.');return msg('저장할 입고 내역이 없습니다. [입고처리]을 먼저 눌러주세요.')}if(checked)if(!confirm(`선택만 하고 [입고처리]하지 않은 행 ${checked}건은 저장되지 않습니다.\n입고 처리된 ${applied}건만 저장할까요?`))return;if(!window.MESDB||!MESDB.online)return msg('구매품 입고 내용을 저장했습니다. (DB 미연결 - 로컬)');try{await MESDB.syncLines();dirty=false;const n=rows.filter(r=>r.status==='입고').length;msg(`구매품 입고 내용을 DB에 저장했습니다. 입고 상태 ${n}건 - 검사실적등록에서 검사하세요.`)}catch(e){msg('저장 실패: '+e.message.slice(0,140))}}
function exportCsv(){const out=[['협력업체','제번','품명','공정','공정명','품번','부품명','재질','발주수량','입고수량','입고단가','입고금액','발주월','입고예정일','입고월','발주자'],...view.map(r=>[r.vendor,r.job,r.item,r.proc,r.procName,r.part,r.partName,r.mat,r.ord,r.inQty,r.price,r.amt,r.odate,r.edate,r.idate,r.owner])];const csv='\ufeff'+out.map(a=>a.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='purchase_receipt_input.csv';a.click();URL.revokeObjectURL(a.href)}
function msg(t){message.textContent=t}
inDate.value=new Date().toISOString().slice(0,10);applyFilter();render();window.MES={search,save,exportCsv,setMessage:msg};
</script>
<script src="mes_sample.js?v=169"></script><script src="mes_scene.js?v=67"></script><script src="mes_demo.js?v=67"></script><script src="mes_db.js?v=171"></script>
<script>MESDB.lines({page:"purchase_receipt_input",category:"구매품",statuses:["발주", "입고"],map:{"no": {"col": "line_id", "type": "num"}, "vendor": "vendor_name", "job": "job_no", "item": "item_name", "proc": "process_code", "procName": "process_name", "part": "part_no", "partName": "part_name", "mat": "material", "spec": "spec", "ord": {"col": "order_qty", "type": "num"}, "inQty": {"col": "receipt_qty", "type": "num"}, "price": {"col": "unit_price", "type": "num"}, "amt": {"col": "receipt_amount", "type": "num"}, "odate": {"col": "order_date", "type": "date"}, "edate": {"col": "required_date", "type": "date"}, "idate": {"col": "receipt_date", "type": "date"}, "owner": "owner_name", "status": {"col": "status", "type": "status"}},get:()=>rows,render:()=>{applyFilter();render()}});</script>
<script src="mes_ctx.js?v=169"></script>
<script>
function sampleFill(){
  if(window.MESDEMO)return MESDEMO.run('purchase_receipt_input',{});
  var e=document.getElementById('message'); if(e)e.textContent='예제 모듈을 불러오지 못했습니다.';
}
</script>
</body>
</html>
