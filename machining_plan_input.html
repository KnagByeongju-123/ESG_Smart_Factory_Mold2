<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>가공계획등록</title><style>
:root{--line:#98a6b2;--line2:#c5d0d8;--blue:#2f75b5;--ink:#344757;--head1:#e8f1f8;--head2:#c8dbe9}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:"Malgun Gothic","맑은 고딕",Arial,sans-serif;font-size:12px;color:var(--ink);background:#fff;overflow:hidden}
button,input,select{font:inherit;color:inherit}.screen{height:100%;display:flex;flex-direction:column;background:#fff}
.title{height:48px;padding:8px 14px 5px;border-bottom:2px solid #3978ae;display:flex;align-items:center}.title h1{margin:0;font-size:22px;font-weight:500;color:#4b5c6a}.title h1:before{content:'◯';margin-right:6px;color:#8796a1}.title small{font-size:11px;color:#9ca7af;margin-left:12px}
.form{padding:7px 14px;background:#fafbfc;border-bottom:1px solid var(--line2)}.formrow{display:grid;grid-template-columns:78px 140px 78px 150px 90px 150px 90px minmax(160px,1fr);gap:5px;align-items:center}.formrow+.formrow{margin-top:5px}.label{font-weight:700}.field{height:27px;border:1px solid #b5c0c9;background:#fff;padding:0 6px;min-width:0}
.entrybox,.gridbox{margin:0 14px;border:1px solid var(--line);overflow:auto;background:#fff}.entrybox{height:190px}.gridbox{flex:1;min-height:0}
.searchline{height:39px;margin:0 14px;display:flex;align-items:center;gap:5px;border-left:1px solid var(--line);border-right:1px solid var(--line);padding:4px 8px;background:#f6f8fa}.searchline input{width:min(430px,48vw);height:27px;border:1px solid #aeb9c3;padding:0 7px}
.btn{height:29px;min-width:62px;border:1px solid #9ba8b4;background:linear-gradient(#fff,#dfe6eb);cursor:pointer}.btn:hover{background:#fff}
table{border-collapse:collapse;min-width:1040px;width:100%;table-layout:fixed}th,td{height:27px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:0 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}th{position:sticky;top:0;z-index:2;text-align:center;background:linear-gradient(var(--head1),var(--head2));color:#405266}tbody tr:nth-child(even) td{background:#fafcfd}tbody tr:hover td{background:#edf6fd}tbody tr.sel td{background:#2d75b7;color:#fff}.c{text-align:center}.num{text-align:right}.toolbar{height:40px;display:flex;align-items:center;gap:5px;padding:4px 14px;background:#f5f7f8;border-bottom:1px solid var(--line2)}
.foot{height:42px;display:flex;align-items:center;padding:5px 14px;border-top:1px solid var(--line);background:#eef2f5;gap:5px}.msg{margin-left:8px;color:#687784}.right{margin-left:auto;color:#7c8993}
.split{flex:1;min-height:0;display:grid;grid-template-rows:1fr 1fr;gap:10px;padding:0 14px 8px}.split .gridbox{margin:0}
@media(max-width:900px){.formrow{grid-template-columns:78px 1fr 78px 1fr}.entrybox,.gridbox,.searchline{margin-left:6px;margin-right:6px}}

.filt{padding:7px 14px;background:#fafbfc;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:14px;min-width:0}
.filt .f2{flex:0 0 auto;grid-template-columns:repeat(2,72px 220px)}
.filt .guide{flex:1 1 auto;min-width:0}
.guide{display:flex;align-items:center;gap:4px;flex-wrap:nowrap;justify-content:flex-end;min-width:0;overflow:hidden;font-size:11.5px;line-height:1}
.guide .gt{font-weight:700;color:#2e78bd;margin-right:1px;white-space:nowrap}
.guide .st{display:inline-flex;align-items:center;gap:4px;padding:2px 7px 2px 4px;border:1px solid #b9cfe4;border-radius:10px;background:#f2f8fd;color:#33506b;white-space:nowrap;flex:0 0 auto}
.guide .st b{width:14px;height:14px;border-radius:50%;background:#2e78bd;color:#fff;display:grid;place-items:center;font-size:9px;font-weight:700}
.guide .ar{color:#9db4c8;font-size:10px;flex:0 0 auto}
.guide .warn{color:#c0392b;font-weight:700;margin-left:3px;white-space:nowrap;flex:0 0 auto}
@media(max-width:1450px){.guide .gt,.guide .ar{display:none}}
@media(max-width:1150px){.guide .st b{margin-right:-2px}.guide .warn{display:none}}
.fr{display:grid;gap:5px;align-items:center}
.lb{font-weight:700;text-align:right;padding-right:3px}
.opts{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.opts label{display:flex;align-items:center;gap:3px;cursor:pointer}
.gtot td{background:#dfe9f2;font-weight:700}
.grp th{background:linear-gradient(#dbe9f5,#b9d2e6)}
.panes{flex:1;min-height:0;display:grid;gap:8px;padding:0 14px 8px}
.pane{border:1px solid var(--line);background:#fff;display:flex;flex-direction:column;min-height:0}
.ph{padding:5px 9px;font-weight:700;background:linear-gradient(var(--head1),var(--head2));color:#405266;border-bottom:1px solid var(--line2)}
.pb{flex:1;min-height:0;overflow:auto}
.f2{display:grid;grid-template-columns:repeat(4,72px minmax(110px,1fr));gap:5px;align-items:center}
.mask{position:fixed;inset:0;background:rgba(40,50,60,.3);display:none;align-items:flex-start;justify-content:center;z-index:50}
.mask.on{display:flex}
.dlg{margin-top:40px;width:min(1000px,96vw);background:#f3f6f8;border:1px solid #7d8d99;box-shadow:0 8px 26px rgba(0,0,0,.25)}
.dh{display:flex;align-items:center;height:30px;padding:0 6px 0 10px;background:linear-gradient(#eef4f9,#dbe6ef);border-bottom:1px solid #b9c6d0;font-weight:700}
.dh button{margin-left:auto;width:26px;height:20px;border:1px solid #b04a4a;background:#c9484a;color:#fff;cursor:pointer}
.db{padding:10px}
.kv{display:grid;grid-template-columns:repeat(4,84px minmax(90px,1fr));gap:4px;align-items:center;margin-bottom:8px}
.kv .lb{text-align:right}
.kv .v{border:1px solid #c3ccd4;background:#fff;height:26px;line-height:24px;padding:0 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:14px;background:#3f7fbf;border-radius:2px}

/* v21 입력란 배치 보정: 좁은 폭에서 필드를 숨기지 않고 단계적으로 줄바꿈 */
.field,.formrow input,.formrow select,.formgrid input,.formgrid select,.detail-grid input,.detail-grid select{min-width:0;max-width:100%}
.lab,.label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:1400px){.formrow{grid-template-columns:78px minmax(0,1fr) 78px minmax(0,1fr)}}
@media(max-width:880px){.formrow{grid-template-columns:78px minmax(0,1fr)}}
.formrow>*{min-width:0}
/* v81: 가공 공정 리스트 인라인 편집(드롭다운) */
.phbar{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.phbar .btn{height:23px;min-width:0;padding:0 9px;font-size:11px;font-weight:400}
.phbar .sp{margin-left:auto;font-weight:400;color:#5d6f7f;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
td.pad0{padding:1px 2px}
.rsel{width:100%;height:23px;border:1px solid #c3ccd4;background:#fff;font:inherit;padding:0 1px}
.rsel.on{background:#eef5fc;border-color:#6f9fd0}
.rname{width:100%;height:23px;border:1px solid #c3ccd4;background:#fff;font:inherit;padding:0 4px;text-align:center}
/* v96: 기준공정명은 열마다 다른 짙은 바탕 + 흰 글자 (색은 paintName 이 인라인으로) */
.rname.hdr{font-weight:700;border-color:transparent}
.rname.hdr::placeholder{color:#e8eef5;opacity:.8}
/* v87: 행열 전환 — 기준공정이 열, 공정1~10이 행 */
#rtable th[data-i],#rtable td[data-i],#rtable th.phc,#rtable td.phc{width:140px;min-width:140px;max-width:140px}
#rtable th.phc{color:#aeb9c4;font-weight:400}
#rtable td.phc{background:#fbfcfe}
#rtable td.phc .rsel{color:#9aa7b2}
#rtable td.phc .rname[disabled]{background:#f4f7fa;border-color:#dde4ea}
/* v92: 노란 dirty 배경·라디오 선택 하이라이트 제거 — 미저장 표시는 기준공정명 테두리로만.
   열 머리 클릭 선택(삭제 대상)은 파란 밑줄로만 표시 */
#rhead th[data-i].hsel{box-shadow:inset 0 -3px 0 #2e78bd;background:#eef5fc}
#rhead th[data-i]{cursor:grab}
#rtable .rlb{position:sticky;left:0;z-index:1;background:#eef2f6;font-weight:700;color:#3d4c59;text-align:center;white-space:nowrap;width:84px;min-width:84px}
#rtable .dirty .rname{border-color:#d8a33c}
#rhead th[data-i]{cursor:grab}
#pbody tr.dover td{background:#eaf3fc;box-shadow:inset 0 1px 0 #6f9fd0,inset 0 -1px 0 #6f9fd0}
/* v97: 부품 리스트 — 열폭은 내용 글자 기준(auto), 남는 폭은 마지막 열이 흡수 */
#ptable{table-layout:auto;width:100%;min-width:0}
#ptable th,#ptable td{width:1%;white-space:nowrap;overflow:visible;text-overflow:clip;padding:0 10px}
#ptable th:last-child,#ptable td:last-child{width:auto}
#ptable td.stp,#ptable td.spn{font-weight:600}
/* v95: 부품 리스트 제목행 클릭 정렬 (⇅ = 정렬 가능, ▲▼ = 현재 정렬) */
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{background:#dbe7f3}
th.sortable .ar{color:#8a97a2;font-size:10px;margin-left:3px}
th.sortable.on{color:#1d5da3}
th.sortable.on .ar{color:#1d5da3}
#pbody tr.unsaved td:not(.stp):not(.spn){color:#7a8794}
#pbody tr.unsaved .us{font-size:10px;color:#c0392b;border:1px solid #e3b4ae;border-radius:8px;padding:0 5px;margin-left:4px;vertical-align:1px}
</style></head><script>/* v116: 기준공정ID 는 DB에 숫자로 두고 화면에만 두 자리(05)로 표시 */
function P2(v){if(v===''||v==null)return '';const n=Number(v);return isNaN(n)?String(v):String(n).padStart(2,'0')}</script>
<body><div class="screen"><div class="title"><h1>가공계획등록</h1><small>구매관리 · 가공</small></div><section class="filt"><div class="f2"><div class="lb">제번</div><div><input id="q_job" class="field"></div><div class="lb">품번</div><div><input id="q_item" class="field"></div></div><div class="guide"><span class="gt">사용순서</span><span class="st"><b>1</b>제번·조 선택</span><span class="ar">▸</span><span class="st"><b>2</b>공정 수정 시 [공정저장]</span><span class="ar">▸</span><span class="st"><b>3</b>번호를 부품으로 드래그해 적용</span><span class="ar">▸</span><span class="st"><b>4</b>[저장]</span><span class="warn">※ 체크 없으면 전체 저장</span></div></section><div class="panes" style="grid-template-rows:1fr 1.2fr"><div class="panes" style="grid-template-columns:470px 1fr;grid-template-rows:1fr;padding:0;gap:8px"><div class="pane"><div class="ph">제번 리스트</div><div class="pb"><table style="min-width:0"><thead><tr><th style="width:46px">NO</th><th style="width:130px">제번</th><th style="width:64px">공정(조)수</th><th style="width:40px">조</th><th style="width:104px">가공완료일</th><th>T/O 예정일</th></tr></thead><tbody id="hbody"></tbody></table></div></div><div class="pane"><div class="ph"><div class="phbar"><span>가공 공정 리스트</span><button class="btn" onclick="routeAdd()" title="기준공정 열을 추가합니다">+ 기준공정</button><button class="btn" onclick="routeSave()" title="변경된 기준공정을 저장합니다">▤ 공정저장</button><button class="btn" onclick="routeDel()" title="선택한 기준공정을 삭제합니다">✕ 공정삭제</button><span class="sp" id="routeMsg">공정 수정 후 [▤ 공정저장] · 번호(열 머리)를 부품 리스트로 끌어 적용 · 번호 클릭=삭제 대상 선택</span></div></div><div class="pb"><table id="rtable" style="min-width:0"><thead id="rhead"></thead><tbody id="rbody"></tbody></table></div></div></div><div class="pane"><div class="ph">부품 리스트</div><div class="pb"><table id="ptable"><thead><tr><th><input type="checkbox" id="pchkAll" onclick="pchkAllToggle(this)" title="전체선택 / 전체해제"></th><th class="sortable" id="thPno" onclick="psort('part_no')">부품코드<span class="ar">⇅</span></th><th class="sortable" id="thPnm" onclick="psort('part_name')">부품명<span class="ar">⇅</span></th><th title="PartList 수량 — 외주가공 발주 기본 수량으로 쓰입니다">수량</th><th>기준공정</th><th>공정1</th><th>공정2</th><th>공정3</th><th>공정4</th><th>공정5</th><th>공정6</th><th>공정7</th><th>공정8</th><th>공정9</th><th>공정10</th><th>공정11</th><th>공정12</th></tr></thead><tbody id="pbody"></tbody></table></div></div></div> <footer class="foot"><button class="btn" onclick="search()">⌕ 검색</button><button class="btn" onclick="save()">▤ 저장</button><button class="btn" onclick="del_()">✕ 삭제</button><button class="btn" onclick="pr()">▤ PRINT</button><button class="btn" onclick="window.parent?.closeActive?.()">⊠ 닫기</button><span class="msg" id="message">제번을 선택하면 부품별 가공공정이 표시됩니다.</span><span class="right" id="countText"></span></footer></div><script>const heads=[];const routes=[];const parts=[];const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const n=v=>v==null?'':Number(v).toLocaleString();const p=v=>v==null?'':Number(v).toFixed(2)+'%';
const msg=t=>message.textContent=t;
let view=[...heads];
/* v80: 공정 칸은 코드 대신 공정명으로 보여준다 (코드는 툴팁으로 유지) */
const PROCN={};
async function loadProcs(){
 try{const rs=await MESDB.table('processes').select('select=process_code,process_name');
  Object.keys(PROCN).forEach(k=>delete PROCN[k]);
  (rs||[]).forEach(r=>{if(r.process_code)PROCN[r.process_code]=r.process_name||r.process_code});
 }catch(e){}
}
const pname=c=>{const k=String(c||'').trim();return k?(PROCN[k]||k):''};
/* v97: 공정 칸 색 — 가공 공정 리스트와 같은 규칙 (공정1~6 순서색, 열처리는 옅은 빨강) */
function stepStyle(c,i){
 if(!c||typeof STEPCOL==='undefined')return '';
 const nm=String(PROCN[c]||c||'');
 const col=(c==='HQ'||nm.indexOf('열처리')>=0)?HQCOL:STEPCOL[i%6];
 return ` class="c stp keepbg" style="background:${col[0]}!important;color:${col[1]}!important"`;
}
const cells=(a,n)=>Array.from({length:n},(_,i)=>{const c=a&&a[i]||'';
 return `<td${c?stepStyle(c,i):' class="c"'} title="${esc(c)}">${esc(pname(c))}</td>`}).join('');
/* 기준공정 칸 — 가공 공정 리스트에서 같은 이름을 가진 열의 짙은 바탕색 + 흰 글자 */
function spCell(nm){
 nm=String(nm||'');if(!nm)return '<td class="c"></td>';
 const c=typeof nameColor==='function'?nameColor(nm):'';
 if(!c)return `<td class="c">${esc(nm)}</td>`;
 /* keepbg: mes_ctx 의 줄무늬·마우스오버 배경(!important)에서 제외되는 표시 */
 return `<td class="c spn keepbg" title="${esc(nm)}" style="background:${c}!important;color:#fff!important">${esc(nm)}</td>`;
}
function render(){
 hbody.innerHTML=view.map((r,i)=>`<tr onclick="pick(${i},this)"><td class="c">${r.row_no}</td><td>${esc(r.job_no)}</td><td class="c">${r.set_qty||''}</td><td class="c">${r.jo||''}</td><td class="c">${esc(r.machining_completion_date||'')}</td><td class="c">${esc(r.s1_date||'')}</td></tr>`).join('');
 renderRoutes();
 countText.textContent=view.length+'건';pbody.innerHTML='';
}
let selIdx=-1;
const PROW=p=>`<tr class="${p.row_no==null?'unsaved':''}" title="${p.row_no==null?'미저장 — PartList 기본값. [저장]하면 가공계획으로 확정됩니다':''}"><td class="c"><input type="checkbox" data-i="${parts.indexOf(p)}" data-row="${p.row_no??''}"></td><td>${esc(p.part_no)}${p.row_no==null?' <span class="us">미저장</span>':''}</td><td>${esc(p.part_name)}</td><td class="r">${p.qty==null?'':Number(p.qty)}</td>${spCell(p.standard_process)}${cells(p.steps,12)}</tr>`;
/* v95: 부품 리스트 정렬 — 제목행(부품코드·부품명) 클릭으로 오름/내림/해제 순환.
   parts 배열 자체는 건드리지 않고 화면만 정렬한다 (PROW 의 data-i=parts.indexOf 가 그대로 유효).
   체크 상태는 재렌더 후 되살린다. */
var PSORT={key:'',dir:1};
function prows(){
 if(!PSORT.key)return parts.slice();
 const k=PSORT.key,d=PSORT.dir;
 return parts.slice().sort((a,b)=>d*String(a[k]||'').localeCompare(String(b[k]||''),'ko',{numeric:true}));
}
document.addEventListener('change',e=>{
 if(e.target&&e.target.matches&&e.target.matches('#pbody input[type=checkbox]'))syncPchkAll();
});
function prender(){
 const on=new Set([...document.querySelectorAll('#pbody input[type=checkbox]:checked')].map(c=>c.dataset.i));
 pbody.innerHTML=parts.length?prows().map(PROW).join(''):PEMPTY;
 on.forEach(i=>{const cb=document.querySelector(`#pbody input[data-i="${i}"]`);if(cb)cb.checked=true});
 syncPchkAll();
 markSortHead();
}
function markSortHead(){
 const m={part_no:'thPno',part_name:'thPnm'};
 Object.keys(m).forEach(k=>{const th=document.getElementById(m[k]);if(!th)return;
  const on=PSORT.key===k;th.classList.toggle('on',on);
  const ar=th.querySelector('.ar');if(ar)ar.textContent=on?(PSORT.dir>0?'▲':'▼'):'⇅'});
}
/* v99: 부품 리스트 전체선택 — 제목행 체크박스로 전체선택/해제, 개별 체크 시 상태 동기화 */
function pchkAllToggle(el){
 document.querySelectorAll('#pbody input[type=checkbox]').forEach(c=>c.checked=el.checked);
 syncPchkAll();
 msg(el.checked?`부품 ${parts.length}건을 모두 선택했습니다.`:'부품 선택을 모두 해제했습니다.');
}
function syncPchkAll(){
 const all=document.getElementById('pchkAll');if(!all)return;
 const cs=[...document.querySelectorAll('#pbody input[type=checkbox]')];
 const on=cs.filter(c=>c.checked).length;
 all.checked=cs.length>0&&on===cs.length;
 all.indeterminate=on>0&&on<cs.length;
}
function psort(k){
 if(PSORT.key!==k){PSORT.key=k;PSORT.dir=1}
 else if(PSORT.dir>0)PSORT.dir=-1;
 else {PSORT.key='';PSORT.dir=1}
 prender();
 msg(PSORT.key?`${k==='part_no'?'부품코드':'부품명'} ${PSORT.dir>0?'오름차순':'내림차순'} 정렬`:'정렬을 해제했습니다 (등록 순서).');
}
const PEMPTY='<tr><td colspan="17" class="c" style="height:100px;color:#8a97a2">이 조의 PartList 부품이 없습니다. 설계관리 &gt; PartList 등록(원재료)에서 해당 조로 부품을 먼저 등록하세요.</td></tr>';
function pick(i,tr){const r=view[i];if(!r)return;selIdx=i;
 document.querySelectorAll('#hbody tr').forEach((x,k)=>x.classList.toggle('sel',k===i));
 if(typeof loadParts==='function')return loadParts(r.job_no,r.jo);
 const rs=parts.filter(p=>p.job_no===r.job_no);
 prender();
 msg(`${r.job_no} / ${r.jo}조 (${r.jo}/${r.set_qty}) · 부품 ${rs.length}건`);}

var RPAD=4;  /* v88: 뒤에 붙는 빈공정 열 수 */
function phStep(k,el){
 const v=String(el&&el.value||'').trim();if(!v)return;
 const no=routes.reduce((m,r)=>Math.max(m,Number(r.standard_process_no)||0),0)+1;
 const r={row_no:null,standard_process_no:no,standard_process_name:'',
   steps:Array.from({length:k+1},(_,x)=>x===k?v:''),_dirty:true,_new:true};
 r.standard_process_name=routeName(r.steps);
 routes.push(r);routeIdx=routes.length-1;
 renderRoutes();
 const th=document.querySelector(`#rhead th[data-i="${routeIdx}"]`);
 if(th&&th.scrollIntoView)th.scrollIntoView({block:'nearest',inline:'nearest'});
 msg(`기준공정 ${no} 열이 추가되었습니다. 공정을 더 고른 뒤 [▤ 공정저장]하세요.`);
}
function markColDirty(i,on){document.querySelectorAll(`#rtable th[data-i="${i}"],#rtable td[data-i="${i}"]`)
 .forEach(x=>x.classList.toggle('dirty',on!==false))}
function renderRoutes(){
 if(!window.rbody)return;
 const rh=document.getElementById('rhead');
 routeIdx=-1;
 /* v88: 데이터 열 뒤에 빈공정 4열을 항상 붙여 균형을 맞춘다.
    빈공정 열에서 공정을 고르면 새 기준공정이 자동 추가된다. */
 const PH=Array.from({length:RPAD});
 /* v92: 적용은 드래그&드롭으로만 — 라디오·[부품에 적용] 버튼 없음.
    번호 클릭은 [✕ 공정삭제] 대상 선택(재클릭 해제) */
 if(rh)rh.innerHTML='<tr><th class="rlb">기준공정</th>'
  +routes.map((r,i)=>`<th data-i="${i}" draggable="true" onclick="pickRouteHead(${i})" title="끌어서 부품 리스트에 놓으면 적용됩니다 (부품 체크 시 체크된 전체) · 클릭=삭제 대상 선택">${esc(P2(r.standard_process_no))}</th>`).join('')
  +PH.map(()=>'<th class="phc" title="아래에서 공정을 고르면 새 기준공정이 추가됩니다">＋</th>').join('')+'</tr>';
 rbody.innerHTML=
  `<tr><td class="rlb">기준공정명</td>${routes.map((r,i)=>`<td class="pad0" data-i="${i}"><input class="rname hdr keepcolor" data-i="${i}" value="${esc(r.standard_process_name||'')}" placeholder="자동생성" oninput="routeNameEdit(${i},this.value)"></td>`).join('')}${PH.map(()=>'<td class="pad0 phc"><input class="rname" disabled placeholder="자동생성"></td>').join('')}</tr>`
  +Array.from({length:RSEQN},(_,k)=>`<tr><td class="rlb">공정${k+1}</td>${routes.map((r,i)=>`<td class="pad0" data-i="${i}"><select class="rsel" data-i="${i}" data-k="${k}" onchange="routeStep(${i},${k},this.value)">${OPTS}</select></td>`).join('')}${PH.map(()=>`<td class="pad0 phc"><select class="rsel" onchange="phStep(${k},this)">${OPTS}</select></td>`).join('')}</tr>`).join('');
 rbody.querySelectorAll('select.rsel').forEach(sl=>{
  const i=+sl.dataset.i,k=+sl.dataset.k;
  const v=((routes[i]||{}).steps||[])[k]||'';
  sl.value=v;
  if(v&&sl.value!==v){sl.insertAdjacentHTML('beforeend',`<option value="${esc(v)}">${esc(pname(v))}</option>`);sl.value=v}
  paintStep(sl,k,v);
 });
 routes.forEach((r,i)=>paintName(rbody.querySelector(`.rname[data-i="${i}"]`),i));
 if(parts.length&&typeof prender==='function')prender();
 routes.forEach((r,i)=>markColDirty(i,!!r._dirty));
 markRouteHead();
 repaintLater();
}
function markRouteHead(){
 document.querySelectorAll('#rhead th[data-i]').forEach(x=>x.classList.toggle('hsel',+x.dataset.i===routeIdx))}
/* v85: 기준공정 선택은 체크박스로 통일한다.
   여러 개를 체크해도 [공정삭제]는 그대로 동작하고,
   [부품에 적용]은 마지막에 체크한 행(또는 체크가 하나뿐이면 그 행)을 쓴다. */
/* v85: 적용 결과를 [부품에 적용] 버튼 옆에 띄운다. 하단 회색 안내는 놓치기 쉽다. */
function rmsg(t,err){const e=document.getElementById('routeMsg');
 if(e){e.textContent=t;e.style.color=err?'#c0392b':'#1360a8';e.style.fontWeight='700'}
 msg(t)}
function pickRouteHead(i){
 if(routeIdx===i){routeIdx=-1;markRouteHead();return msg('기준공정 선택을 해제했습니다.')}
 const r=routes[i];if(!r)return;
 routeIdx=i;markRouteHead();
 const st=(r.steps||[]).filter(Boolean);
 msg(`기준공정 ${P2(r.standard_process_no)} 선택 · ${st.length?st.map(c=>PROCN[c]||c).join(' → '):'공정 없음'} — [✕ 공정삭제] 대상`);
}
function routeStep(i,k,v){const r=routes[i];if(!r)return;
 const st=Array.from({length:RSEQN},(_,x)=>(r.steps||[])[x]||'');
 const nv=String(v||'').trim();
 if(st[k]===nv)return;   /* v94: 같은 값이면 무시 — 콤보 blur 재발신 등으로 dirty/이름이 바뀌지 않게 */
 st[k]=nv;
 while(st.length&&!st[st.length-1])st.pop();
 r.steps=st;r._dirty=true;routeIdx=i;
 if(!r._nameEdited)r.standard_process_name=routeName(st);
 markColDirty(i);
 const ni=rbody.querySelector(`.rname[data-i="${i}"]`);if(ni&&!r._nameEdited)ni.value=r.standard_process_name;
 paintStep(rbody.querySelector(`select[data-i="${i}"][data-k="${k}"]`),k,st[k]);
 markRouteHead();
 msg(`기준공정 ${P2(r.standard_process_no)} 공정${k+1} 변경 · [▤ 공정저장]을 눌러야 확정됩니다.`);}
function routeNameEdit(i,v){const r=routes[i];if(!r)return;
 r.standard_process_name=v;r._nameEdited=true;r._dirty=true;
 markColDirty(i);}
function routeAdd(){
 const no=routes.reduce((m,r)=>Math.max(m,Number(r.standard_process_no)||0),0)+1;
 routes.push({row_no:null,standard_process_no:no,standard_process_name:'',steps:[],_dirty:true,_new:true});
 routeIdx=routes.length-1;renderRoutes();
 const th=document.querySelector(`#rhead th[data-i="${routeIdx}"]`);if(th&&th.scrollIntoView)th.scrollIntoView({block:'nearest',inline:'nearest'});
 msg(`기준공정 ${no} 열을 추가했습니다. 공정을 고른 뒤 [▤ 공정저장]하세요.`);}
async function routeSave(){
 const tg=routes.filter(r=>r._dirty);
 if(!tg.length)return msg('변경된 기준공정이 없습니다.');
 if(!_online())return msg('DB 미연결 상태에서는 저장할 수 없습니다.');
 const bad=tg.find(r=>!(r.steps||[]).filter(Boolean).length);
 if(bad)return msg(`기준공정 ${P2(bad.standard_process_no)}: 공정을 하나 이상 선택하세요.`);
 try{
  const today=new Date().toISOString().slice(0,10);
  for(const r of tg){
   const st=(r.steps||[]).filter(Boolean);
   const id=Number(r.standard_process_no);
   const nm=(r.standard_process_name||'').trim()||routeName(st);
   /* 기준정보 › 가공 기준공정관리 와 같은 마스터에 저장한다 */
   await MESDB.table('standard_processes').upsert({standard_process_id:id,
     standard_process_name:nm,owner_name:r.owner_name||OWNER(),registered_date:today},'standard_process_id');
   await MESDB.table('standard_process_steps').delete({standard_process_id:id});
   if(st.length)await MESDB.table('standard_process_steps')
     .upsert(st.map((c,i)=>({standard_process_id:id,sequence:i+1,process_code:c})));
   await MESDB.table('machining_standard_routes')
     .upsert({standard_process_no:id,standard_process_name:nm,steps:st},'standard_process_no');
  }
  try{MESDB.notify&&MESDB.notify(['standard_processes','standard_process_steps','machining_standard_routes'])}catch(e){}
  await loadRoutes();
  msg(`기준공정 ${tg.length}건을 저장했습니다. (기준정보 › 가공 기준공정관리에도 반영)`);
 }catch(e){msg('기준공정 저장 실패: '+String(e.message||e).slice(0,140))}
}
async function routeDel(){
 const idx=routes[routeIdx]?[routeIdx]:[];
 if(!idx.length)return msg('삭제할 기준공정의 번호(열 머리)를 클릭해 선택하세요.');
 const ids=idx.map(i=>routes[i]).filter(r=>r&&!r._new).map(r=>Number(r.standard_process_no));
 if(ids.length&&!_online())return msg('DB 미연결 상태에서는 삭제할 수 없습니다.');
 if(!confirm(`기준공정 ${idx.length}건을 삭제하시겠습니까?`))return;
 try{
  for(const id of ids){
   await MESDB.table('standard_process_steps').delete({standard_process_id:id});
   await MESDB.table('standard_processes').delete({standard_process_id:id});
   await MESDB.table('machining_standard_routes').delete({standard_process_no:id});
  }
  try{MESDB.notify&&MESDB.notify(['standard_processes','standard_process_steps','machining_standard_routes'])}catch(e){}
  idx.slice().sort((a,b)=>b-a).forEach(i=>{if(routes[i]&&routes[i]._new)routes.splice(i,1)});
  routeIdx=-1;
  if(ids.length)await loadRoutes();else renderRoutes();
  msg(`기준공정 ${idx.length}건을 삭제했습니다.`);
 }catch(e){msg('기준공정 삭제 실패: '+String(e.message||e).slice(0,140))}
}
/* 선택한 기준공정의 공정순서를 부품(체크한 행, 없으면 전체)에 적용 */
/* v89: 적용 공통부 — [부품에 적용] 버튼과 드래그&드롭이 함께 쓴다 */
function applyRouteCore(ri,idx,recheck){
 const r=routes[ri];
 if(!r)return rmsg('가공 공정 리스트에서 적용할 기준공정을 체크하세요.',1);
 if(r._dirty)return rmsg('변경된 기준공정입니다. [▤ 공정저장] 후 적용하세요.',1);
 const seq=(r.steps||[]).filter(Boolean);
 if(!seq.length)return rmsg('공정이 비어 있는 기준공정입니다.',1);
 const job=(view[selIdx]&&view[selIdx].job_no)||(q_job.value||'').trim();
 if(!job)return rmsg('제번을 선택하세요.',1);
 if(!parts.length)return rmsg('적용할 부품이 없습니다. PartList를 먼저 등록하세요.',1);
 idx=(idx||[]).filter(k=>parts[k]);
 if(!idx.length)return rmsg('적용할 부품 행이 없습니다.',1);
 idx.forEach(k=>{const p=parts[k];p.steps=[...seq];p.standard_process=r.standard_process_name});
  prender();
 /* v89: 개별 드롭(recheck=false)은 행을 자동 체크하지 않는다 —
    연달아 다른 행에 개별 드롭할 때 앞 행이 대상에 끼는 것을 막는다 */
 if(recheck!==false)idx.forEach(k=>{const cb=document.querySelector(`#pbody input[data-i="${k}"]`);if(cb)cb.checked=true});
 syncPchkAll();
 routeIdx=ri;markRouteHead();
 rmsg(`부품 ${idx.length}건에 공정순서를 적용했습니다 — ${seq.map(c=>PROCN[c]||c).join(' → ')} · 기준공정 ${P2(r.standard_process_no)}. [▤ 저장]을 눌러야 확정됩니다.`);
}
function pchecked(){return [...document.querySelectorAll('#pbody input[type=checkbox]:checked')]
  .map(c=>Number(c.dataset.i)).filter(n=>!Number.isNaN(n))}
/* v89: 기준공정 열 머리(번호 칸)를 끌어 부품 리스트에 놓으면 적용된다.
 *  · 부품이 체크되어 있으면 → 체크된 부품 전체에
 *  · 체크가 없으면        → 놓은 그 행 하나에만        */
var RDRAG=-1;
(function(){
 const rh=document.getElementById('rhead');
 if(!rh||!window.pbody)return;
 const pclear=()=>pbody.querySelectorAll('tr.dover').forEach(t=>t.classList.remove('dover'));
 const prow=e=>{const tr=e.target&&e.target.closest?e.target.closest('#pbody tr'):null;
  return tr&&tr.querySelector('input[data-i]')?tr:null};
 rh.addEventListener('dragstart',e=>{
  if(document.body.classList.contains('mes-le-on'))return;  /* 배치 편집 중에는 드래그 잠금 */
  const th=e.target&&e.target.closest?e.target.closest('th[data-i]'):null;
  if(!th)return;
  RDRAG=+th.dataset.i;routeIdx=RDRAG;markRouteHead();
  e.dataTransfer.effectAllowed='copy';
  try{e.dataTransfer.setData('text/plain','route')}catch(_){}
  msg(`기준공정 ${routes[RDRAG]?P2(routes[RDRAG].standard_process_no):''} — 부품 리스트 행 위에 놓으세요. (체크된 부품이 있으면 체크 전체에 적용)`);
 });
 rh.addEventListener('dragend',()=>{RDRAG=-1;pclear()});
 pbody.addEventListener('dragover',e=>{
  if(RDRAG<0)return;const tr=prow(e);if(!tr)return;
  e.preventDefault();e.dataTransfer.dropEffect='copy';
  pclear();
  const chk=pchecked();
  if(chk.length)chk.forEach(k=>{const cb=document.querySelector(`#pbody input[data-i="${k}"]`);
    const t=cb&&cb.closest('tr');if(t)t.classList.add('dover')});
  else tr.classList.add('dover');
 });
 pbody.addEventListener('drop',e=>{
  if(RDRAG<0)return;const tr=prow(e);if(!tr)return;
  e.preventDefault();
  const chk=pchecked();
  const idx=chk.length?chk:[Number(tr.querySelector('input[data-i]').dataset.i)];
  applyRouteCore(RDRAG,idx,chk.length>0);
  RDRAG=-1;pclear();
 });
})();
let _partsTok=0;
async function loadParts(job,jo){
 const _tk=++_partsTok;
 jo=String(jo||(view[selIdx]&&view[selIdx].jo)||'1');
 parts.length=0;
 if(!(window.MESDB&&MESDB.online)){pbody.innerHTML=PEMPTY;return}
 try{
  /* v85: 저장분(machining_plan_parts)과 PartList 를 합쳐 항상 전체 부품을 보여준다.
     이전에는 저장분이 한 건이라도 있으면 PartList 를 읽지 않아,
     일부만 저장한 뒤 나머지 부품이 화면에서 사라졌다. */
  const [rs,pl]=await Promise.all([
   MESDB.table('machining_plan_parts')
    .select(`select=*&job_no=eq.${encodeURIComponent(job)}&process_code=eq.${encodeURIComponent(jo)}&order=row_no`),
   MESDB.table('partlist_materials')
    .select(`select=part_no,part_name,process_code,qty&job_no=eq.${encodeURIComponent(job)}&order=row_no`)
    .then(a=>a.filter(x=>(window.MESJO?MESJO.norm(x.process_code):String(x.process_code||''))===jo))
    .catch(()=>[])]);
  if(_tk!==_partsTok)return;
  const saved=new Map(rs.map(r=>[String(r.part_no||''),r]));
  const seen=new Set();
  /* PartList 순서를 기준으로 — 저장된 부품은 저장값, 없는 부품은 기본값 */
  pl.forEach(r=>{const k=String(r.part_no||'');seen.add(k);const sv=saved.get(k);
   if(sv)parts.push({row_no:sv.row_no,job_no:job,part_no:sv.part_no,part_name:sv.part_name||r.part_name||'',
     /* v101: 수량 — 저장값이 있으면 그것, 없으면 PartList 수량 */
     qty:(sv.qty!=null?Number(sv.qty):(r.qty!=null?Number(r.qty):1)),
     standard_process:sv.standard_process||'',steps:Array.isArray(sv.steps)?sv.steps:[]});
   /* v85: 미저장 부품은 공정을 비워 둔다.
      기본공정을 미리 채워두면 이미 정해진 것처럼 보여 헷갈린다.
      [부품에 적용]으로 기준공정을 골라야 채워진다. */
   else parts.push({row_no:null,job_no:job,part_no:r.part_no,part_name:r.part_name||'',
     qty:(r.qty!=null?Number(r.qty):1),standard_process:'',steps:[]})});
  /* PartList 에서 빠졌지만 저장돼 있는 부품도 남긴다 */
  rs.forEach(r=>{if(seen.has(String(r.part_no||'')))return;
   parts.push({row_no:r.row_no,job_no:job,part_no:r.part_no,part_name:r.part_name||'',
     qty:(r.qty!=null?Number(r.qty):1),
     standard_process:r.standard_process||'',steps:Array.isArray(r.steps)?r.steps:[]})});
  prender();
  q_job.value=job;
  const unsaved=parts.filter(p=>p.row_no==null).length;
  msg(`${job} ${jo}조 · 부품 ${parts.length}건`+
      (unsaved?` · 공정 미지정 ${unsaved}건 — 기준공정을 체크하고 [부품에 적용] 하세요.`:' (가공계획 확정)'));
 }catch(e){msg('부품 조회 실패: '+String(e.message||e).slice(0,110))}
}
