<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>수주등록</title><style>
:root{--line:#98a6b2;--line2:#c5d0d8;--blue:#2f75b5;--ink:#344757;--head1:#e8f1f8;--head2:#c8dbe9}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:"Malgun Gothic","맑은 고딕",Arial,sans-serif;font-size:12px;color:var(--ink);background:#fff;overflow:hidden}
button,input,select{font:inherit;color:inherit}.screen{height:100%;display:flex;flex-direction:column;background:#fff}
.title{height:48px;padding:8px 14px 5px;border-bottom:2px solid #3978ae;display:flex;align-items:center}.title h1{margin:0;font-size:22px;font-weight:500;color:#4b5c6a}.title h1:before{content:'◯';margin-right:6px;color:#8796a1}.title small{font-size:11px;color:#9ca7af;margin-left:12px}
.form{padding:7px 14px;background:#fafbfc;border-bottom:1px solid var(--line2)}.formrow{display:grid;grid-template-columns:78px 140px 78px 150px 90px 150px 90px minmax(160px,1fr);gap:5px;align-items:center}.formrow+.formrow{margin-top:5px}.label{font-weight:700}.field{height:27px;border:1px solid #b5c0c9;background:#fff;padding:0 6px;min-width:0}
.entrybox,.gridbox{margin:0 14px;border:1px solid var(--line);overflow:auto;background:#fff}.entrybox{height:190px}.gridbox{flex:1;min-height:0}
.searchline{height:39px;margin:0 14px;display:flex;align-items:center;gap:5px;border-left:1px solid var(--line);border-right:1px solid var(--line);padding:4px 8px;background:#f6f8fa}.searchline input{width:min(430px,48vw);height:27px;border:1px solid #aeb9c3;padding:0 7px}
.btn{height:29px;min-width:62px;border:1px solid #9ba8b4;background:linear-gradient(#fff,#dfe6eb);cursor:pointer}.btn:hover{background:#fff}
table{border-collapse:collapse;min-width:1040px;width:100%;table-layout:fixed}th,td{height:27px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:0 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}th{position:sticky;top:0;z-index:2;text-align:center;background:linear-gradient(var(--head1),var(--head2));color:#405266}tbody tr:nth-child(even) td{background:#fafcfd}tbody tr:hover td{background:#edf6fd}tbody tr.sel td{background:#2d75b7;color:#fff}.c{text-align:center}.num{text-align:right}.toolbar{height:40px;display:flex;align-items:center;gap:5px;padding:4px 14px;background:#f5f7f8;border-bottom:1px solid var(--line2)}
.foot{height:42px;display:flex;align-items:center;padding:5px 14px;border-top:1px solid var(--line);background:#eef2f5;gap:5px}.msg{margin-left:8px;color:#687784}.right{margin-left:auto;color:#7c8993}
.split{flex:1;min-height:0;display:grid;grid-template-rows:1fr 1fr;gap:10px;padding:0 14px 8px}.split .gridbox{margin:0}
@media(max-width:900px){.formrow{grid-template-columns:78px 1fr 78px 1fr}.entrybox,.gridbox,.searchline{margin-left:6px;margin-right:6px}}

.formgrid{display:grid;grid-template-columns:repeat(6,72px minmax(96px,1fr));gap:4px 5px;align-items:center;padding:8px 14px;background:#fafbfc;border-bottom:1px solid var(--line2)}
.formgrid .label{font-weight:700;text-align:right;padding-right:4px}
.formgrid .field{width:100%}
.span2{grid-column:span 3}.span3{grid-column:span 3}.span4{grid-column:span 4}
.lk{display:flex;gap:3px;min-width:0}.lk input{flex:1;min-width:0;height:27px;border:1px solid #b5c0c9;padding:0 6px}
.lk button{width:24px;height:27px;border:1px solid #9ba8b4;background:linear-gradient(#fff,#dfe6eb);cursor:pointer}
.att{margin:0 14px;border:1px solid var(--line);flex:1;min-height:0;overflow:auto;background:#fff}
.secthead{padding:6px 14px 2px;font-weight:700;color:#4b5c6a}
.mask{position:fixed;inset:0;background:rgba(40,50,60,.28);display:none;align-items:flex-start;justify-content:center;z-index:50}
.mask.on{display:flex}
.dlg{margin-top:60px;width:min(520px,92vw);background:#f3f6f8;border:1px solid #7d8d99;box-shadow:0 8px 26px rgba(0,0,0,.25)}
.dlghead{display:flex;align-items:center;height:30px;padding:0 6px 0 10px;background:linear-gradient(#eef4f9,#dbe6ef);border-bottom:1px solid #b9c6d0;font-weight:700}
.dlghead button{margin-left:auto;width:26px;height:20px;border:1px solid #b04a4a;background:#c9484a;color:#fff;cursor:pointer;line-height:1}
.dlgbody{padding:8px}
.dlgbody .srch{display:flex;gap:4px;margin-bottom:6px}
.dlgbody .srch input{flex:1;height:26px;border:1px solid #aeb9c3;padding:0 6px}
.dlgwrap{height:300px;overflow:auto;border:1px solid var(--line);background:#fff}
.dlgfoot{display:flex;justify-content:center;gap:10px;padding:8px}

/* v21 입력란 배치 보정: 좁은 폭에서 필드를 숨기지 않고 단계적으로 줄바꿈 */
.field,.formrow input,.formrow select,.formgrid input,.formgrid select,.detail-grid input,.detail-grid select{min-width:0;max-width:100%}
.lab,.label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:1400px){.formrow{grid-template-columns:78px minmax(0,1fr) 78px minmax(0,1fr)}}
@media(max-width:880px){.formrow{grid-template-columns:78px minmax(0,1fr)}}
.formrow>*{min-width:0}

/* ── v24 수주등록 입력박스 크기·배치 정리 ─────────────────────────
 * 기존: 라벨 72px + 필드 min 96px 짜리 6쌍 고정 → 화면이 좁으면 오른쪽
 *       3~6번째 쌍의 입력칸이 화면 밖으로 밀려 라벨만 보였다.
 * 변경: 라벨 폭을 넓히고 쌍 수를 화면 폭에 따라 4→3→2→1로 단계 축소. */
.formgrid{grid-template-columns:repeat(4,84px minmax(0,1fr));gap:5px 10px;padding:9px 14px;max-width:100%;box-sizing:border-box;overflow-x:hidden}
.formgrid>*{min-width:0}
.formgrid input,.formgrid select{width:100%;box-sizing:border-box;min-width:0}
.formgrid input[type=date]{padding-right:2px}
.field{height:27px}
.field.r{text-align:right}
/* v24.1 입력란 크기 통일: span 해제 */
.span3{grid-column:auto}
/* 코드+명칭+돋보기 조합: 코드칸을 고정폭으로, 명칭칸이 남는 폭을 차지 */
.lk{display:grid;grid-template-columns:minmax(46px,62px) minmax(0,1fr) 26px;gap:3px;align-items:center}
.lk input{width:100%;min-width:0;height:27px;border:1px solid #b5c0c9;padding:0 6px;box-sizing:border-box}
.lk input[readonly]{background:#f4f7f9}
.lk button{width:26px;height:27px}
/* 코드가 2~3자리인 항목은 코드칸을 더 좁게 */
#proc_cnt{max-width:56px}
@media(min-width:1800px){.formgrid{grid-template-columns:repeat(5,84px minmax(0,1fr))}}
@media(max-width:1240px){.formgrid{grid-template-columns:repeat(3,84px minmax(0,1fr))}}
@media(max-width:940px){.formgrid{grid-template-columns:repeat(2,84px minmax(0,1fr))}}
@media(max-width:680px){.formgrid{grid-template-columns:84px minmax(0,1fr)}}
/* v109: 감춰진 탭에서 로드되면 미디어쿼리가 폭 0 으로 굳어 1열로 남는다.
   mes_ctx.js 가 실측 폭을 html[data-mw] 로 알려주므로 그 값을 우선 적용한다. */
html[data-mw="xl"] .formgrid{grid-template-columns:repeat(5,84px minmax(0,1fr))}
html[data-mw="lg"] .formgrid{grid-template-columns:repeat(4,84px minmax(0,1fr))}
html[data-mw="md"] .formgrid{grid-template-columns:repeat(3,84px minmax(0,1fr))}
html[data-mw="sm"] .formgrid{grid-template-columns:repeat(2,84px minmax(0,1fr))}
html[data-mw="xs"] .formgrid{grid-template-columns:84px minmax(0,1fr)}
/* v241: 개발유형 체크박스 */
.devbox{display:grid;grid-template-columns:1fr 1fr;gap:1px 6px;align-content:center;min-height:28px;padding:1px 4px;border:1px solid #cfd8e0;background:#fff;font-size:11.5px;line-height:13px;white-space:nowrap;box-sizing:border-box}
.devbox label{display:flex;align-items:center;gap:3px;cursor:pointer}.devbox input{margin:0;width:13px;height:13px}
.grid>div:has(.devbox){align-self:stretch}
.cbo{background:#fff url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6'%3E%3Cpath d='M0 0h10L5 6z' fill='%23708090'/%3E%3C/svg%3E") no-repeat right 8px center;padding-right:22px}
#design_vendor:disabled{background-color:#f3f5f7;color:#9aa5ad}
/* v116 수주등록 배치: 구분선 + 납기완료일·정산완료일 분리, 첨부파일 팝업 */
.formgrid .gsep{grid-column:1/-1;height:0;border-top:1px dashed #9fb0bf;margin:4px 0 2px}
.fillsp{flex:1;min-height:0}
.attbox{width:min(900px,94vw)}
.attbox .toolbar{padding:0 0 6px;background:none;border:0;height:auto}
.attbox .att.attdlg{margin:0;height:min(340px,55vh);flex:none}
.attbtn b{display:inline-block;min-width:18px;margin-left:5px;padding:0 5px;border-radius:9px;background:#2f75b5;color:#fff;font-size:11px;line-height:17px}
.attbtn b:empty{display:none}
@media(max-width:680px){.foot{flex-wrap:wrap;height:auto;min-height:42px}.dlg.attbox{margin-top:20px}}
/* v235: 첨부 끌어놓기 */
#attDrop.drag{outline:2px dashed #2f75b5;outline-offset:-4px;background:#eef5fc}
/* TJD v270: 원 관리제번 (수리·개조) */
.oribox{display:flex;gap:4px;align-items:center;min-width:0}.oribox .field{flex:1;min-width:0}
.oribox .btn{flex:0 0 auto;height:27px;min-width:0;padding:0 10px;white-space:nowrap;font-size:12px;font-weight:600;line-height:25px;color:#1f3a56}
.oriRow.off{display:none!important}
/* 첨부파일: 비어 있을 때 과도한 여백 축소 */
.filearea .empty,#fileEmpty{height:64px!important}
</style></head><body><div class="screen">
<div class="title"><h1>수주등록</h1><small>영업관리 · 수주</small></div>
<section class="formgrid">
 <div class="label" title="관리제번. 공정수가 2 이상이면 저장할 때 관리제번 뒤에 A·B·C… 를 붙인 제번이 공정 수만큼 생깁니다 (v179)">관리제번</div><div><input id="base_job" class="field" placeholder="예) 26TJD001" style="text-transform:uppercase"></div>
 <div class="label" title="공정(SET) 수. 2 이상이면 저장 시 관리제번+A·B·C… 제번이 공정 수만큼 만들어집니다. 원가 배부 단위가 됩니다.">공정수</div><div><input id="proc_cnt" class="field num" placeholder="1" inputmode="numeric"></div>
 <div class="label" title="저장하면 만들어지는(또는 이미 있는) 제번">생성 제번</div><div class="span2"><input id="job_preview" class="field" readonly style="background:#f4f7f9;color:#2f5f8a;font-weight:700" title="관리제번 + 공정수로 정해집니다"></div>
 <div class="label" title="공정 성격 (기준정보 › 공정카테고리). 회의록 1-4. 공정별로 다르게 두려면 [⚙ 공정 자동생성]">카테고리</div><div><select id="proc_cat" class="field"><option value=""></option></select></div>

 <div class="label">수주일</div><div><input id="order_date" type="date" class="field"></div>
 <div class="label">T/O 예정일</div><div><input id="s1p" type="date" class="field"></div>

 <div class="label">수주상태</div><div><select id="status" class="field"><option>진행</option><option>보류</option><option>완료</option><option>취소</option></select></div>
 <div class="label">수주유형</div><div><select id="otype" class="field"><option>신작</option><option>개조</option><option>수리</option></select></div>
 <div class="label oriRow" title="수리·개조 수주가 어느 금형(원 관리제번)의 것인지. 고르면 관리제번(-R1 / -M숫자)과 공통 항목이 채워집니다">원 관리제번</div><div class="oriRow oribox"><input id="origin_base" class="field" list="dl_origin" autocomplete="off" placeholder="원 금형 관리제번 선택" style="text-transform:uppercase"><datalist id="dl_origin"></datalist><button type="button" id="oriNew" class="btn" onclick="oriNewRound()" title="이미 있는 수리 제번(R1)과 따로, 다음 회차(R2·R3…)로 새로 등록합니다 — 고객에게 따로 청구하는 큰 수리일 때">＋ 새 회차</button></div>
 <div class="label">견적서번호</div><div><input id="quo" class="field"></div>
 <div class="label">아이템</div><div class="lk"><input id="item_code"><input id="item_name" readonly><button onclick="openLook('item','item_code','item_name')">…</button></div>
 <div class="label">납기예정일</div><div><input id="dlvp" type="date" class="field"></div>
 <div class="label">국내/해외</div><div><select id="dom" class="field"><option>국내</option><option>해외</option></select></div>

 <div class="label">도번</div><div class="span3"><input id="drawing_no" class="field"></div>
 <div class="label">담당자</div><div class="lk"><input id="mgr_code"><input id="mgr_name" readonly><button onclick="openLook('employee','mgr_code','mgr_name')">…</button></div>
 <div class="label">고객사</div><div class="lk"><input id="cust_code"><input id="cust_name" readonly><button onclick="openLook('customer','cust_code','cust_name')">…</button></div>

 <div class="label">금형타입</div><div class="lk"><input id="mold_code"><input id="mold_name" readonly><button onclick="openLook('mold','mold_code','mold_name')">…</button></div>
 <div class="label" title="설계·조립을 사내/외주 중 어디서 하는지 (여러 개 체크 가능). SET외주발주에는 「사외조립」 체크된 제번만 나옵니다">개발유형</div><div class="devbox"><input id="devtype" type="hidden"><label><input type="checkbox" data-dev="사내설계" onchange="devToValue()">사내설계</label><label><input type="checkbox" data-dev="외주설계" onchange="devToValue()">외주설계</label><label><input type="checkbox" data-dev="사내조립" onchange="devToValue()">사내조립</label><label><input type="checkbox" data-dev="사외조립" onchange="devToValue()">사외조립</label></div>
 <div class="label" id="dvLabel" title="개발유형에서 「외주설계」 를 체크하면 입력할 수 있습니다. 제작계획등록의 설계처와 설계외주발주 업체 선택에 이어집니다">설계업체</div><div><input id="design_vendor" class="field cbo" list="dl_design_vendor" autocomplete="off" placeholder="외주설계 체크 시 입력/선택" disabled><datalist id="dl_design_vendor"></datalist></div>
 <div class="label">품명</div><div><input id="product_name" class="field"></div>
 <div class="label">품번</div><div><input id="model" class="field"></div>

 <div class="label">견적가</div><div><input id="quo_price" class="field num"></div>
 <div class="label">수주가</div><div><input id="order_price" class="field num"></div>
 <div class="label" title="가격 협상으로 조정된 금액 (감액 +, 증액 −). 원가관리의 실수주가 = 수주가 − 네고조정">네고조정</div><div><input id="nego_amount" class="field num" placeholder="0"></div>
 <div class="label">네고사유</div><div><input id="nego_note" class="field"></div>
 <div class="label">기계사양</div><div class="lk"><input id="ms_code"><input id="ms_name" readonly><button onclick="openLook('mspec','ms_code','ms_name')">…</button></div>
 <div class="label">사용재료</div><div><input id="material_used" class="field"></div>
 <div class="label">T/O 완료일</div><div><input id="s1c" type="date" class="field"></div>
 <div class="label">양산처</div><div class="lk"><input id="mp_code"><input id="mp_name" readonly><button onclick="openLook('mass_production','mp_code','mp_name')">…</button></div><input id="eco" type="hidden">   <!-- v244: ECO 칸 삭제 (값은 숨겨 보존) → 그 자리에 양산처 -->

 <div class="label">비고</div><div class="span3"><input id="remark" class="field"></div>
 <div class="gsep"></div>
 <div class="label">납기완료일</div><div><input id="dlvc" type="date" class="field"></div>
 <div class="label">정산완료일</div><div><input id="comp_date" type="date" class="field" title="납품 후 잔여 수정·검수·정산까지 끝나 이 제번을 종결한 날."></div>
</section>
<div style="display:none"><select id="proc_seq" data-nocombo="1"><option value=""></option></select><input id="job_no" type="hidden"></div>
<div class="fillsp"></div>
<div class="secthead" style="display:none">첨부파일</div>

<div class="mask" id="attMask" onmousedown="this._d=(event.target===this)" onclick="if(event.target===this&&this._d)attClose()"><div class="dlg attbox"><div class="dlghead">첨부파일 <span id="attJob" style="font-weight:400;color:#6b7a86;margin-left:8px"></span><button onclick="attClose()">✕</button></div><div class="dlgbody"><div class="toolbar"><button class="btn" onclick="attPick()">파일첨부</button><button class="btn" onclick="attOpen(1)">다운로드</button><button class="btn" onclick="attOpen()">미리보기</button><button class="btn" onclick="attDel()">파일삭제</button><input type="file" id="attFile" multiple style="display:none" onchange="attUpload(this.files)"><span id="attMsg" style="margin-left:10px;color:#b45309;font-size:12px"></span></div>
<div class="att attdlg" id="attDrop" title="파일을 여기로 끌어놓아도 됩니다"><table style="min-width:640px"><thead><tr><th style="width:34px"></th><th>파일명</th><th style="width:150px">Version</th><th style="width:280px">파일내용</th><th style="width:90px">크기</th><th style="width:90px">확장자</th></tr></thead><tbody id="attBody"></tbody></table></div></div><div class="dlgfoot"><button class="btn" onclick="attClose()">닫기</button></div></div></div>

<footer class="foot"><button class="btn attbtn" id="attBtn" onclick="attShow()">📎 첨부파일<b id="attCnt"></b></button><button class="btn" onclick="save()">▤ 저장</button><button class="btn" onclick="clearForm()">＋ 신규등록</button><button class="btn" onclick="window.parent?.closeActive?.()">⊠ 닫기</button><span class="msg" id="message">관리제번·공정수 등 필수항목을 입력하고 저장하세요. 공정수가 2 이상이면 A·B·C… 제번이 공정 수만큼 만들어집니다.</span></footer>
</div>

const SAVE0=saveOne;   /* v121: 공정 자동생성이 쓰는 원본(제번 1건) 저장 */
/* ── v179: 상단 공정·제번 칸을 없애고 관리제번 + 공정수로 저장한다 ──
 *  공정수 1 → 제번 = 관리제번 그대로
 *  공정수 n(2~26) → 관리제번+A, +B, … n건을 한 번에 저장 (공통 항목은 입력칸 값, 금액은 균등 분할)
 *  이미 있는 공정 제번은 공통 항목만 덮어쓰고, 공정별 카테고리·설비사양·금액은

const PROC_N=()=>{const n=parseInt(String(proc_cnt.value||'').replace(/[^0-9]/g,''),10);return n>0?Math.min(26,n):1};
const JOBS_OF=(b,n)=>{b=String(b||'').trim().toUpperCase();if(!b)return [];return n>=2?Array.from({length:n},(_,i)=>b+String.fromCharCode(65+i)):[b]};
function jobPreview(){const b=(base_job.value||'').trim().toUpperCase(),n=PROC_N();const js=JOBS_OF(b,n);
 const el=document.getElementById('job_preview');if(el)el.value=js.length?(n>=2?`${js.join(', ')}  (공정 ${n}개)`:js[0]):'';
 job_no.value=js[0]||'';proc_seq.value='';return js}
/* 기존 공정 제번(관리제번 기준) 읽기 — 공정별 값 보존용 */
async function existingJobs(b){
 if(!window.MESDB||!MESDB.online||!b)return [];
 try{const rs=await MESDB.table('sale_orders').select(`select=*&job_no=like.${encodeURIComponent(b)}*&order=job_no`);
  return (rs||[]).filter(r=>(MESDB.jobSplit?MESDB.jobSplit(r.job_no).base:r.job_no)===b)}catch(e){return []}
}
async function save(mode){
 const ACT=(typeof mode==='string'&&mode)?mode:'저장';
 const b=(base_job.value||'').trim().toUpperCase();
 if(!b){msg('관리제번은 필수입니다.');base_job.focus();return false}
 /* v242: 외주설계인데 설계업체가 비어 있으면 한 번 확인 */
 if(/외주설계/.test(devtype.value||'')&&!design_vendor.value.trim()&&!confirm('개발유형이 「외주설계」 인데 설계업체가 비어 있습니다.\n설계업체 없이 저장할까요? (나중에 수주등록에서 채울 수 있습니다)')){design_vendor.focus();msg('설계업체를 입력한 뒤 저장하세요.');return false}
 base_job.value=b;
 const n=PROC_N(),jobs=jobPreview();
 if(n<2){job_no.value=jobs[0];proc_seq.value='';return SAVE0(ACT)}
 const ex=await existingJobs(b);const exMap=new Map(ex.map(r=>[r.job_no,r]));
 const N=v=>{const x=Number(String(v??'').replace(/[^0-9.-]/g,''));return Number.isNaN(x)?0:x};
 const tq=N(quo_price.value),to=N(order_price.value),tn=N(nego_amount.value);
 const sum=k=>jobs.reduce((s,j)=>s+N((exMap.get(j)||{})[k]),0);
 const keepQ=ex.length&&sum('quotation_price')===tq,keepO=ex.length&&sum('order_price')===to,keepN=ex.length&&sum('nego_amount')===tn;
 const part=(tot,i)=>{const each=Math.round(tot/n);return i===n-1?tot-each*(n-1):each};
 const newJobs=jobs.filter(j=>!exMap.has(j)),extra=ex.map(r=>r.job_no).filter(j=>!jobs.includes(j));
 if(!confirm(`관리제번 ${b} · 공정 ${n}개\n제번: ${jobs.join(', ')}${newJobs.length&&newJobs.length<jobs.length?`\n(새로 만드는 제번: ${newJobs.join(', ')})`:''}${extra.length?`\n※ 공정수보다 많은 기존 제번 ${extra.join(', ')} 은(는) 그대로 둡니다.`:''}\n\n${ACT}할까요?`))return false;
 const snap={};for(const el of Object.keys(MAP)){const x=document.getElementById(el);if(x)snap[el]=x.value}
 const snapAtt=ATT.slice();const catAll=proc_cat.value,specAll=ms_name.value,specCode=ms_code.value;
 let ok=0,fail=[],lastMsg='';
 for(let i=0;i<jobs.length;i++){
  const j=jobs[i],e=exMap.get(j)||{};
  for(const el of Object.keys(MAP)){const x=document.getElementById(el);if(x)x.value=snap[el]}
  base_job.value=b;proc_seq.value=String.fromCharCode(65+i);job_no.value=j;
  quo_price.value=keepQ?(e.quotation_price??''):part(tq,i)||'';
  order_price.value=keepO?(e.order_price??''):part(to,i)||'';
  nego_amount.value=keepN?(e.nego_amount??''):(part(tn,i)||'');
  if(!catAll&&e.process_category){if(![...proc_cat.options].some(o=>o.value===e.process_category)){const o=document.createElement('option');o.value=o.textContent=e.process_category;proc_cat.appendChild(o)}proc_cat.value=e.process_category}
  if(!specAll&&e.machine_spec_name){ms_name.value=e.machine_spec_name;ms_code.value=e.machine_spec_code||specCode}
  proc_cnt.value=String(n);
  ATT.length=0;ATT.push(...snapAtt);
  try{const r=await SAVE0(ACT);if(r===true)ok++;else{fail.push(j);lastMsg=message.textContent}}catch(x){fail.push(j);lastMsg=String(x.message||x)}
 }
 for(const el of Object.keys(MAP)){const x=document.getElementById(el);if(x)x.value=snap[el]}
 ATT.length=0;ATT.push(...snapAtt);renderAtt();
 base_job.value=b;proc_seq.value='';job_no.value=jobs[0];jobPreview();
 if(fail.length){msg(`${b} 공정 ${ok}건 ${ACT} · 실패 ${fail.join(', ')}${lastMsg?' — '+lastMsg.slice(0,80):''}`);return false}

 return true;   /* v240: 완료 팝업은 아래 저장 래퍼에서 한 번만 */
}

function attKey(name,i){const m=/\.([A-Za-z0-9]{1,8})$/.exec(name||'');const ext=m?'.'+m[1].toLowerCase():'';
 const stem=String(name||'').replace(/\.[^.]*$/,'').replace(/[^A-Za-z0-9._-]/g,'_').replace(/_+/g,'_').replace(/^_|_$/g,'').slice(0,40);

/* v236: 토큰이 만료돼 있으면 먼저 갱신 (화면을 오래 열어 두면 만료된 토큰으로 올려 거부됨) */

 if(s&&s.expires_at&&s.expires_at*1000-Date.now()<2*60*1000&&a.refresh)await a.refresh()}catch(e){}return sbTok()}
const attWhy=(st,t,tok)=>{const m=String(t||'');
 if(/jwt|expired|invalid token/i.test(m))return '로그인이 만료되었습니다. 다시 로그인한 뒤 첨부하세요.';

  return bad}
 el.addEventListener('change',chk);el.addEventListener('input',chk);
 const _load=window.load;window.load=function(o){const r=_load.apply(this,arguments);setTimeout(chk,0);return r};

 window.MES.save=window.save;window.MES.load=window.load;
