<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>외주가공입고확정</title>
<style>
:root{--line:#9daab6;--line2:#c5ced6;--ink:#344758}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:"Malgun Gothic","맑은 고딕",Arial,sans-serif;font-size:12px;color:var(--ink);background:#fff;overflow:hidden}button,input,select{font:inherit;color:inherit}
.screen{height:100%;display:flex;flex-direction:column}.title{height:46px;padding:9px 14px 4px;border-bottom:2px solid #3977ad;display:flex;align-items:center;gap:16px}.title h1{margin:0;font-size:21px;font-weight:500;color:#4b5b69}.title h1:before{content:'◯';margin-right:6px;color:#8795a1}.title .opts{display:flex;align-items:center;gap:10px;color:#5f6d79}.title .plant{margin-left:auto;display:flex;align-items:center;gap:6px;color:#6b7885}
.filters{padding:7px 14px;border-bottom:1px solid var(--line2);background:#fafbfc;display:flex;gap:6px;align-items:center;flex-wrap:wrap}.label{font-weight:700}.field{height:27px;border:1px solid #b7c2cb;background:#fff;padding:0 7px;outline:none}.field:focus{border-color:#4e88bb}
.gridbox{flex:1;min-height:0;margin:7px 14px 0;border:1px solid var(--line);display:flex;flex-direction:column;background:#fff}.grid-title{height:26px;display:flex;align-items:center;justify-content:center;background:linear-gradient(#deebf5,#caddea);border-bottom:1px solid var(--line);font-weight:700;color:#536677}
.tablewrap{flex:1;min-height:0;overflow:auto}table{border-collapse:collapse;min-width:1676px;width:100%;table-layout:fixed}th,td{height:25px;padding:0 5px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}th{position:sticky;top:0;z-index:2;text-align:center;background:linear-gradient(#dbe9f4,#c7d9e8);color:#405266;font-weight:700}tbody tr:nth-child(even) td{background:#fafcfd}tbody tr:hover td{background:#edf6fd}tbody tr.sel td{background:#2e78bd;color:#fff}.c{text-align:center}.r{text-align:right}
tfoot th{position:sticky;bottom:0;background:linear-gradient(#e6eef5,#d3e0ea)}
.summary{height:50px;margin:0 14px;border:1px solid var(--line);border-top:0;background:#eef3f6;display:flex;align-items:center;gap:7px;padding:6px}.summary input{height:28px;border:1px solid #aeb9c3;background:#fff;padding:0 6px}.summary .money{width:170px;text-align:right}.summary .rateinput{width:90px;text-align:right}.summary .dateinput{width:135px}.spacer{flex:1}
.btn{height:28px;min-width:70px;border:1px solid #9ca9b5;background:linear-gradient(#fff,#dfe6eb)}.btn:hover{background:#fff}.btn.primary{background:linear-gradient(#f9ffff,#d2e7f6);color:#1e5e91}.btn.confirm{background:linear-gradient(#fff3f7,#f3c3d5);color:#a8235a;border-color:#d38aa6;font-weight:700}.btn.confirm:hover{background:linear-gradient(#fff,#f7d3e0)}.btn.warn{color:#a63a2f}
.foot{height:42px;display:flex;align-items:center;padding:5px 14px;border-top:1px solid var(--line);background:#eef2f5;gap:5px}.msg{margin-left:10px;color:#687784}.foot .right{margin-left:auto;color:#7c8993}
@media(max-width:900px){.title h1{font-size:18px}.summary{overflow:auto}}
</style>
</head>
<body>
<div class="screen">
  <div class="title"><h1>외주가공입고확정</h1>
    <div class="opts"><label><input type="radio" name="done" value="미완료" checked onchange="search()"> 미완료</label><label><input type="radio" name="done" value="완료" onchange="search()"> 완료</label></div>
  </div>
  <section class="filters">
    <span class="label">협력업체</span><select id="vendorQ" class="field" data-combo style="width:190px"><option value="">전체</option></select>
    <span class="label">제번</span><input id="jobQ" class="field" style="width:190px">
    <span class="label">품명</span><input id="itemQ" class="field" style="width:190px">
    <button class="btn" onclick="search()">⌕ 조회</button>
  </section>
  <div class="gridbox">
    <div class="grid-title">입고 확정 대기 리스트</div>
    <div class="tablewrap"><table>
      <colgroup><col style="width:44px"><col style="width:38px"><col style="width:66px"><col style="width:110px"><col style="width:110px"><col style="width:48px"><col style="width:58px"><col style="width:76px"><col style="width:130px"><col style="width:56px"><col style="width:100px"><col style="width:120px"><col style="width:110px"><col style="width:92px"><col style="width:92px"><col style="width:96px"><col style="width:92px"><col style="width:76px"><col style="width:92px"></colgroup>
      <thead><tr><th>No</th><th>선택</th><th>확정여부</th><th>제번</th><th>품명</th><th>공정</th><th>공정명</th><th>품번</th><th>부품명</th><th title="발주수량 / 입고수량">수량</th><th>가공공정코드</th><th>가공공정명</th><th>협력업체</th><th>발주월</th><th>입고월</th><th>입고확정일</th><th>견적가</th><th>네고율(%)</th><th>확정가</th></tr></thead>
      <tbody id="body"></tbody>
      <tfoot><tr><th colspan="16" class="r">합계</th><th class="r" id="sumQuote">0</th><th></th><th class="r" id="sumFix">0</th></tr></tfoot>
    </table></div>
  </div>
  <div class="summary">
    <span class="label">견적가 합계</span><input id="total" class="money" readonly>
    <span class="label">네고율</span><input id="nego" class="rateinput" type="number" step="0.01" value="0.00"><button class="btn" onclick="applyNego()">네고율 적용</button>
    <span class="label">입고확정일</span><input id="confirmDate" class="dateinput" type="date"><button class="btn confirm" onclick="confirmSelected()">▣ 입고확정</button>
    <div class="spacer"></div><span id="selectedText">선택 0건</span>
  </div>
  <footer class="foot"><button class="btn" onclick="search()">⌕ 검색</button><button class="btn" onclick="save()">▣ 저장</button><button class="btn warn" onclick="cancelConfirm()">✖ 입고취소</button><button class="btn" onclick="window.parent?.closeActive?.()">⊠ 닫기</button><span class="msg" id="message">입고 확정 대기 자료를 조회했습니다.</span><span class="right" id="countText"></span></footer>
</div>
<script>
const rows=[];
let view=[...rows];
const money=v=>Number(v||0).toLocaleString('ko-KR');
const fix=r=>Math.round(r.quote*(1-(r.rate||0)/100));
function doneMode(){return document.querySelector('input[name=done]:checked').value}
function render(){body.innerHTML=view.map((r,i)=>`<tr onclick="pick(event,${r.no})"><td class="c">${i+1}</td><td class="c"><input type="checkbox" data-no="${r.no}" onchange="summary()"></td><td class="c">${r.status==='확정'?'확정':''}</td><td>${r.job}</td><td>${r.item}</td><td class="c">${r.proc}</td><td class="c">${r.procName}</td><td>${r.part}${window.MESCYCLE?MESCYCLE.badge(r.cyc,null,r.cycWhy):''}</td><td>${r.partName}</td><td class="r" title="발주 ${Number(r.ord)||1} / 입고 ${Number(r.got)||0}">${Number(r.got)||Number(r.ord)||1}</td><td class="c">${r.mp}</td><td>${r.mpName}</td><td>${r.vendor}</td><td class="c">${r.odate}</td><td class="c">${r.idate}</td><td class="c">${r.cdate}</td><td class="r">${money(r.quote)}</td><td class="r">${(r.rate||0).toFixed(2)}</td><td class="r">${money(fix(r))}</td></tr>`).join('');
sumQuote.textContent=money(view.reduce((a,r)=>a+(Number(r.quote)||0),0));sumFix.textContent=money(view.reduce((a,r)=>a+fix(r),0));countText.textContent=`${view.length}건`;summary()}
function pick(e,no){if(e.target.tagName==='INPUT')return;const cb=document.querySelector(`#body input[data-no="${no}"]`);if(cb){cb.checked=!cb.checked;summary()}}
function selected(){const ids=[...document.querySelectorAll('#body input:checked')].map(x=>Number(x.dataset.no));return rows.filter(r=>ids.includes(r.no))}
function summary(){const s=selected();total.value=money(s.reduce((a,r)=>a+(Number(r.quote)||0),0));selectedText.textContent=`선택 ${s.length}건`;document.querySelectorAll('#body tr').forEach(tr=>tr.classList.toggle('sel',!!tr.querySelector('input:checked')))}
/* v88: [조회] 는 DB 를 다시 읽고 나서 거른다 — 다른 화면에서 새로 생긴 발주가 바로 보인다 */
function search(){
 if(window.MESDB&&MESDB.reloadLines){
  MESDB.reloadLines().then(n=>{_filterNow();if(n===-1&&typeof msg==='function')msg('저장하지 않은 입력이 있어 새로고침을 건너뛰었습니다. 먼저 [▣ 저장] 하세요.')})
   .catch(()=>_filterNow());
  return;
 }
 _filterNow();
}
function _filterNow(){const v=vendorQ.value.trim().toLowerCase(),j=jobQ.value.trim().toLowerCase(),it=itemQ.value.trim().toLowerCase(),m=doneMode();view=rows.filter(r=>(m==='완료'?r.status==='확정':r.status!=='확정')&&(!v||r.vendor.toLowerCase().includes(v))&&(!j||r.job.toLowerCase().includes(j))&&(!it||(r.item||'').toLowerCase().includes(it)));render();msg(`${m} 기준 ${view.length}건을 조회했습니다.`)}
const numv=v=>{const x=Number(v);return Number.isFinite(x)?x:0};
function applyNego(){const s=selected();if(!s.length)return msg('네고율을 적용할 행을 선택하세요.');const rate=Math.max(0,Math.min(100,Number(nego.value)||0));s.forEach(r=>r.rate=rate);render();s.forEach(r=>{const cb=document.querySelector(`#body input[data-no="${r.no}"]`);if(cb)cb.checked=true});summary();msg(`${s.length}건에 네고율 ${numv(rate).toFixed(2)}%를 적용했습니다.`)}
let dirty=false;   /* v62 */
/* v98: [입고확정] = 즉시 DB 반영. 확정된 행은 미완료 목록에서 빠지고 완료 팝업이 뜬다 ([완료] 로 조회하면 다시 보임, 입고취소 가능). DB 미연결이면 종전처럼 화면만 바꾸고 [저장] 으로 반영. */
async function confirmSelected(){const s=selected();if(!s.length)return msg('입고확정할 행을 선택하세요.');const d=confirmDate.value||new Date().toISOString().slice(0,10);
 s.forEach(r=>{r.cdate=d;r.status='확정';r.fix=fix(r)});dirty=true;
 if(!window.MESDB||!MESDB.online){_filterNow();return msg(`${s.length}건을 ${d} 기준으로 입고확정했습니다. (DB 미연결 - 로컬, [저장]으로 반영)`)}
 msg('입고확정 반영 중…');
 try{await MESDB.syncLines()}catch(e){}
 let rl=0;try{rl=MESDB.reloadLines?await MESDB.reloadLines():0}catch(e){rl=-1}
 if(rl===-1){render();return msg('입고확정 저장 실패: DB 반영이 되지 않았습니다. [저장]을 다시 눌러주세요.')}
 dirty=false;_filterNow();
 msg(`${s.length}건을 ${d} 기준으로 입고확정했습니다. (DB 저장 완료${doneMode()==='완료'?'':' - 미완료 목록에서 제외'}) 제조원가에 반영됩니다.`)}
function cancelConfirm(){const s=selected();if(!s.length)return msg('입고취소할 행을 선택하세요.');s.forEach(r=>{r.cdate='';r.status='입고';r.fix=''});dirty=true;search();msg(`${s.length}건의 입고확정을 취소했습니다. (입고 상태로 복귀)`)}
/* v39: 스텁 → order_lines 실제 반영. 확정되지 않으면 제조원가에 외주가공비가 잡히지 않는다. */
async function save(){
 const done=rows.filter(r=>r.status==='확정').length;
 if(!done&&dirty&&window.MESDB&&MESDB.online){try{await MESDB.syncLines();dirty=false;return msg('입고확정 취소 내용을 DB에 반영했습니다.')}catch(e){return msg('저장 실패: '+String(e.message||e).slice(0,140))}}
 if(!done){alert('확정 처리된 행이 없습니다.\n\n행을 선택하고 [입고확정]을 눌러주세요.');return msg('저장할 확정 내역이 없습니다.')}
 if(!window.MESDB||!MESDB.online)return msg('외주가공 입고확정 변경사항을 저장했습니다. (DB 미연결 - 로컬)');
 try{rows.forEach(r=>{if(r.status==='확정')r.fix=fix(r)});await MESDB.syncLines();dirty=false;
  msg(`외주가공 입고확정을 DB에 저장했습니다. 확정 ${done}건 - 제조원가에 반영됩니다.`)}
 catch(e){msg('저장 실패: '+String(e.message||e).slice(0,140))}
}
function exportCsv(){const out=[['제번','품명','공정','품번','부품명','수량','가공공정코드','가공공정명','협력업체','발주월','입고월','입고확정일','견적가','네고율','확정가'],...view.map(r=>[r.job,r.item,r.proc,r.part,r.partName,(Number(r.got)||Number(r.ord)||1),r.mp,r.mpName,r.vendor,r.odate,r.idate,r.cdate,r.quote,r.rate,fix(r)])];const csv='\ufeff'+out.map(a=>a.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='outsourcing_receipt_confirmation.csv';a.click();URL.revokeObjectURL(a.href)}
function msg(t){message.textContent=t}
confirmDate.value=new Date().toISOString().slice(0,10);render();window.MES={search,save,exportCsv,setMessage:msg};
</script>
<script src="mes_sample.js?v=169"></script><script src="mes_scene.js?v=92"></script><script src="mes_demo.js?v=92"></script><script src="mes_db.js?v=171"></script><script src="mes_cycle.js?v=225"></script>
<script>MESDB.lines({page:"outsourcing_receipt_confirmation",category:"외주가공",statuses:["입고", "입고확정"],map:{"no": {"col": "line_id", "type": "num"}, "vendor": "vendor_name", "job": "job_no", "item": "item_name", "proc": "process_code", "procName": "process_name", "part": "part_no", "cyc": {"col": "cycle_no", "type": "num"}, "cycWhy": "cycle_reason", "partName": "part_name", "mp": "machining_process_code", "mpName": "machining_process_name", "ord": {"col": "order_qty", "type": "num"}, "got": {"col": "receipt_qty", "type": "num"}, "odate": {"col": "order_date", "type": "date"}, "idate": {"col": "receipt_date", "type": "date"}, "cdate": {"col": "confirm_date", "type": "date"}, "quote": {"col": "quote_price", "type": "num"}, "rate": {"col": "nego_rate", "type": "num"}, "fix": {"col": "confirm_price", "type": "num"}, "status": {"col": "status", "type": "status"}},get:()=>rows,render:()=>{view=[...rows];_filterNow()}});</script>
<script src="mes_lookup.js?v=92"></script>
<script>
/* v86: 협력업체 — 기준정보(업체 관리)의 외주가공 협력사를 드롭다운으로 선택 */
async function loadVendorSel(){
 const sel=document.getElementById('vendorQ');if(!sel||sel.tagName!=='SELECT')return;
 const keepV=sel.value;
 let n=0;
 try{
  for(let i=0;i<40&&!window.MESLOOK;i++)await new Promise(r=>setTimeout(r,50));
  if(window.MESLOOK){
   await MESLOOK.fillSelect(sel,'vendor_outsourcing',{keep:['전체'],
     value:r=>r.vendor_name||'',label:r=>r.vendor_name||''});
   n=sel.options.length-1;
  }
 }catch(e){}
 if(n<=0){   /* 마스터가 비어 있으면 조회된 발주자료의 업체로 대체 */
  try{
   const src=(typeof rows!=='undefined'&&Array.isArray(rows))?rows:[];
   const vs=[...new Set(src.map(r=>r.vendor).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ko'));
   sel.innerHTML='<option value="">전체</option>'+vs.map(v=>`<option>${String(v).replace(/[<>&"]/g,'')}</option>`).join('');
   n=vs.length;
  }catch(e){}
 }
 if([...sel.options].some(o=>o.value===keepV))sel.value=keepV;
 if(!sel.__vwire){sel.__vwire=1;sel.addEventListener('change',()=>{try{search()}catch(e){}})}
 if(!n&&typeof msg==='function')msg('협력업체 마스터가 비어 있습니다. 기준정보 > 업체 관리에서 외주가공 업체를 등록하세요.');
}
loadVendorSel();setTimeout(loadVendorSel,1500);
</script>
<script src="mes_ctx.js?v=169"></script>
<script>
function sampleFill(){
  if(window.MESDEMO)return MESDEMO.run('outsourcing_receipt_confirmation',{});
  var e=document.getElementById('message'); if(e)e.textContent='예제 모듈을 불러오지 못했습니다.';
}
</script>
</body>
</html>
