<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>설계계획등록</title><style>
:root{--line:#98a6b2;--line2:#c5d0d8;--blue:#2f75b5;--ink:#344757;--head1:#e8f1f8;--head2:#c8dbe9}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:"Malgun Gothic","맑은 고딕",Arial,sans-serif;font-size:12px;color:var(--ink);background:#fff;overflow:hidden}
button,input,select{font:inherit;color:inherit}.screen{height:100%;display:flex;flex-direction:column;background:#fff}
.title{height:48px;padding:8px 14px 5px;border-bottom:2px solid #3978ae;display:flex;align-items:center}.title h1{margin:0;font-size:22px;font-weight:500;color:#4b5c6a}.title h1:before{content:'◯';margin-right:6px;color:#8796a1}.title small{font-size:11px;color:#9ca7af;margin-left:12px}
.form{padding:7px 14px;background:#fafbfc;border-bottom:1px solid var(--line2)}.formrow{display:grid;grid-template-columns:78px 140px 78px 150px 90px 150px 90px minmax(160px,1fr);gap:5px;align-items:center}.formrow+.formrow{margin-top:5px}.label{font-weight:700}.field{height:27px;border:1px solid #b5c0c9;background:#fff;padding:0 6px;min-width:0}
.entrybox,.gridbox{margin:0 14px;border:1px solid var(--line);overflow:auto;background:#fff}.entrybox{height:190px}.gridbox{flex:1;min-height:0}
.searchline{height:39px;margin:0 14px;display:flex;align-items:center;gap:5px;border-left:1px solid var(--line);border-right:1px solid var(--line);padding:4px 8px;background:#f6f8fa}.searchline input{width:min(430px,48vw);height:27px;border:1px solid #aeb9c3;padding:0 7px}
.btn{height:29px;min-width:62px;border:1px solid #9ba8b4;background:linear-gradient(#fff,#dfe6eb);cursor:pointer}.btn:hover{background:#fff}
table{border-collapse:collapse;min-width:1040px;width:100%;table-layout:fixed}th,td{height:27px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:0 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}th{position:sticky;top:0;z-index:2;text-align:center;background:linear-gradient(var(--head1),var(--head2));color:#405266}tbody tr:nth-child(even) td{background:#fafcfd}tbody tr:hover td{background:#edf6fd}tbody tr.sel td{background:#2d75b7;color:#fff}.c{text-align:center}.num{text-align:right}.toolbar{height:40px;display:flex;align-items:center;gap:5px;padding:4px 14px;background:#f5f7f8;border-bottom:1px solid var(--line2)}
.foot{height:42px;display:flex;align-items:center;padding:5px 14px;border-top:1px solid var(--line);background:#eef2f5;gap:5px}.msg{margin-left:8px;color:#687784}.right{margin-left:auto;color:#7c8993}
.split{flex:1;min-height:0;display:grid;grid-template-rows:1fr 1fr;gap:10px;padding:0 14px 8px}.split .gridbox{margin:0}
@media(max-width:900px){.formrow{grid-template-columns:78px 1fr 78px 1fr}.entrybox,.gridbox,.searchline{margin-left:6px;margin-right:6px}}

.filt{padding:7px 14px;background:#fafbfc;border-bottom:1px solid var(--line2)}
.fr{display:grid;gap:5px;align-items:center}
.lb{font-weight:700;text-align:right;padding-right:3px}
.opts{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.opts label{display:flex;align-items:center;gap:3px;cursor:pointer}
.gtot td{background:#dfe9f2;font-weight:700}
.grp th{background:linear-gradient(#dbe9f5,#b9d2e6)}
.panes{flex:1;min-height:0;display:grid;gap:8px;padding:0 14px 8px}
.pane{border:1px solid var(--line);background:#fff;display:flex;flex-direction:column;min-height:0}
.ph{padding:5px 9px;font-weight:700;background:linear-gradient(var(--head1),var(--head2));color:#405266;border-bottom:1px solid var(--line2)}
.pb{flex:1;min-height:0;overflow:auto}
.f2{display:grid;grid-template-columns:repeat(4,72px minmax(110px,1fr));gap:5px;align-items:center}
.mask{position:fixed;inset:0;background:rgba(40,50,60,.3);display:none;align-items:flex-start;justify-content:center;z-index:50}
.mask.on{display:flex}
.dlg{margin-top:40px;width:min(1000px,96vw);background:#f3f6f8;border:1px solid #7d8d99;box-shadow:0 8px 26px rgba(0,0,0,.25)}
.dh{display:flex;align-items:center;height:30px;padding:0 6px 0 10px;background:linear-gradient(#eef4f9,#dbe6ef);border-bottom:1px solid #b9c6d0;font-weight:700}
.dh button{margin-left:auto;width:26px;height:20px;border:1px solid #b04a4a;background:#c9484a;color:#fff;cursor:pointer}
.db{padding:10px}
.kv{display:grid;grid-template-columns:repeat(4,84px minmax(90px,1fr));gap:4px;align-items:center;margin-bottom:8px}
.kv .lb{text-align:right}
.kv .v{border:1px solid #c3ccd4;background:#fff;height:26px;line-height:24px;padding:0 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:14px;background:#3f7fbf;border-radius:2px}
.tag{display:inline-block;min-width:34px;padding:0 6px;border-radius:9px;font-size:11px;line-height:17px}
.tag.in{background:#e6f0fa;color:#1e4f86;border:1px solid #a9c6e4}
.tag.out{background:#fdeee8;color:#a2481c;border:1px solid #eab49b}

/* v21 입력란 배치 보정: 좁은 폭에서 필드를 숨기지 않고 단계적으로 줄바꿈 */
.field,.formrow input,.formrow select,.formgrid input,.formgrid select,.detail-grid input,.detail-grid select{min-width:0;max-width:100%}
.lab,.label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:1400px){.formrow{grid-template-columns:78px minmax(0,1fr) 78px minmax(0,1fr)}}
@media(max-width:880px){.formrow{grid-template-columns:78px minmax(0,1fr)}}
.formrow>*{min-width:0}
</style></head><body><div class="screen"><div class="title"><h1>설계계획등록</h1><small>설계관리</small></div><section class="filt"><div class="f2"><div class="lb">제번</div><div><input id="q_job" class="field cbo" list="dl_job" autocomplete="off" placeholder="제번 입력/선택" title="정산완료되지 않은 사내설계 제번입니다. 글자를 입력하면 걸러집니다."></div><div class="lb">품명</div><div><input id="q_item" class="field"></div><div></div><div style="color:#6b7a87;font-size:11px;white-space:nowrap" title="외주설계 제번은 영업관리 › 설계외주에서 발주·입고로 관리합니다.">※ 사내설계 제번만 표시 (외주설계는 영업관리 › 설계외주)</div></div></section><datalist id="dl_job"></datalist><div class="panes" style="grid-template-rows:1.2fr 1fr"><div class="pane"><div class="ph">제번리스트</div><div class="pb"><table style="min-width:900px"><thead><tr><th style="width:140px">제번</th><th style="width:200px">품명</th><th style="width:170px">고객사</th><th style="width:120px">설계완료 예정일</th><th style="width:110px">T/O 예정일</th><th style="width:70px">설계구분</th><th>고객요구일</th></tr></thead><tbody id="hbody"></tbody></table></div></div><div class="panes" style="grid-template-columns:1fr 1.3fr;grid-template-rows:1fr;padding:0;gap:8px"><div class="pane"><div class="ph">조수 리스트</div><div class="pb"><table style="min-width:0"><thead><tr><th style="width:110px">공정코드</th><th>공정명</th><th style="width:100px">담당자</th></tr></thead><tbody id="sbody"></tbody></table></div></div><div class="pane"><div class="ph">세부공정 리스트</div><div class="pb"><table style="min-width:640px"><thead><tr><th style="width:90px">공정코드</th><th style="width:80px">공정명</th><th style="width:110px">가공공정코드</th><th style="width:130px">가공공정명</th><th>완료 예정일</th></tr></thead><tbody id="dbody"></tbody></table></div></div></div></div><div style="display:flex;gap:4px;padding:6px;align-items:center;flex-wrap:wrap;border-top:1px solid #c3ccd4;background:#f4f8fb"><span class="lb">설계완료예정일</span><input id="fPlanDate" class="field" type="date" style="width:140px"><span class="lb">설계담당</span><input id="fManager" class="field cbo" list="dl_emp" autocomplete="off" style="width:110px" placeholder="입력/선택"><span class="lb">공정</span><input id="fProc" class="field cbo" list="dl_proc" autocomplete="off" style="width:70px" value="1" placeholder="1" title="조수 리스트의 공정(조) 번호"><input id="fProcName" class="field" style="width:70px" value="1/1" readonly title="공정을 고르면 자동"><span class="lb">가공공정</span><input id="fMach" class="field cbo" list="dl_mach" autocomplete="off" style="width:80px" placeholder="DA" title="기준정보 › 공정관리의 설계 공정"><input id="fMachName" class="field" style="width:90px" placeholder="레이아웃" readonly title="가공공정을 고르면 자동"><datalist id="dl_emp"></datalist><datalist id="dl_proc"></datalist><datalist id="dl_mach"></datalist><button class="btn" onclick="addStep()">＋ 세부공정</button><button class="btn" onclick="delStep()">－ 세부공정</button></div><footer class="foot"><button class="btn" onclick="search()">⌕ 검색</button><button class="btn" onclick="save()">▤ 저장</button><button class="btn" onclick="window.parent?.closeActive?.()">⊠ 닫기</button><span class="msg" id="message">제번을 선택하면 세부공정이 표시됩니다.</span><span class="right" id="countText"></span></footer></div><script>const heads=[];const steps=[];const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const n=v=>v==null?'':Number(v).toLocaleString();const p=v=>v==null?'':Number(v).toFixed(2)+'%';
const msg=t=>message.textContent=t;
let view=[...heads];
/* v62: job_pool 의 미수립 제번은 heads(=design_plans 마스터 배열)와 분리한다.
   heads 에 섞어 두면 MESDB.master 의 클릭 동기화가 미수립 제번까지 design_plans 에 자동 삽입했다. */
const POOL=[];
const allHeads=()=>[...heads,...POOL.filter(p=>!heads.some(h=>h.job_no===p.job_no))];
function render(){hbody.innerHTML=view.map((r,i)=>`<tr onclick="pick(${i},this)"><td>${esc(r.job_no)}</td><td>${esc(r.item_name||'')}</td><td>${esc(r.customer_name||'')}</td><td class="c">${esc(r.design_completion_planned_date||'')}</td><td class="c">${esc(r.s1_date||'')}</td><td class="c">${srcTag(r.job_no)}</td><td class="c">${esc(r.customer_request_date||'')}</td></tr>`).join('');countText.textContent=view.length+'건';}
/* v78: SET외주·외주설계 열은 제거됨 (영업관리 › 조립외주/설계외주에서 관리) */
/* v73: 제작계획의 설계 사내/외주 구분. 이 화면은 사내설계 전용이라 외주 제번은 빼고 보여준다. */
const DSRC={};
const srcOf=job=>DSRC[job]||'';
const srcTag=job=>{const v=srcOf(job);return v?`<span class="tag ${v==='외주'?'out':'in'}">${v}</span>`:'<span style="color:#9aa7b1">-</span>'};
async function loadSrc(){
 if(!online())return;
 try{const ps=await MESDB.table('sales_plans').select('select=job_no,design_outsourced');
  Object.keys(DSRC).forEach(k=>delete DSRC[k]);
  (ps||[]).forEach(r=>{DSRC[r.job_no]=(r.design_outsourced===true||r.design_outsourced==='true')?'외주':'사내'});
 }catch(e){}
}
/* v77: 정산완료된 제번(sale_orders.completion_date 있음)은 설계계획 대상에서 뺀다
 * v115: 정산완료일이 오늘 이후(예정일로 미리 적어 둔 경우)면 아직 정산완료가 아니므로 빼지 않는다.
 *       제외된 제번은 DONE_DT 에 날짜를 남겨 안내문에 보여 준다. */
const DONE=new Set(),DONE_DT={};
async function loadDone(){
 if(!online())return;
 try{const rs=await MESDB.table('sale_orders').select('select=job_no,completion_date');
  const today=new Date().toISOString().slice(0,10);
  DONE.clear();Object.keys(DONE_DT).forEach(k=>delete DONE_DT[k]);
  (rs||[]).forEach(r=>{const d=String(r.completion_date||'').slice(0,10);if(d&&d<=today){DONE.add(r.job_no);DONE_DT[r.job_no]=d}});
 }catch(e){}
}
/* v78: 콤보 목록 — 담당자(users) · 설계 세부공정(processes 설계그룹) · 제작계획(기간-설계) */
const EMP=[],MACH=[],PLAN={},SETQ={};
const optHtml=(rows,val,lab)=>rows.map(r=>`<option value="${esc(val(r))}">${esc(lab?lab(r):'')}</option>`).join('');
async function loadRefs(){
 if(!online())return;
 try{const rs=await MESDB.table('users').select('select=name,department_name&order=name');
  EMP.length=0;(rs||[]).forEach(r=>{if(r.name)EMP.push(r)});
  const dl=document.getElementById('dl_emp');if(dl)dl.innerHTML=optHtml(EMP,r=>r.name,r=>r.department_name||'');
 }catch(e){}
 try{const rs=await MESDB.table('processes').select('select=process_code,process_name&process_group=eq.'+encodeURIComponent('설계')+'&order=sort_order');
  MACH.length=0;(rs||[]).forEach(r=>MACH.push(r));
  const dl=document.getElementById('dl_mach');if(dl)dl.innerHTML=optHtml(MACH,r=>r.process_code,r=>r.process_name||'');
 }catch(e){}
 try{const rs=await MESDB.table('sales_plans').select('select=job_no,design_end_date,design_manager,design_start_date');
  Object.keys(PLAN).forEach(k=>delete PLAN[k]);(rs||[]).forEach(r=>PLAN[r.job_no]=r);
 }catch(e){}
}
/* v82: 공정(조)는 A,B,C 대신 1,2,3 (저장값 '1','2','3', 표시 1조·2조·3조) */
const seqCode=i=>String(i+1);
function seqList(job){const q=Math.max(1,Math.trunc(Number(SETQ[job])||1));return Array.from({length:q},(_,i)=>({code:seqCode(i),name:`${i+1}조 (${i+1}/${q})`}))}
function pick(i,tr){const r=view[i];sel=r;document.querySelectorAll('#hbody tr').forEach(x=>x.classList.remove('sel'));tr.classList.add('sel');
 const pl=PLAN[r.job_no]||{};
 /* 품명 자동 · 설계완료예정일은 계획이 있으면 계획값, 없으면 제작계획 기간-설계 완료예정일 · 담당은 제작계획 설계담당 */
 q_item.value=r.item_name||'';
 fPlanDate.value=r.design_completion_planned_date||pl.design_end_date||'';
 if(!fManager.value)fManager.value=pl.design_manager||'';
 const rs=steps.filter(s=>s.job_no===r.job_no);
 /* 조수 리스트: 공정(조)수만큼 A,B,C… (세부공정에 등록된 담당자가 있으면 표시) */
 const seqs=seqList(r.job_no);
 const mgrOf=code=>{const x=rs.find(s=>s.process_code===code&&s.manager_name);return x?x.manager_name:(pl.design_manager||'')};
 sbody.innerHTML=seqs.map((x,k)=>`<tr onclick="pickSeq('${x.code}','${x.name}')" title="클릭하면 공정 칸에 들어갑니다"><td>${esc(x.code)}</td><td>${esc(x.name)}</td><td>${esc(mgrOf(x.code))}</td></tr>`).join('');
 const dl=document.getElementById('dl_proc');if(dl)dl.innerHTML=optHtml(seqs,x=>x.code,x=>x.name);
 fProc.value=seqs[0]?seqs[0].code:'1';fProcName.value=seqs[0]?seqs[0].name:'1조 (1/1)';
 dbody.innerHTML=rs.length?rs.map(s=>`<tr onclick="pickStep('${esc(s.process_code)}','${esc(s.machining_process_code||'')}','${esc(s.machining_process_name||'')}')" title="클릭하면 아래 입력칸에 들어갑니다"><td>${esc(s.process_code)}</td><td>${esc(s.process_name||'')}</td><td>${esc(s.machining_process_code||'')}</td><td>${esc(s.machining_process_name||'')}</td><td class="c">${esc(s.completion_planned_date||'')}</td></tr>`).join('')
  :'<tr><td colspan="5" class="c" style="height:60px;color:#8a97a2">등록된 세부공정이 없습니다.</td></tr>';
 msg(`${r.job_no} · 세부공정 ${rs.length}건`);}
function pickStep(proc,mach,machName){
 const x=(sel?seqList(sel.job_no):[]).find(y=>y.code===proc);
 fProc.value=proc;fProcName.value=x?x.name:'';fMach.value=mach||'';fMachName.value=machName||'';
 document.querySelectorAll('#dbody tr').forEach(t=>t.classList.remove('sel'));
 msg(`세부공정 ${proc}${mach?' - '+mach:''} 선택 — [－ 세부공정] 으로 삭제할 수 있습니다.`);
}
function pickSeq(code,name){fProc.value=code;fProcName.value=name;document.querySelectorAll('#sbody tr').forEach(t=>t.classList.toggle('sel',t.cells[0].textContent===code))}
fProc.addEventListener('change',()=>{const x=(sel?seqList(sel.job_no):[]).find(y=>y.code===fProc.value.trim());fProcName.value=x?x.name:''});
fMach.addEventListener('change',()=>{const x=MACH.find(y=>y.process_code===fMach.value.trim());fMachName.value=x?x.process_name:''});
function curSrc(){return '사내'}   /* v74: 이 화면은 사내설계 전용 */
/* 계획을 세울 수 있는 제번: 사내설계(또는 미수립) + 정산 미완료 */
function pickable(){return allHeads().filter(r=>srcOf(r.job_no)!=='외주'&&!DONE.has(r.job_no))}
function fillJobList(){
 const dl=document.getElementById('dl_job');if(!dl)return;
 const e=v=>String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
 const ps=pickable();
 dl.innerHTML=ps.map(r=>`<option value="${e(r.job_no)}">${e([r.item_name,r.customer_name].filter(Boolean).join(' · '))}</option>`).join('');
 if(ps.length){q_job.placeholder=`제번 입력/선택 (${ps.length}건)`;return}
 /* v115: 왜 비었는지 이유를 함께 보여 준다 */
 const all=allHeads(),out=all.filter(r=>srcOf(r.job_no)==='외주').map(r=>r.job_no),
       done=all.filter(r=>srcOf(r.job_no)!=='외주'&&DONE.has(r.job_no)).map(r=>`${r.job_no}(${DONE_DT[r.job_no]})`);
 q_job.placeholder=all.length?'선택 가능한 제번이 없습니다':'제작계획(job_pool)에 제번이 없습니다';
 if(out.length||done.length)msg(`설계계획 대상 제번이 없습니다 — 제외: `+[out.length?`외주설계 ${out.join(', ')}`:'',done.length?`정산완료 ${done.join(', ')} (수주등록 › 정산완료일)`:''].filter(Boolean).join(' / '));
}
function search(){const j=q_job.value.trim().toLowerCase(),it=q_item.value.trim().toLowerCase();
 view=pickable().filter(r=>(!j||r.job_no.toLowerCase().includes(j))&&(!it||String(r.item_name??'').toLowerCase().includes(it)));
 sbody.innerHTML='';dbody.innerHTML='';render();
 const outL=allHeads().filter(r=>srcOf(r.job_no)==='외주').map(r=>r.job_no),
       doneL=allHeads().filter(r=>srcOf(r.job_no)!=='외주'&&DONE.has(r.job_no)).map(r=>`${r.job_no}(${DONE_DT[r.job_no]})`);
 msg(`조회결과 ${view.length}건`+((outL.length||doneL.length)?` (제외 — ${[outL.length?`외주설계 ${outL.join(', ')}`:'',doneL.length?`정산완료 ${doneL.join(', ')}`:''].filter(Boolean).join(' / ')})`:''));
 if(j){const k=view.findIndex(r=>r.job_no.toLowerCase()===j);
  if(k>=0){const tr=hbody.querySelectorAll('tr')[k];if(tr)pick(k,tr)}}
}
q_job.addEventListener('change',()=>search());
/* v30: 설계계획을 design_plans / design_plan_steps 에 실제 저장 + job_pool 연동 */
let sel=null;
const online=()=>!!(window.MESDB&&MESDB.online);
document.addEventListener('change',e=>{if(e.target&&e.target.name==='dsrc')search()});
(function(){const bind=()=>{if(window.MESDB&&MESDB.onChange){MESDB.onChange(['sales_plans','sale_orders','users','processes'],async()=>{await loadSrc();await loadDone();await loadRefs();fillJobList();search()});return true}return false};
 if(!bind()){let n=0;const iv=setInterval(()=>{if(bind()||++n>40)clearInterval(iv)},100)}})();
async function waitDB(){for(let i=0;i<60&&!window.MESDB;i++)await new Promise(r=>setTimeout(r,50));
 if(window.MESDB&&MESDB.ready){try{await MESDB.ready}catch(e){}}}

async function loadPool(){
 await waitDB();if(!online())return;
 await loadSrc();await loadDone();await loadRefs();
 try{
  const pool=await MESDB.table('job_pool').select('select=*&order=row_no');
  POOL.length=0;
  const seen=new Set(heads.map(h=>h.job_no));
  pool.forEach(r=>{SETQ[r.job_no]=r.set_qty;if(!seen.has(r.job_no))POOL.push({row_no:null,job_no:r.job_no,item_name:r.item_name,
    customer_name:r.customer_name,design_completion_planned_date:null,
    s1_date:r.s1_date,customer_request_date:r.customer_request_date,plant_name:r.plant_name,_new:true})});
  fillJobList();search();
  msg(`설계계획 대상 제번 ${view.length}건 (전체 ${allHeads().length} — 외주설계·정산완료 제외)`);
 }catch(e){}
}
async function reloadSteps(job){
 if(!online())return;
 try{const rs=await MESDB.table('design_plan_steps').select(`select=*&job_no=eq.${encodeURIComponent(job)}&order=row_no`);
  for(let i=steps.length-1;i>=0;i--)if(steps[i].job_no===job)steps.splice(i,1);
  steps.push(...rs);
  const tr=[...document.querySelectorAll('#hbody tr')][view.findIndex(v=>v.job_no===job)];
  if(tr)pick(view.findIndex(v=>v.job_no===job),tr);
 }catch(e){}
}
async function save(){
 if(!sel){msg('제번을 선택하세요.');return}
 if(!online()){msg(`${sel.job_no} 설계계획을 저장했습니다. (DB 미연결 - 로컬)`);return}
 try{
  /* v39: 신규는 row_no 미전달(identity), 기존 행만 명시 */
  const o={job_no:sel.job_no,item_name:sel.item_name,customer_name:sel.customer_name,
   design_completion_planned_date:fPlanDate.value||sel.design_completion_planned_date||(PLAN[sel.job_no]||{}).design_end_date||null,
   s1_date:sel.s1_date||null,customer_request_date:sel.customer_request_date||null,
   plant_name:sel.plant_name||'1공장'};
  await MESDB.table('design_plans').upsert(o,'job_no');
  sel._new=false;
  sel.design_completion_planned_date=o.design_completion_planned_date;
  /* v62: 저장된 제번은 POOL → heads 로 옮긴다 */
  const pi=POOL.indexOf(sel);if(pi>=0)POOL.splice(pi,1);
  if(!heads.some(h=>h.job_no===sel.job_no))heads.push(sel);
  view=allHeads();render();
  const tr0=[...document.querySelectorAll('#hbody tr')][view.indexOf(sel)];if(tr0)tr0.classList.add('sel');
  msg(`${sel.job_no} 설계계획을 저장했습니다. (설계완료예정 ${o.design_completion_planned_date||'-'})`);
 }catch(e){const m=String(e.message||e);
  msg(/무결성|foreign key/i.test(m)?'저장 실패: 등록되지 않은 제번입니다.':'저장 실패: '+m.slice(0,120))}
}
async function addStep(){
 if(!sel){msg('제번을 선택하세요.');return}
 if(!online()){msg('DB 미연결 상태에서는 세부공정을 추가할 수 없습니다.');return}
 /* v78: 계획 헤더가 없으면 자동으로 먼저 만든다 (예전엔 '먼저 저장하세요' 로 막았다) */
 if(sel._new){await save();if(sel._new){msg('설계계획 등록에 실패해 세부공정을 추가하지 못했습니다.');return}}
 const proc=(fProc.value||'').trim();if(!proc){msg('공정코드를 입력하세요.');return}
 /* v62: 같은 공정/가공공정 중복 추가 방지 */
 const mach=(fMach.value||'').trim()||null;
 if(steps.some(s=>s.job_no===sel.job_no&&s.process_code===proc&&(s.machining_process_code||null)===mach)){
  msg(`${sel.job_no} / ${proc}${mach?'-'+mach:''} 세부공정은 이미 등록되어 있습니다.`);return}
 try{
  /* v39: row_no 는 DB identity 가 채운다 */
  await MESDB.table('design_plan_steps').upsert({
   job_no:sel.job_no,process_code:proc,process_name:(fProcName.value||'1/1').trim(),
   manager_name:fManager.value||null,machining_process_code:fMach.value||null,
   machining_process_name:fMachName.value||null,
   completion_planned_date:fPlanDate.value||(PLAN[sel.job_no]||{}).design_end_date||null},'row_no');
  await reloadSteps(sel.job_no);
  msg(`${sel.job_no} 세부공정 ${proc} 을(를) 추가했습니다.`);
 }catch(e){msg('추가 실패: '+String(e.message||e).slice(0,120))}
}
async function delStep(){
 if(!sel){msg('제번을 선택하세요.');return}
 if(!online()){msg('DB 미연결 상태에서는 세부공정을 삭제할 수 없습니다.');return}
 const proc=(fProc.value||'').trim(),mach=(fMach.value||'').trim();
 /* 세부공정 리스트에서 선택한 행이 있으면 그 행, 없으면 공정코드(+가공공정) 일치 행 */
 let rs=steps.filter(s=>s.job_no===sel.job_no&&s.process_code===proc&&(!mach||(s.machining_process_code||'')===mach));
 if(!rs.length)rs=steps.filter(s=>s.job_no===sel.job_no&&s.process_code===proc);
 if(!rs.length){msg(`삭제할 세부공정이 없습니다. (공정 ${proc||'-'}${mach?' / '+mach:''})`);return}
 if(!confirm(`${sel.job_no} / ${proc}${mach?' - '+mach:''} 세부공정 ${rs.length}건을 삭제하시겠습니까?`))return;
 try{for(const r of rs)await MESDB.table('design_plan_steps').delete({row_no:r.row_no});
  await reloadSteps(sel.job_no);msg(`세부공정 ${rs.length}건을 삭제했습니다.`);
 }catch(e){msg('삭제 실패: '+String(e.message||e).slice(0,120))}
}
window.MES={search,save,setMessage:msg,reload:loadPool};render();loadPool();</script><script src="mes_sample.js?v=169"></script><script src="mes_scene.js?v=78"></script><script src="mes_demo.js?v=78"></script><script src="mes_db.js?v=171"></script>
