<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>외주가공 QR 스캔</title><style>
:root{
 --bg:#eef2f7;--card:#fff;--line:#dbe3ec;--line2:#e8edf3;
 --ink:#243342;--ink2:#5a6b7c;--ink3:#8d9aa8;
 --blue:#2f75b5;--blue2:#eaf3fb;--blued:#1d5a92;
 --done:#2f7d4f;--doneb:#e4f2ea;--in:#d97a00;--inb:#fdf1dd;
 --out:#2f75b5;--outb:#e7f1fa;--req:#9aa7b3;--reqb:#f1f4f7;
 --late:#c0392b;--lateb:#fbecea;
 --sh:0 1px 3px rgba(30,45,60,.08),0 4px 14px rgba(30,45,60,.06);
 --r:12px;
}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font-family:Pretendard,-apple-system,"Malgun Gothic","맑은 고딕",sans-serif;font-size:15px;color:var(--ink);background:var(--bg);-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}button{cursor:pointer;touch-action:manipulation}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;padding:12px 12px 90px}

/* ── 헤더 ── */
.hd{display:flex;align-items:center;gap:10px;padding:4px 2px 10px}
.hd h1{margin:0;font-size:19px;font-weight:800;letter-spacing:-.02em}
.live{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink3);margin-left:auto}
.live i{width:9px;height:9px;border-radius:50%;background:#c3cdd6}
.live.on i{background:#37b26a;box-shadow:0 0 0 3px rgba(55,178,106,.2);animation:pulse 2.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}

/* ── 스캔 카드 ── */
.scan{background:var(--card);border:1px solid var(--line2);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;margin-bottom:12px}
.cam{position:relative;background:#101820;display:none}
.cam.on{display:block}
.cam video{display:block;width:100%;max-height:46vh;object-fit:cover}
.cam .box{position:absolute;left:50%;top:50%;width:min(58vw,230px);aspect-ratio:1;transform:translate(-50%,-50%);
 border:3px solid rgba(255,255,255,.92);border-radius:14px;box-shadow:0 0 0 200vmax rgba(0,0,0,.35)}
.cam .box:after{content:'';position:absolute;left:6px;right:6px;top:0;height:2px;background:#4fd07a;border-radius:2px;animation:scanline 1.8s ease-in-out infinite}
@keyframes scanline{0%,100%{top:4%}50%{top:92%}}
.cam .stopb{position:absolute;top:10px;right:10px;border:0;background:rgba(0,0,0,.55);color:#fff;border-radius:9px;height:38px;padding:0 14px;font-weight:700}
.bigbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:0;background:linear-gradient(180deg,#3b83c4,#2f75b5);
 color:#fff;font-size:18px;font-weight:800;min-height:62px;letter-spacing:-.01em}
.bigbtn:active{background:#26639c}
.bigbtn .ic{font-size:23px}
.manual{display:flex;gap:8px;padding:11px;border-top:1px solid var(--line2)}
.manual input{flex:1;height:48px;border:1px solid var(--line);border-radius:10px;padding:0 13px;font-size:16px;outline:0;min-width:0}
.manual input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(47,117,181,.14)}
.manual button{height:48px;min-width:74px;border:1px solid var(--line);border-radius:10px;background:#f3f7fa;font-weight:800;color:var(--blued)}
.hint{padding:0 13px 11px;font-size:12px;color:var(--ink3);line-height:1.5}

/* ── 결과 ── */
.rh{display:flex;align-items:center;gap:9px;margin:14px 2px 8px;flex-wrap:wrap}
.rh b{font-size:18px;color:var(--blued)}
.rh .pt{font-size:15px;font-weight:700}
.rh .sub{font-size:12px;color:var(--ink3);flex-basis:100%}
.lcard{background:var(--card);border:1px solid var(--line2);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:10px;padding:13px 14px}
.lcard.late{border-left:4px solid var(--late)}
.l1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stepn{font-size:11px;font-weight:800;background:var(--reqb);color:var(--ink2);border-radius:8px;padding:3px 8px}
.l1 b{font-size:16px}
.stag{font-size:11.5px;font-weight:800;border-radius:11px;padding:3px 10px;margin-left:auto}
.stag.done{background:var(--doneb);color:var(--done)}.stag.in{background:var(--inb);color:var(--in)}
.stag.out{background:var(--outb);color:var(--out)}.stag.req{background:var(--reqb);color:var(--ink3)}
.stag.lt{background:var(--lateb);color:var(--late)}
.l2{font-size:13px;color:var(--ink2);margin-top:5px;line-height:1.55}
.l2 em{font-style:normal;color:var(--ink3)}
.qtyrow{display:flex;align-items:center;gap:8px;margin-top:11px}
.qtyrow label{font-size:13px;font-weight:700;color:var(--ink2)}
.qtyrow input{width:92px;height:46px;border:1px solid var(--line);border-radius:10px;text-align:center;font-size:18px;font-weight:800;outline:0}
.qtyrow input:focus{border-color:var(--blue)}
.qtyrow small{color:var(--ink3);font-size:12px}
.act{display:flex;gap:8px;margin-top:11px}
.abtn{flex:1;border:0;border-radius:11px;min-height:54px;font-size:16.5px;font-weight:800;color:#fff;display:flex;align-items:center;justify-content:center;gap:8px}
.abtn:disabled{opacity:.5}
.abtn.rcv{background:linear-gradient(180deg,#e58a10,#d97a00)}
.abtn.rcv:active{background:#bd6a00}
.abtn.cfm{background:linear-gradient(180deg,#3a8f60,#2f7d4f)}
.abtn.cfm:active{background:#276a42}
.doneline{display:flex;align-items:center;gap:8px;margin-top:10px;color:var(--done);font-weight:700;font-size:14px}
.blockline{margin-top:10px;font-size:13px;color:var(--ink3)}
.empty{padding:44px 16px;text-align:center;color:var(--ink3);background:#fff;border-radius:var(--r);border:1px dashed var(--line);line-height:1.7}

/* ── 최근 스캔 ── */
.recent{margin-top:16px}
.recent h3{margin:0 0 7px;font-size:13px;color:var(--ink2)}
.rrow{display:flex;gap:9px;align-items:center;background:#fff;border:1px solid var(--line2);border-radius:10px;padding:9px 12px;margin-bottom:6px;font-size:13.5px}
.rrow b{color:var(--blued)}
.rrow span{color:var(--ink2)}
.rrow small{margin-left:auto;color:var(--ink3);font-size:11px;white-space:nowrap}

/* ── 토스트 ── */
.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,140%);z-index:80;background:#243342;color:#fff;
 border-radius:13px;padding:15px 20px;font-size:15px;font-weight:700;box-shadow:0 8px 26px rgba(0,0,0,.32);
 max-width:88vw;text-align:center;transition:transform .22s ease;line-height:1.5}
.toast.on{transform:translate(-50%,0)}
.toast.ok{background:#2f7d4f}.toast.ng{background:#c0392b}
@media(min-width:640px){body{font-size:14px}.cam video{max-height:380px}}
</style></head><body>
<div class="wrap">
 <div class="hd"><h1>📷 외주가공 QR 스캔</h1>
  <span class="live" id="live"><i></i><span id="liveTx">연결 확인중</span></span></div>

 <div class="scan">
  <div class="cam" id="cam"><video id="vid" playsinline muted></video><div class="box"></div>
   <button class="stopb" onclick="stopScan()">✕ 중지</button></div>
  <button class="bigbtn" id="bScan" onclick="startScan()"><span class="ic">▣</span> 카메라로 QR 스캔</button>
  <div class="manual">
   <input id="q" placeholder="제번 또는 품번 직접 입력" enterkeyhint="search" onkeydown="if(event.key==='Enter')manual()">
   <button onclick="manual()">검색</button>
  </div>
  <div class="hint">가공 공정 도면(그림보드)·공정이력카드의 QR(제번_공정_품번)을 스캔하면 해당 부품의 외주가공 공정이 바로 열립니다. 발주 상태는 <b>작업완료(입고 처리)</b>, 입고 상태는 <b>입고 확정</b>을 그 자리에서 실행합니다.</div>
 </div>

 <div id="res"></div>

 <div class="recent" id="recentBox" style="display:none"><h3>최근 처리</h3><div id="recent"></div></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ═══ 상태 ═══ */
const stOf=s=>s==='입고확정'?'done':s==='입고'?'in':s==='발주'?'out':'req';
const STN={done:'입고확정',in:'입고',out:'발주',req:'요청'};
const today=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const n0=v=>Number(v||0);
const online=()=>!!(window.MESDB&&MESDB.online);

/* 오프라인 미리보기용 예시 */
const SAMPLE=[
 {line_id:101,job_no:'IP26-041',part_no:'P-1041-03',part_name:'상형 홀더',process_code:'MC',step_no:1,machining_process_code:'MCT',vendor_name:'대성정밀',status:'입고확정',order_qty:1,receipt_qty:1,required_date:'2026-08-12',confirm_date:'2026-08-12',quote_price:1200000},
 {line_id:102,job_no:'IP26-041',part_no:'P-1041-03',part_name:'상형 홀더',process_code:'MC',step_no:2,machining_process_code:'열처리',vendor_name:'한빛열처리',status:'입고',order_qty:1,receipt_qty:1,required_date:'2026-09-10',receipt_date:'2026-09-11',quote_price:340000},
 {line_id:103,job_no:'IP26-041',part_no:'P-1041-03',part_name:'상형 홀더',process_code:'MC',step_no:3,machining_process_code:'연마',vendor_name:'서진연마',status:'발주',order_qty:1,receipt_qty:0,required_date:'2026-09-16',quote_price:280000},
 {line_id:104,job_no:'IP26-041',part_no:'P-1041-03',part_name:'상형 홀더',process_code:'MC',step_no:4,machining_process_code:'와이어',vendor_name:'',status:'',order_qty:1,receipt_qty:0,required_date:'2026-09-22',quote_price:450000}
];

let lines=[],ctx=null,stream=null,scanning=false,det=null,recent=[];

function setLive(on){
 document.getElementById('live').classList.toggle('on',!!on);
 document.getElementById('liveTx').textContent=on?'실시간 연결':'예시 데이터';
}
function toast(t,kind){
 const el=document.getElementById('toast');
 el.textContent=t;el.className='toast on'+(kind?' '+kind:'');
 try{navigator.vibrate&&navigator.vibrate(kind==='ng'?[80,60,80]:60)}catch(e){}
 clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('on'),2600);
}

/* ═══ QR 스캔 ═══ */
async function startScan(){
 try{
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});
 }catch(e){return toast('카메라를 열 수 없습니다. 브라우저 카메라 권한을 확인하세요.','ng')}
 const v=document.getElementById('vid');
 v.srcObject=stream;await v.play().catch(()=>{});
 document.getElementById('cam').classList.add('on');
 document.getElementById('bScan').style.display='none';
 scanning=true;
 if('BarcodeDetector' in window){try{det=new BarcodeDetector({formats:['qr_code']})}catch(e){det=null}}
 loop();
}
function stopScan(){
 scanning=false;
 try{stream&&stream.getTracks().forEach(t=>t.stop())}catch(e){}
 stream=null;
 document.getElementById('cam').classList.remove('on');
 document.getElementById('bScan').style.display='flex';
}
async function loop(){
 if(!scanning)return;
 const v=document.getElementById('vid');
 if(v.readyState>=2){
  let text='';
  if(det){
   try{const bs=await det.detect(v);if(bs&&bs.length)text=bs[0].rawValue||''}catch(e){}
  }else if(window.jsQR){
   if(!loop.cv){loop.cv=document.createElement('canvas')}
   const cv=loop.cv,w=Math.min(v.videoWidth,640);
   if(w){const h=Math.round(v.videoHeight*w/v.videoWidth);cv.width=w;cv.height=h;
    const g=cv.getContext('2d',{willReadFrequently:true});g.drawImage(v,0,0,w,h);
    try{const r=jsQR(g.getImageData(0,0,w,h).data,w,h,{inversionAttempts:'dontInvert'});if(r&&r.data)text=r.data}catch(e){}}
  }
  if(text){stopScan();onCode(text);return}
 }
 setTimeout(loop,det?220:340);
}

/* QR 해석: 공정이력카드 card_key '제번_공정_품번' / 제번 / 품번 */
function onCode(text){
 toast('QR 인식: '+text.slice(0,40));
 const t=String(text).trim();
 const m=t.split('_');
 if(m.length>=3)return search({job:m[0],part:m.slice(2).join('_')});
 if(m.length===2)return search({job:m[0]});
 return search({any:t});
}
function manual(){
 const t=document.getElementById('q').value.trim();
 if(!t)return toast('제번 또는 품번을 입력하세요.','ng');
 search({any:t});
}

/* ═══ 조회 ═══ */
/* v113: mes_db.js 는 </body> 끝에서 로드되므로 시작 시점엔 window.MESDB 가 아직 없다.
   그대로 online() 을 물으면 '미연결' 로 판정해 예시 데이터가 먼저 그려졌다 → 최대 3초 기다린다. */
async function waitDB(){
 for(let i=0;i<60&&!window.MESDB;i++)await new Promise(r=>setTimeout(r,50));
 if(window.MESDB&&MESDB.ready){try{await MESDB.ready}catch(e){}}
}

/* v196: 공정 코드 → 공정명 (기준정보 › 가공공정관리). 이름을 못 찾으면 코드 그대로 */
let PN={};
async function loadPN(){if(Object.keys(PN).length||!online())return;
 try{const ps=await MESDB.table('processes').select('select=process_code,process_name');(ps||[]).forEach(p=>{const c=String(p.process_code||'').trim();if(c)PN[c.toUpperCase()]=p.process_name||c})}catch(e){}}
const pname=c=>{const k=String(c||'').trim();if(!k)return '-';return PN[k.toUpperCase()]||k};
async function search(key){
 ctx=key;
 const res=document.getElementById('res');
 res.innerHTML='<div class="empty">조회 중…</div>';
 await waitDB();
 if(!online()){
  setLive(false);
  lines=SAMPLE.filter(l=>match(l,key));
  return render();
 }
 setLive(true);
 await loadPN();
 try{
  let q='select=*&category=eq.외주가공&order=part_no,step_no,line_id';
  if(key.job&&key.part)q+=`&job_no=eq.${encodeURIComponent(key.job)}&part_no=eq.${encodeURIComponent(key.part)}`;
  else if(key.job)q+=`&job_no=eq.${encodeURIComponent(key.job)}`;
  else q+=`&or=(job_no.eq.${encodeURIComponent(key.any)},part_no.eq.${encodeURIComponent(key.any)})`;
  lines=await MESDB.table('order_lines').select(q,{fresh:true})||[];
  if(!lines.length&&key.any){ /* 부분일치 재시도 */
   lines=await MESDB.table('order_lines').select(
    `select=*&category=eq.외주가공&or=(job_no.ilike.*${encodeURIComponent(key.any)}*,part_no.ilike.*${encodeURIComponent(key.any)}*)&order=job_no,part_no,step_no&limit=60`,{fresh:true})||[];
  }
  render();
 }catch(e){res.innerHTML=`<div class="empty">조회 실패<br><small>${esc(String(e.message||e).slice(0,90))}</small></div>`}
}
const match=(l,k)=>k.any?(l.job_no===k.any||l.part_no===k.any||String(l.job_no||'').includes(k.any)||String(l.part_no||'').includes(k.any))
 :(l.job_no===k.job&&(!k.part||l.part_no===k.part));

/* ═══ 렌더 ═══ */
function render(){
 const res=document.getElementById('res');
 if(!lines.length){res.innerHTML='<div class="empty">해당 외주가공 발주가 없습니다.<br><small>제번·품번을 확인하거나 QR을 다시 스캔하세요.</small></div>';return}
 /* 부품별 그룹 */
 const g=new Map();
 for(const l of lines){const k=(l.job_no||'')+'|'+(l.part_no||'');if(!g.has(k))g.set(k,[]);g.get(k).push(l)}
 let html='';
 for(const [k,ls] of g){
  ls.sort((a,b)=>n0(a.step_no)-n0(b.step_no)||n0(a.line_id)-n0(b.line_id));
  const f=ls[0];
  html+=`<div class="rh"><b>${esc(f.job_no||'')}</b><span class="pt">${esc(f.part_no||'')}</span>
   <span class="sub">${esc(f.part_name||'')}${f.process_code?' · 공정 '+esc(f.process_code):''} · 외주가공 ${ls.length}단계</span></div>`;
  html+=ls.map((l,i)=>card(l,i,ls)).join('');
 }
 res.innerHTML=html;
}
function card(l,i,ls){
 const st=stOf(l.status);
 const late=st!=='done'&&l.required_date&&String(l.required_date).slice(0,10)<today();
 const ord=n0(l.order_qty)||1,got=n0(l.receipt_qty),rem=Math.max(ord-got,0);
 const prev=i===0?'done':stOf(ls[i-1].status);
 const canOrderNext=st==='req'&&(prev==='done'||prev==='in');   /* v112: 현품 입고되면 다음 공정 발주 가능 */
 let action='';
 if(st==='out'){
  action=`<div class="qtyrow"><label>입고수량</label>
    <input type="number" inputmode="numeric" id="qty_${l.line_id}" value="${rem}" min="1" max="${rem}">
    <small>발주 ${ord} · 기입고 ${got} · 잔량 ${rem}</small></div>
   <div class="act"><button class="abtn rcv" onclick="doReceive(${l.line_id})" title="협력업체·사내 작업자가 작업을 끝냈을 때 누릅니다 — 입고 처리로 기록됩니다">✅ 작업완료 (입고 처리)</button></div>`;
 }else if(st==='in'){
  action=`<div class="act"><button class="abtn cfm" onclick="doConfirm(${l.line_id})">✅ 입고 확정</button></div>`;
 }else if(st==='done'){
  action=`<div class="doneline">✔ 입고확정 완료 <small style="color:var(--ink3);font-weight:500">${esc(String(l.confirm_date||'').slice(0,10))}</small></div>`;
 }else{
  action=`<div class="blockline">${canOrderNext?'⚑ 직전 공정 입고 완료 — PC 발주 화면에서 발주할 수 있습니다.':'⏳ 직전 공정 입고 대기 — 순차 발주 규칙에 따라 대기'}</div>`;
 }
 return `<div class="lcard${late?' late':''}" id="lc_${l.line_id}">
  <div class="l1"><span class="stepn">공정${n0(l.step_no)||i+1}</span><b>${esc(pname(l.machining_process_code||l.process_code))}</b>
   <span class="stag ${late?'lt':st}">${late?'지연':STN[st]}</span></div>
  <div class="l2">${esc(l.vendor_name||'업체 미지정')} <em>·</em> 납기 ${esc(String(l.required_date||'').slice(0,10)||'-')}
   ${l.receipt_date?` <em>·</em> 입고 ${esc(String(l.receipt_date).slice(0,10))}`:''}</div>
  ${action}
 </div>`;
}

/* ═══ 입고 처리 (외주가공 = fn_osp_receive RPC 전용, order_lines 직접 갱신 금지) ═══ */
async function rpc(fn,body){
 const auth=(()=>{try{return window.parent.MES_AUTH||window.MES_AUTH||{}}catch(e){return window.MES_AUTH||{}}})();
 const r=await fetch(MESDB.cfg.url+'/rest/v1/rpc/'+fn,{method:'POST',
  headers:{apikey:MESDB.cfg.key,Authorization:'Bearer '+(auth.token||MESDB.cfg.key),'Content-Type':'application/json'},
  body:JSON.stringify(body)});
 const t=await r.text();
 if(!r.ok)throw new Error(t.slice(0,160));
 try{return JSON.parse(t)}catch(e){return null}
}
async function doReceive(id){
 const l=lines.find(x=>Number(x.line_id)===Number(id));if(!l)return;
 const inp=document.getElementById('qty_'+id);
 const ord=n0(l.order_qty)||1,got=n0(l.receipt_qty),rem=Math.max(ord-got,0);
 const q=inp?Math.max(0,Number(inp.value)||0):rem;
 if(!(q>0))return toast('입고수량을 입력하세요.','ng');
 if(q>rem)return toast(`잔량 ${rem}을 초과했습니다.`,'ng');
 if(!online()){ /* 예시 모드 시뮬레이션 */
  l.receipt_qty=got+q;if(l.receipt_qty>=ord){l.status='입고';l.receipt_date=today()}
  render();return toast(`(예시) ${l.part_no} 공정${l.step_no} 입고 처리`,'ok');
 }
 btnOff(id,true);
 try{
  await rpc('fn_osp_receive',{p_line_id:Number(id),p_qty:q,p_date:today(),p_short:0,p_source:'QR스캔',p_remark:null});
  after(`작업완료 → 입고 처리 — ${l.part_no} ${pname(l.machining_process_code)} (${q}개)`,l,'입고');
 }catch(e){btnOff(id,false);toast('입고 실패: '+String(e.message||e).slice(0,80),'ng')}
}

/* ═══ 입고 확정 (입고확정 화면과 동일: order_lines upsert) ═══ */
async function doConfirm(id){
 const l=lines.find(x=>Number(x.line_id)===Number(id));if(!l)return;
 if(!online()){l.status='입고확정';l.confirm_date=today();render();return toast(`(예시) ${l.part_no} 공정${l.step_no} 입고 확정`,'ok')}
 btnOff(id,true);
 try{
  await MESDB.table('order_lines').upsert([{line_id:Number(id),status:'입고확정',confirm_date:today(),
   confirm_price:n0(l.confirm_price)||n0(l.quote_price)||null,updated_at:new Date().toISOString()}],'line_id');
  after(`입고 확정 완료 — ${l.part_no} ${pname(l.machining_process_code)} · 제조원가에 반영됩니다`,l,'입고확정');
 }catch(e){btnOff(id,false);toast('확정 실패: '+String(e.message||e).slice(0,80),'ng')}
}
function btnOff(id,off){document.querySelectorAll(`#lc_${id} .abtn`).forEach(b=>b.disabled=off)}
async function after(msgTx,l,act){
 try{MESDB.dropCache&&MESDB.dropCache('order_lines')}catch(e){}
 try{MESDB.notify&&MESDB.notify(['order_lines'])}catch(e){}
 recent.unshift({t:new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}),job:l.job_no,part:l.part_no,step:l.step_no,act});
 recent=recent.slice(0,8);renderRecent();
 toast(msgTx,'ok');
 if(ctx)await search(ctx);   /* 최신 상태 재조회 */
}
function renderRecent(){
 const box=document.getElementById('recentBox');
 box.style.display=recent.length?'block':'none';
 document.getElementById('recent').innerHTML=recent.map(r=>
  `<div class="rrow"><b>${esc(r.job)}</b><span>${esc(r.part)} · 공정${r.step}</span>
   <span style="font-weight:800;color:${r.act==='입고확정'?'var(--done)':'var(--in)'}">${r.act}</span><small>${r.t}</small></div>`).join('');
}

/* ═══ 시작 ═══ */
(async function init(){
 await waitDB();
 setLive(online());
 /* 딥링크: ?job=..&part=.. 또는 ?key=제번_공정_품번 */
 const p=new URLSearchParams(location.search);
 if(p.get('key'))onCode(p.get('key'));
 else if(p.get('job'))search({job:p.get('job'),part:p.get('part')||''});
 window.addEventListener('pagehide',stopScan);
 document.addEventListener('visibilitychange',()=>{if(document.hidden)stopScan()});
})();
window.MES=Object.assign(window.MES||{},{search:()=>{if(ctx)search(ctx)},reload:()=>{if(ctx)search(ctx)},
 /* v196: 그림보드 QR 딥링크(index.html?go=qr&key=…)로 들어왔을 때 */
 go:p=>{p=p||{};if(p.key)onCode(String(p.key));else if(p.job)search({job:p.job,part:p.part||''})}});
</script>
