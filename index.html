<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MOLD</title>
<link rel="preconnect" href="https://jgvikmakenpllwxwdugk.supabase.co" crossorigin>
<link rel="dns-prefetch" href="https://jgvikmakenpllwxwdugk.supabase.co">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --side-w:260px; --side-min:56px; --top-h:48px; --tab-h:40px;
  --ink:#1c2430; --ink-2:#4a5568; --ink-3:#8a94a6;
  --steel:#1f2733; --steel-2:#28323f; --steel-3:#343f50;
  --paper:#f1f3f6; --white:#fff; --line:#dfe3ea; --line-2:#303b4c;
  --amber:#f2a93b; --green:#2fb27c; --red:#e05a4a; --blue:#3b82f6; --gray:#9aa4b5;
  --r:6px; --shadow:0 8px 24px rgba(20,28,40,.18);
  font-size:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Pretendard,-apple-system,"Malgun Gothic","맑은 고딕",sans-serif;color:var(--ink);background:var(--paper);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#c2c9d4;border-radius:4px}

.app{display:grid;grid-template-columns:1fr;grid-template-rows:var(--top-h) 1fr;height:100vh}
.top{grid-column:1/-1;display:flex;align-items:center;background:var(--steel);color:#dfe5ee;padding:0 12px 0 0;border-bottom:1px solid var(--line-2);position:relative;z-index:50}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}

/* top */
.brand{height:100%;display:flex;align-items:center;gap:10px;padding:0 16px 0 14px;flex-shrink:0;cursor:pointer;border-right:1px solid var(--line-2)}
.brand .mark{width:28px;height:28px;flex-shrink:0;display:grid;place-items:center;background:var(--amber);color:var(--steel);font-weight:800;border-radius:6px}
.brand .mark.tj{width:32px;font-size:13px;letter-spacing:-.5px;font-family:Arial,"Malgun Gothic",sans-serif}
.brand .name{font-weight:700;letter-spacing:.3px;white-space:nowrap;color:#fff;display:flex;align-items:center;gap:8px}
.brand .name .home-lbl{font-size:14px;color:#fff}
.brand:hover .name .home-lbl{color:var(--amber)}
.brand .name small{font-weight:400;color:#8f9bb0}

.top-menu{display:flex;gap:2px;margin-left:8px;height:100%}
.top-menu>li{position:relative;list-style:none;height:100%;display:flex}
.top-menu>li>button{padding:0 16px;height:100%;color:#c7cfdb;font-weight:600;font-size:15px;border-bottom:2px solid transparent;white-space:nowrap}
.top-menu>li:hover>button{color:#fff;border-bottom-color:var(--amber)}
.top-menu>li.on>button{color:#fff;border-bottom-color:var(--amber)}
.top-menu>li.pin>button{color:#fff;border-bottom-color:var(--amber);background:var(--steel-2)}
.top-menu>li.pin .mega{display:flex}
.mega{position:absolute;top:100%;left:0;display:none;background:var(--white);color:var(--ink);border:1px solid var(--line);border-radius:0 0 var(--r) var(--r);box-shadow:var(--shadow);padding:14px 4px;z-index:60;flex-wrap:wrap;width:max-content;max-width:calc(100vw - 24px);max-height:calc(100vh - var(--top-h) - 12px);overflow-y:auto;overscroll-behavior:contain}
.top-menu>li:hover .mega{display:flex}
.mega .col{padding:0 16px 8px;border-right:1px solid var(--line);min-width:150px;align-self:start}
.mega .col:last-child{border-right:0}
.mega h4{font-size:14px;color:var(--ink-3);font-weight:600;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--line);white-space:nowrap}
.mega h5{font-size:12.5px;color:var(--ink-3);font-weight:500;margin:8px 0 2px}
.mega h5:first-of-type{margin-top:0}
.mega a{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:14px;color:var(--ink);text-decoration:none;white-space:nowrap}
.mega a:hover{color:var(--blue)}
.mega a.active{color:var(--blue);font-weight:600}
.mega a .star{margin-left:auto;padding-left:14px;color:#c9d0da;opacity:0;font-size:12px}
.mega a:hover .star{opacity:1}
.mega a .star.on{opacity:1;color:var(--amber)}

.search{margin-left:auto;position:relative;width:280px}
.search input{width:100%;height:32px;background:var(--steel-2);border:1px solid var(--line-2);border-radius:var(--r);color:#fff;padding:0 32px 0 34px;outline:0}
.search input:focus{border-color:var(--amber)}
.search input::placeholder{color:#7f8aa0}
.search .ico{position:absolute;left:11px;top:9px;color:#7f8aa0}
.search kbd{position:absolute;right:8px;top:8px;font:11px Pretendard;color:#7f8aa0;border:1px solid #4a5568;border-radius:4px;padding:1px 5px}
.search-res{position:absolute;top:36px;left:0;right:0;background:var(--white);color:var(--ink);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);display:none;max-height:360px;overflow:auto;z-index:80}
.search-res.open{display:block}
.search-res button{display:flex;justify-content:space-between;width:100%;text-align:left;padding:9px 12px;font-size:14px}
.search-res button:hover,.search-res button.sel{background:#eef2f8}
.search-res small{color:var(--ink-3)}

.top-actions{display:flex;align-items:center;gap:4px;margin-left:12px}
.icon-btn{width:34px;height:34px;border-radius:var(--r);display:grid;place-items:center;color:#c7cfdb;position:relative}
.icon-btn:hover{background:var(--steel-3);color:#fff}
.icon-btn.txt{width:auto;padding:0 10px;display:flex;gap:6px;align-items:center;font-size:13px;color:var(--amber);border:1px solid var(--line-2)}
.icon-btn.txt:hover{color:#fff;border-color:var(--amber)}
@media (max-width:900px){.icon-btn.txt span{display:none}}
.ubtn{display:flex;align-items:center;gap:8px;padding:4px 8px 4px 4px;border-radius:var(--r);margin-left:6px}
.ubtn:hover{background:var(--steel-3)}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px}
.ubtn .txt{text-align:left;line-height:1.15;white-space:nowrap}
.ubtn .txt b{display:block;color:#fff;font-weight:600}
.ubtn .txt span{font-size:11px;color:#8f9bb0}
.user{display:none} /* mes_auth.js 가 채우는 숨김 영역 */

.dd{position:relative}
.dd-menu{position:absolute;top:calc(100% + 6px);right:0;min-width:200px;background:var(--white);color:var(--ink);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:6px;display:none;z-index:90}
.dd.open .dd-menu{display:block}
/* v230: 🔔 알림 */
.bell-n{position:absolute;top:1px;right:0;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:#e53935;color:#fff;font-size:10px;font-weight:700;line-height:16px;text-align:center}
.bell-menu{width:min(380px,92vw);max-height:70vh;overflow:auto;padding:0!important}
.bell-menu .bh{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);font-weight:700;position:sticky;top:0;background:var(--white)}
.bell-menu .bh{white-space:nowrap}.bell-menu .bh button{width:auto!important;flex:0 0 auto;display:inline-block!important;margin-left:auto;font-size:12px;color:var(--steel-3,#456);border:1px solid var(--line);border-radius:3px;padding:2px 8px;background:none;cursor:pointer}
.bell-menu .bi{display:block;width:100%;text-align:left;padding:8px 10px;border:0;border-bottom:1px solid #eef1f4;background:none;cursor:pointer;line-height:1.45}
.bell-menu .bi:hover{background:#f3f7fb}.bell-menu .bi.un{background:#fff8e6}.bell-menu .bi.un b{color:#0f3d6e}
.bell-menu .bi small{display:block;color:#7b8794;font-size:11px}.bell-menu .bi span{display:block;color:#445;font-size:12px}
.bell-menu .none{padding:24px 10px;text-align:center;color:#8a97a2}
.dd-menu button,.dd-menu a{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:4px;text-align:left;text-decoration:none;color:var(--ink)}
.dd-menu button:hover,.dd-menu a:hover{background:#eef2f8}
.dd-menu hr{border:0;border-top:1px solid var(--line);margin:6px 0}
.dd-menu .hd{padding:6px 10px;font-size:11px;color:var(--ink-3)}

/* tabs */
.tabs{display:flex;align-items:flex-end;height:var(--tab-h);background:#e4e8ee;border-bottom:1px solid var(--line);padding:0 8px;gap:2px;overflow:hidden;flex-shrink:0}
.tabs-scroll{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.tabs-scroll::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px 0 12px;background:#d6dce5;border-radius:6px 6px 0 0;color:var(--ink-2);white-space:nowrap;cursor:pointer;border:1px solid transparent;border-bottom:0;font-size:14px;user-select:none}
.tab:hover{background:#e9edf3}
.tab.active{background:var(--white);color:var(--ink);border-color:var(--line);font-weight:600;position:relative}
.tab.active::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:var(--white)}
.tab .x{width:16px;height:16px;border-radius:4px;display:grid;place-items:center;color:var(--ink-3);font-size:14px;line-height:1}
.tab .x:hover{background:#c8cfda;color:var(--ink)}
.tabs-act{display:flex;gap:2px;padding-bottom:3px}
.tabs-act button{width:28px;height:28px;border-radius:4px;color:var(--ink-3);display:grid;place-items:center}
.tabs-act button:hover{background:#d6dce5;color:var(--ink)}
.ctx{position:fixed;display:none;background:var(--white);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:5px;min-width:170px;z-index:200}
.ctx.open{display:block}
.ctx button{display:block;width:100%;text-align:left;padding:7px 10px;border-radius:4px}
.ctx button:hover{background:#eef2f8}

/* content */
/* v115: 화면 안 ○제목을 없애고(mes_ctx) 경로표시 마지막 항목이 제목 역할 */
.crumb{display:flex;align-items:center;gap:6px;padding:6px 18px;color:var(--ink-3);font-size:13px;background:var(--white);border-bottom:1px solid var(--line)}
.crumb b{color:var(--ink);font-weight:700;font-size:19px;margin-left:2px}
.crumb .right{margin-left:auto;display:flex;gap:14px;font-family:ui-monospace,Consolas,monospace;font-size:11px}
.stage{flex:1;min-height:0;position:relative;background:var(--white)}
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--white);visibility:hidden;pointer-events:none;z-index:0}
.stage iframe.on{visibility:visible;pointer-events:auto;z-index:1}
.stage .vwait{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(255,255,255,.72);color:var(--ink-2);font-size:13px;z-index:5}
.stage .vwait.on{display:flex}
.placeholder{display:none;height:100%;padding:26px 28px}
.placeholder.on{display:block}
.ph h1{font-size:20px;font-weight:700;margin-bottom:4px}
.ph p{color:var(--ink-3);margin-bottom:22px}
.ph code{background:#e9edf3;padding:2px 6px;border-radius:4px;font-family:ui-monospace,Consolas,monospace;font-size:12px}
.card{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}

/* home */
.home{padding:18px 22px;display:grid;gap:14px;grid-template-columns:repeat(12,1fr);height:100%;overflow:auto;align-content:start}
.home .card h3{font-size:14px;font-weight:600;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.home .card h3 span{font-size:12px;color:var(--ink-3);font-weight:400}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.quick button{border:1px solid var(--line);border-radius:var(--r);padding:12px 8px;display:grid;gap:6px;justify-items:center;font-size:12px;color:var(--ink-2);text-align:center}
.quick button:hover{border-color:var(--blue);color:var(--blue);background:#f4f8ff}
.modcard{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.modcard button{border:1px solid var(--line);border-radius:var(--r);padding:14px 12px;text-align:left;display:grid;gap:4px}
.modcard button b{font-size:14px}
.modcard button small{color:var(--ink-3);font-size:11px;line-height:1.4;white-space:normal}
.modcard button:hover{border-color:var(--blue);background:#f4f8ff}
.favlist{display:grid;gap:4px}
.favlist button{display:flex;justify-content:space-between;padding:7px 10px;border-radius:4px;border:1px solid var(--line)}
.favlist button:hover{border-color:var(--blue);color:var(--blue)}
.favlist small{color:var(--ink-3)}

.status{height:24px;background:var(--steel);color:#8f9bb0;font-size:11px;display:flex;align-items:center;gap:18px;padding:0 14px;flex-shrink:0}
.status .dot{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block;margin-right:5px}
.status .r{margin-left:auto}

@media (max-width:1100px){.modcard{grid-template-columns:repeat(2,1fr)}.home>.card{grid-column:span 12!important}}
@media (max-width:900px){.top-menu,.ubtn .txt{display:none}.search{width:170px}}

/* ── TJD v278: 모바일 — 햄버거 메뉴(서랍) ── */
.hbg{display:none;width:44px;height:100%;place-items:center;color:#fff;font-size:22px;flex-shrink:0;border-right:1px solid var(--line-2)}
.mnav-bg{position:fixed;inset:0;background:rgba(10,16,24,.45);z-index:300;display:none}
.mnav{position:fixed;top:0;bottom:0;left:0;width:min(84vw,320px);background:var(--white);color:var(--ink);z-index:310;transform:translateX(-102%);transition:transform .22s ease;display:flex;flex-direction:column;box-shadow:var(--shadow)}
body.mnav-open .mnav{transform:none}body.mnav-open .mnav-bg{display:block}
.mnav .mh{height:var(--top-h);display:flex;align-items:center;gap:10px;padding:0 10px 0 14px;background:var(--steel);color:#fff;font-weight:700;flex-shrink:0}
.mnav .mh .x{margin-left:auto;width:36px;height:36px;display:grid;place-items:center;font-size:22px;color:#fff}
.mnav .ms{padding:8px 10px;border-bottom:1px solid var(--line);flex-shrink:0}
.mnav .ms input{width:100%;height:36px;border:1px solid var(--line);border-radius:var(--r);padding:0 10px;outline:0;font-size:15px}
.mnav .ms input:focus{border-color:var(--blue)}
.mnav .mb{flex:1;overflow-y:auto;overscroll-behavior:contain;padding-bottom:30px}
.mnav .mod{border-bottom:1px solid var(--line)}
.mnav .mod>button{width:100%;display:flex;align-items:center;justify-content:space-between;padding:13px 14px;font-size:16px;font-weight:700;color:var(--ink)}
.mnav .mod>button::after{content:"▾";color:var(--ink-3);font-size:13px;transition:transform .15s}
.mnav .mod.open>button::after{transform:rotate(180deg)}
.mnav .mod>button.cur{color:var(--blue)}
.mnav .mod .sec{display:none;background:#f7f9fc;padding:4px 0 8px}
.mnav .mod.open .sec{display:block}
.mnav .sec h4{font-size:12px;color:var(--ink-3);font-weight:600;padding:8px 18px 2px}
.mnav .sec h5{font-size:11.5px;color:var(--ink-3);font-weight:500;padding:6px 18px 0}
.mnav .sec a{display:flex;align-items:center;padding:10px 18px 10px 26px;font-size:15px;color:var(--ink);text-decoration:none;border-left:3px solid transparent}
.mnav .sec a.active{color:var(--blue);font-weight:600;border-left-color:var(--blue);background:#eef4ff}
.mnav .sec a .star{margin-left:auto;color:#c9d0da;font-size:14px;padding:0 4px}
.mnav .sec a .star.on{color:var(--amber)}
.mnav .sec a.menu-off{display:none}
.mnav .fv{padding:6px 0 10px;border-bottom:1px solid var(--line)}
.mnav .fv h4{font-size:12px;color:var(--ink-3);font-weight:600;padding:8px 14px 2px}
.mnav .fv a{display:block;padding:9px 18px;font-size:15px;color:var(--ink);text-decoration:none}
.mnav .mres a{display:block;padding:10px 14px;font-size:15px;color:var(--ink);text-decoration:none;border-bottom:1px solid #eef1f4}
.mnav .mres a small{display:block;color:var(--ink-3);font-size:11px}
.mnav .mres .none{padding:20px 14px;color:var(--ink-3);text-align:center}
@media (max-width:900px){
  .hbg{display:grid}
  .brand{padding:0 10px 0 8px;border-right:0}.brand .name small{display:none}
  .search{display:none}
  .top{padding-right:4px}.top-actions{margin-left:auto;gap:0}
  .icon-btn.txt{border:0;padding:0;width:34px}
  .ubtn{padding:4px;margin-left:0}
  .crumb{padding:5px 10px;font-size:12px}.crumb b{font-size:16px}.crumb .right{display:none}
  .tabs{padding:0 4px}.tab{padding:0 8px 0 10px;font-size:13px}
  .status{font-size:10px;padding:0 8px;gap:10px}
  .home{padding:12px;gap:10px}.quick{grid-template-columns:repeat(3,1fr)}.modcard{grid-template-columns:1fr}
}
a.menu-off,a.menu-off:hover{color:#9aa5ae!important;opacity:.55;cursor:not-allowed!important;background:none!important;text-decoration:none}
</style>
</head>
<body>

<div class="app" id="app">
  <header class="top">
    <button class="hbg" id="hbg" title="메뉴" aria-label="메뉴">☰</button>
    <div class="brand" id="brand" title="홈">
      <div class="mark tj" title="TJ">TJ</div>
      <div class="name"><span class="home-lbl">⌂ 홈</span><small>MOLD</small></div>
    </div>

    <ul class="top-menu" id="topMenu"></ul>

    <div class="search">
      <span class="ico">⌕</span>
      <input id="menuSearch" placeholder="메뉴 검색" autocomplete="off">
      <kbd>Ctrl K</kbd>
      <div class="search-res" id="searchRes"></div>
    </div>

    <div class="top-actions">
      <button class="icon-btn txt" id="btnReq" title="수정요청게시판">✎<span>수정요청</span></button>
      <div class="dd" id="ddBell">
        <button class="icon-btn" title="알림">🔔<span class="bell-n" id="bellN" hidden>0</span></button>
        <div class="dd-menu bell-menu" id="bellMenu"></div>
      </div>
      <div class="dd" id="ddFav">
        <button class="icon-btn" title="즐겨찾기">★</button>
        <div class="dd-menu" id="favMenu"></div>
      </div>
      <div class="dd" id="ddUser">
        <button class="ubtn">
          <span class="avatar" id="uAv">?</span>
          <span class="txt"><b id="uName">-</b><span id="uRole">-</span></span>
        </button>
        <div class="dd-menu">
          <div class="hd" id="uHd">MOLD</div>
          <button id="btnPw">비밀번호 변경</button>
          <hr>
          <button id="btnLogout">로그아웃</button>
        </div>
      </div>
      <div class="user"></div>
    </div>
  </header>

  <section class="main">
    <div class="tabs">
      <div class="tabs-scroll" id="tabs"></div>
      <div class="tabs-act">
        <button id="tabPrev" title="이전 탭">‹</button>
        <button id="tabNext" title="다음 탭">›</button>
        <button id="tabCloseAll" title="모두 닫기">×</button>
      </div>
    </div>
    <div class="ctx" id="tabCtx">
      <button data-act="refresh">새로고침</button>
      <button data-act="pin">고정 / 해제</button>
      <button data-act="others">다른 탭 닫기</button>
      <button data-act="right">오른쪽 탭 닫기</button>
      <button data-act="close">닫기</button>
    </div>
    <div class="crumb" id="crumb"><span>MOLD</span></div>
    <div class="stage" id="stage"><div class="vwait" id="vwait">화면을 여는 중…</div></div>
    <div class="status">
      <span><span class="dot"></span><span id="statusMsg">준비</span></span>
      <span id="verTxt"></span>
      <span class="r" id="now"></span>
    </div>
  </section>
</div>
<div class="mnav-bg" id="mnavBg"></div>
<nav class="mnav" id="mnav" aria-label="모바일 메뉴">
  <div class="mh"><span class="mark tj" style="width:32px;height:28px;display:grid;place-items:center;background:var(--amber);color:var(--steel);border-radius:6px;font-size:13px">TJ</span>MOLD 메뉴<button class="x" id="mnavX" aria-label="닫기">×</button></div>
  <div class="ms"><input id="mnavQ" placeholder="메뉴 검색" autocomplete="off" inputmode="search"></div>
  <div class="mb" id="mnavBody"></div>
</nav>

<script>
const APP_VER='291';
const APP={
  '영업관리':{
    secondary:[
      {name:'수주',icon:'▣'},

function canView(path){if((path||'').includes('사용메뉴얼'))return true;const a=window.MES_AUTH;return !a||!a.session?true:a.can(path,'view')}
/* v196: 숨김 모듈 — 상단 메뉴·홈·메뉴검색·즐겨찾기에서 모두 뺀다 (화면 파일은 그대로) */
const MODULE_HIDE=new Set(['SQ']);
function visibleModules(){return MODULES.filter(m=>{if(MODULE_HIDE.has(m))return false;if(m==='사용메뉴얼')return true;const a=window.MES_AUTH;if(!a||!a.session||a.role==='admin'||a.role==='master')return true;
  return Object.entries(APP[m]?.menus||{}).some(([sec,gs])=>gs.some(g=>g.items.some(n=>a.can(m+'/'+sec+'/'+n,'view'))))})}
/* v196: 비활성 메뉴(MENU_OFF)는 흐리게 두지 않고 목록에서 숨긴다. 모두 숨겨진 소제목·섹션도 사라진다 */
function groupsOf(mod,sec){return (APP[mod]?.menus?.[sec]||[]).map(g=>({name:g.name,items:g.items.filter(n=>!menuOff(n,mod)&&canView(mod+'/'+sec+'/'+n))})).filter(g=>g.items.length)}
/* 화면파일 → 메뉴경로 (iframe의 mes_db.js가 권한 판단에 사용) */
window.MES_MENU_OF=function(file){
  for(const [mod,cfg] of Object.entries(APP))
    for(const [sec,groups] of Object.entries(cfg.menus||{}))
      for(const g of groups)for(const n of g.items)
        if(pageRegistry[n]?.file===file)return mod+'/'+sec+'/'+n;
  return null;
};
/* 메뉴명 → {mod,sec,group} */
function locate(name){
  for(const mod of MODULES)if(!MODULE_HIDE.has(mod))for(const [sec,gs] of Object.entries(APP[mod]?.menus||{}))for(const g of gs)if(g.items.includes(name)&&!menuOff(name,mod))return{mod,sec,group:g.name};
  return null;
}

  /* v229: 기준정보 › 단가관리 — 단가변동 4개 메뉴 숨김 (작업단가만 남김). 화면·표(material/process_price_changes)는 그대로 — 발주 단가 자동조회(mes_price.js)는 기존 자료로 계속 동작 */

function flatMenu(){const out=[];for(const mod of visibleModules())for(const sec of (APP[mod]?.secondary||[]))for(const g of groupsOf(mod,sec.name))for(const n of g.items)if(!menuOff(n,mod))out.push({name:n,mod,sec:sec.name,group:g.name});return out}

/* ---------- 상단 모듈 메뉴 (메가) ---------- */
function buildTop(){
  const ul=$('#topMenu');ul.innerHTML='';
  visibleModules().forEach(mod=>{
    const li=el('li',mod===activeModule?'on':'');
    const b=el('button','',mod);b.onclick=()=>{const was=li.classList.contains('pin');if(was)setModule(mod);else pinModule(mod)};li.appendChild(b);
    const mega=el('div','mega');let any=false;
    (APP[mod]?.secondary||[]).forEach(sec=>{
      const gs=groupsOf(mod,sec.name);if(!gs.length)return;any=true;
      const col=el('div','col',`<h4>${sec.icon||''} ${esc(sec.name)}</h4>`);
      gs.forEach(g=>{if(gs.length>1||g.name!==sec.name)col.appendChild(el('h5','',esc(g.name)));
        g.items.forEach(n=>col.appendChild(menuLink(n,mod)))});
      mega.appendChild(col);
    });
    if(any){li.appendChild(mega);li.onmouseenter=()=>placeMega(li,mega);li.onmouseleave=()=>li.classList.remove('pin')}
    ul.appendChild(li);
    /* 조직도는 상단메뉴에서 숨긴다 (사용메뉴얼 › 조직 › 조직도 로 접근) */
  });
}

/* 메가메뉴가 화면 오른쪽을 넘지 않게 위치 보정 */
function placeMega(li,mega){
  if(!mega)return;mega.style.left='0px';mega.style.display='flex';
  const r=mega.getBoundingClientRect(),vw=window.innerWidth-12;
  if(r.right>vw)mega.style.left=(vw-r.right)+'px';
  const lr=li.getBoundingClientRect();if(lr.left+parseFloat(mega.style.left)<12)mega.style.left=(12-lr.left)+'px';
  mega.style.display='';
}

function menuLink(n,mod){

function openByName(name,force){

/* v196: 근거 자료로 이동 — 화면을 열고, 그 화면(iframe)이 준비되면 MES.go(params) 를 불러 제번·부품을 찾아가게 한다 (mes_go.js) */
window.MES_GO=function(name,params,force){
  if(MENU_OFF.has(name)&&!force){statusMsg.textContent=`${name} 메뉴는 사용하지 않습니다.`;return}
  openByName(name,force);const p=pageRegistry[name];if(!p||!p.file)return;
  const t0=Date.now();let sent=false;
  (function tick(){if(sent)return;const v=document.getElementById('view_'+p.id);let w=null;try{w=v&&v.contentWindow}catch(e){}
    try{if(w&&w.MES&&typeof w.MES.go==='function'&&w.document&&w.document.readyState!=='loading'){sent=true;w.MES.go(params||{});return}}catch(e){sent=true;return}
    if(Date.now()-t0<20000)setTimeout(tick,150);else statusMsg.textContent=`${name} 화면에서 해당 자료를 찾지 못했습니다.`})();
};
/* v196: QR 딥링크 — index.html?go=qr&key=제번_공정_품번  (그림보드 QR).  로그인이 끝난 뒤 「외주가공 QR 스캔」 을 그 부품으로 연다 (숨긴 메뉴여도 연다) */
(function(){let done=false;
  function run(){if(done)return;let q;try{q=new URLSearchParams(location.search)}catch(e){return}
    const go=q.get('go');if(!go)return;
    const a=window.MES_AUTH;if(a&&!a.session&&document.getElementById('loginGate'))return;   /* 로그인 뒤에 다시 시도 */
    done=true;
    if(go==='qr'){MES_GO('외주가공 QR스캔',{key:q.get('key')||'',job:q.get('job')||'',part:q.get('part')||''},true);
      statusMsg.textContent='QR 스캔 화면을 열었습니다: '+(q.get('key')||'')}
    else{const name=decodeURIComponent(go);if(pageRegistry[name])MES_GO(name,Object.fromEntries(q.entries()),true)}
    try{history.replaceState(null,'',location.pathname)}catch(e){}}
  window.addEventListener('mes-auth-ready',()=>setTimeout(run,100));
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>setTimeout(run,300));else setTimeout(run,300);
  setTimeout(run,1500);
})();

function swapTo(id){
  clearTimeout(vwaitTimer);pendingId=null;VREADY.add(id);vwait.classList.remove('on');
  stage.querySelectorAll('iframe,.placeholder').forEach(x=>x.classList.toggle('on',x.id==='view_'+id));

function renderStage(){
  for(const p of openTabs.values())makeView(p);
  const v=document.getElementById('view_'+activeId);
  if(!v){vwait.classList.remove('on');stage.querySelectorAll('iframe,.placeholder').forEach(x=>x.classList.remove('on'));return}
  if(VREADY.has(activeId)||viewReady(v)){swapTo(activeId);return}
  pendingId=activeId;vwait.classList.add('on');const t0=Date.now();clearTimeout(vwaitTimer);
  (function poll(){if(pendingId!==activeId)return;const f=document.getElementById('view_'+activeId);
    if(!f||viewReady(f)||Date.now()-t0>3000){swapTo(activeId);return}vwaitTimer=setTimeout(poll,60)})();
}

  const H=()=>({apikey:KEY,Authorization:'Bearer '+(window.MES_AUTH?.token||KEY),'Content-Type':'application/json'});
  const api=async(p,o)=>{const r=await fetch(URL_+'/rest/v1/'+p,Object.assign({headers:H()},o||{}));if(!r.ok)throw new Error(r.status);const t=await r.text();return t?JSON.parse(t):null};
  const mine=a=>{const r=String(a.recipients||'').trim();if(r==='__none__')return false;if(!r)return true;return r.split(/[,\s]+/).filter(Boolean).includes(me())};
  const unread=a=>!(a.read_by||[]).includes(me());
  const when=t=>{const d=new Date(t),m=Math.round((Date.now()-d)/60000);return m<1?'방금':m<60?m+'분 전':m<1440?Math.round(m/60)+'시간 전':d.toLocaleDateString('ko-KR',{month:'2-digit',day:'2-digit'})};
  function render(){
    const n=LIST.filter(unread).length,b=document.getElementById('bellN');if(b){b.hidden=!n;b.textContent=n>99?'99+':n}
    const m=document.getElementById('bellMenu');if(!m)return;
    m.innerHTML=`<div class="bh"><span>알림</span> ${n?`<span style="color:#e53935">${n}</span>`:''}<button id="bellAll">모두 읽음</button><button id="bellSet" style="margin-left:0">설정</button></div>`+
      (LIST.length?LIST.map(a=>`<button class="bi${unread(a)?' un':''}" data-id="${a.id}" data-k="${esc(a.kind)}"><small>${a.kind==='qr_receive'?'QR 등록':'제작계획 지연'} · ${esc(when(a.created_at))}</small><b>${esc(a.title)}</b><span>${esc(a.message||'')}</span></button>`).join(''):'<div class="none">최근 2주 알림이 없습니다.</div>');
    m.querySelector('#bellAll').onclick=e=>{e.stopPropagation();read(LIST.filter(unread).map(a=>a.id))};
    m.querySelector('#bellSet').onclick=e=>{e.stopPropagation();closeDd();openByName('알림등록')};
    m.querySelectorAll('.bi').forEach(x=>x.onclick=()=>{read([Number(x.dataset.id)]);closeDd();openByName(x.dataset.k==='qr_receive'?'사내외가공 발주':'제작계획등록')});
  }
  async function read(ids){if(!ids.length||!me())return;LIST.forEach(a=>{if(ids.includes(a.id)&&unread(a))(a.read_by=a.read_by||[]).push(me())});render();
    try{await api('rpc/fn_alert_read',{method:'POST',body:JSON.stringify({p_ids:ids,p_name:me()})})}catch(e){}}
  async function ntfyRelay(){try{const rs=await api('rpc/fn_alert_ntfy_claim',{method:'POST',body:'{}'});
    for(const a of rs||[])try{await fetch(String(a.ntfy_server||'https://ntfy.sh').replace(/\/+$/,''),{method:'POST',body:JSON.stringify({topic:a.ntfy_topic,title:a.title,message:a.message||'',tags:[a.kind==='qr_receive'?'package':'warning']})})}catch(e){}}catch(e){}}
  async function daily(){const d=new Date().toLocaleDateString('sv-SE');let last='';try{last=localStorage.getItem('mesbell.plan')||''}catch(e){}
    if(last===d)return;try{await api('rpc/fn_alert_plan_check',{method:'POST',body:'{}'});localStorage.setItem('mesbell.plan',d)}catch(e){}}
  async function poll(){if(busy||!window.MES_AUTH?.token)return;busy=true;
    try{const since=new Date(Date.now()-14*864e5).toISOString();
      const rs=await api(`mes_alerts?select=id,kind,title,message,job_no,recipients,read_by,created_at&created_at=gte.${encodeURIComponent(since)}&order=id.desc&limit=60`);
      /* v231: 새 QR 작업완료가 있으면 열려 있는 사내외가공 발주 화면을 새로 읽힌다 (받는 사람과 무관) */
      const maxId=Math.max(0,...(rs||[]).map(a=>Number(a.id)||0));
      if(lastId){const qj=[...new Set((rs||[]).filter(a=>a.kind==='qr_receive'&&Number(a.id)>lastId).map(a=>a.job_no).filter(Boolean))];
        if(qj.length)try{const w=document.getElementById('view_outsourcing_order_input')?.contentWindow;if(w&&typeof w.qrRefresh==='function')w.qrRefresh(qj)}catch(e){}}
      lastId=Math.max(lastId,maxId);
      const prev=new Set(LIST.map(a=>a.id));LIST=(rs||[]).filter(mine).slice(0,40);render();
      const fresh=LIST.filter(a=>unread(a)&&!prev.has(a.id));
      if(prev.size&&fresh.length){const b=document.querySelector('#ddBell .icon-btn');if(b){b.animate([{transform:'rotate(0)'},{transform:'rotate(-18deg)'},{transform:'rotate(18deg)'},{transform:'rotate(0)'}],{duration:500,iterations:2})}}
      await ntfyRelay();
    }catch(e){/* 표(mes_alerts)가 없으면 조용히 */}
    finally{busy=false}}
  function start(){if(timer)return;poll();daily();timer=setInterval(()=>{if(document.visibilityState!=='hidden')poll()},20000);   /* v231: 20초 */
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')poll()})}
  window.addEventListener('mes-auth-ready',()=>setTimeout(start,800));
  if(window.MES_AUTH?.token)setTimeout(start,800);
  return {poll,read,get list(){return LIST}};
})();

/* ---------- 선반입 ---------- */
const _pf=new Set();
function prefetch(url){if(!url||_pf.has(url))return;_pf.add(url);
  try{const l=document.createElement('link');l.rel='prefetch';l.href=url;l.as='document';document.head.appendChild(l)}catch(e){}
  try{fetch(url,{cache:'force-cache'}).catch(()=>{})}catch(e){}}
(window.requestIdleCallback||(f=>setTimeout(f,1200)))(()=>{
  ['mes_db.js?v='+APP_VER,'mes_ctx.js?v='+APP_VER,'mes_lookup.js?v='+APP_VER,'mes_paste.js?v='+APP_VER,'mes_auth.js?v='+APP_VER].forEach(prefetch);
  let i=0;const hot=['sale_order_status.html','purchase_order_input.html','purchase_order_status.html','material_order_input.html','outsourcing_order_input.html','vendor_management.html','status_board.html'];
  const step=()=>{if(i>=hot.length)return;prefetch(hot[i++]+'?v='+APP_VER);setTimeout(step,600)};step()});

function tick(){now.textContent=new Date().toLocaleString('ko-KR',{dateStyle:'medium',timeStyle:'medium'})}
verTxt.textContent='APP v'+APP_VER;
/* 새로고침 시 열린 탭·현재 화면 복원 */
const TABKEY='tjdtmes.tabs';
const keyOf=p=>Object.keys(pageRegistry).find(k=>pageRegistry[k]===p);
function saveTabs(){try{const names=[...openTabs.values()].filter(p=>!p.home&&p.file).map(keyOf).filter(Boolean);const a=openTabs.get(activeId);sessionStorage.setItem(TABKEY,JSON.stringify({names,active:a&&!a.home?keyOf(a):''}))}catch(e){}}
function restoreTabs(raw){try{const st=JSON.parse(raw||'null');if(!st||!st.names||!st.names.length)return;st.names.forEach(n=>{if(pageRegistry[n]&&pageRegistry[n].file)openByName(n)});if(st.active&&pageRegistry[st.active])openByName(st.active);else openPage(HOME)}catch(e){}}
const _tabs=(()=>{try{return sessionStorage.getItem('tjdtmes.tabs')}catch(e){return null}})();buildTop();renderFav();syncUser();openPage(HOME);restoreTabs(_tabs);tick();setInterval(tick,1000);
</script>
<script>document.write('<script src="mes_auth.js?v='+APP_VER+'"><\/script>')</script>
<script>window.addEventListener("mes-auth-ready",()=>{try{VREADY.clear();buildTop();renderFav();syncUser();const h=document.getElementById('view_home');if(h)h.innerHTML=homeHTML();renderStage()}catch(e){}});</script>
</body>
