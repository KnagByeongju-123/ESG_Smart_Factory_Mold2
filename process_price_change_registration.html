<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>공정단가변동 등록</title><style>
:root{--line:#98a6b2;--line2:#c5d0d8;--blue:#2f75b5;--ink:#344757;--head1:#e8f1f8;--head2:#c8dbe9}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:"Malgun Gothic","맑은 고딕",Arial,sans-serif;font-size:12px;color:var(--ink);background:#fff;overflow:hidden}
button,input,select{font:inherit;color:inherit}.screen{height:100%;display:flex;flex-direction:column;background:#fff}
.title{height:48px;padding:8px 14px 5px;border-bottom:2px solid #3978ae;display:flex;align-items:center}.title h1{margin:0;font-size:22px;font-weight:500;color:#4b5c6a}.title h1:before{content:'◯';margin-right:6px;color:#8796a1}.title small{font-size:11px;color:#9ca7af;margin-left:12px}
.form{padding:7px 14px;background:#fafbfc;border-bottom:1px solid var(--line2)}.formrow{display:grid;grid-template-columns:78px 140px 78px 150px 90px 150px 90px minmax(160px,1fr);gap:5px;align-items:center}.formrow+.formrow{margin-top:5px}.label{font-weight:700}.field{height:27px;border:1px solid #b5c0c9;background:#fff;padding:0 6px;min-width:0}
.entrybox,.gridbox{margin:0 14px;border:1px solid var(--line);overflow:auto;background:#fff}.entrybox{height:190px}.gridbox{flex:1;min-height:0}
.searchline{height:39px;margin:0 14px;display:flex;align-items:center;gap:5px;border-left:1px solid var(--line);border-right:1px solid var(--line);padding:4px 8px;background:#f6f8fa}.searchline input{width:min(430px,48vw);height:27px;border:1px solid #aeb9c3;padding:0 7px}
.btn{height:29px;min-width:62px;border:1px solid #9ba8b4;background:linear-gradient(#fff,#dfe6eb);cursor:pointer}.btn:hover{background:#fff}
table{border-collapse:collapse;min-width:1040px;width:100%;table-layout:fixed}th,td{height:27px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:0 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}th{position:sticky;top:0;z-index:2;text-align:center;background:linear-gradient(var(--head1),var(--head2));color:#405266}tbody tr:nth-child(even) td{background:#fafcfd}tbody tr:hover td{background:#edf6fd}tbody tr.sel td{background:#2d75b7;color:#fff}.c{text-align:center}.num{text-align:right}.toolbar{height:40px;display:flex;align-items:center;gap:5px;padding:4px 14px;background:#f5f7f8;border-bottom:1px solid var(--line2)}
.foot{height:42px;display:flex;align-items:center;padding:5px 14px;border-top:1px solid var(--line);background:#eef2f5;gap:5px}.msg{margin-left:8px;color:#687784}.right{margin-left:auto;color:#7c8993}
.split{flex:1;min-height:0;display:grid;grid-template-rows:1fr 1fr;gap:10px;padding:0 14px 8px}.split .gridbox{margin:0}
@media(max-width:900px){.formrow{grid-template-columns:78px 1fr 78px 1fr}.entrybox,.gridbox,.searchline{margin-left:6px;margin-right:6px}}

/* v21 입력란 배치 보정: 좁은 폭에서 필드를 숨기지 않고 단계적으로 줄바꿈 */
.field,.formrow input,.formrow select,.formgrid input,.formgrid select,.detail-grid input,.detail-grid select{min-width:0;max-width:100%}
.lab,.label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:1400px){.formrow{grid-template-columns:78px minmax(0,1fr) 78px minmax(0,1fr)}}
@media(max-width:880px){.formrow{grid-template-columns:78px minmax(0,1fr)}}
.formrow>*{min-width:0}
</style></head><body><div class="screen">
<div class="title"><h1>공정단가변동 등록</h1></div>
<section class="form">
 <div class="formrow"><div class="label">등록일</div><input type="date" id="regDate" class="field" value="2026-08-22"><div class="label">담당자</div><input id="registrant" class="field"><div class="label">가공공정그룹</div><select id="group" class="field"><option>설계</option><option>가공</option><option>조립</option></select><div class="label">가공공정</div><input id="process" class="field"></div>
 <div class="formrow"><div class="label">적용시작일</div><input type="date" id="effective" class="field"><div class="label">단가</div><input type="number" id="price" class="field" value="0"><div class="label">협력업체</div><input id="vendor" class="field"><div></div><div></div></div>
</section>
<div class="entrybox"><table><thead><tr><th style="width:180px">적용시작일</th><th style="width:150px">단가</th><th></th></tr></thead><tbody><tr><td></td><td class="num">0</td><td></td></tr><tr><td></td><td class="num">0</td><td></td></tr><tr><td></td><td class="num">0</td><td></td></tr><tr><td></td><td class="num">0</td><td></td></tr><tr><td></td><td class="num">0</td><td></td></tr><tr><td></td><td class="num">0</td><td></td></tr><tr><td></td><td class="num">0</td><td></td></tr></tbody></table></div>
<div class="toolbar"><button class="btn" onclick="save()">▣ 저장</button><button class="btn" onclick="newRow()">＋ 신규</button><button class="btn" onclick="window.remove()">✖ 삭제</button></div>
<div class="searchline"><input id="query" placeholder="검색어를 입력하세요."><button class="btn" onclick="search()">찾기</button><button class="btn" onclick="clearSearch()">지우기</button></div>
<div class="gridbox"><table><thead><tr><th>등록일</th><th>가공공정그룹</th><th>가공공정코드</th><th>가공공정명</th><th>협력업체코드</th><th>협력업체명</th><th>단가</th><th>담당자</th></tr></thead><tbody id="body"></tbody></table></div>
<footer class="foot"><button class="btn" onclick="save()">▣ 저장</button><button class="btn" onclick="newRow()">＋ 신규</button><button class="btn" onclick="window.remove()">✖ 삭제</button><button class="btn" onclick="window.parent?.closeActive?.()">⊠ 닫기</button><span class="msg" id="message">공정단가 데이터를 조회했습니다.</span><span class="right" id="countText"></span></footer>
</div><script>
/* v46: 작성자/담당자 기본값 = 로그인 사용자 (회사명 하드코딩 제거) */
const OWNER=(function(){try{return (window.MES_AUTH||window.parent.MES_AUTH)?.name||'담당자'}catch(e){return '담당자'}})();

const data=[];let view=[...data];
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function render(){const vs=view.filter(r=>r.registered_date);body.innerHTML=vs.map((r,i)=>`<tr onclick="selectRow(${i},this)"><td>${esc(r.registered_date)}</td><td>${esc(r.process_group)}</td><td>${esc(r.process_code)}</td><td>${esc(r.process_name)}</td><td>${esc(r.vendor_code)}</td><td>${esc(r.vendor_name)}</td><td class="num">${Number(r.unit_price).toLocaleString()}</td><td>${esc(r.registered_by||'')}</td></tr>`).join('');_vs=vs;countText.textContent=`${vs.length}건`}
function search(){const q=query.value.trim().toLowerCase();view=!q?[...data]:data.filter(r=>Object.values(r).some(v=>String(v??'').toLowerCase().includes(q)));render()}
function clearSearch(){query.value='';view=[...data];render()}
let _vs=[],selRow=null;
const online=()=>!!(window.MESDB&&MESDB.online);
async function waitDB(){for(let i=0;i<60&&!window.MESDB;i++)await new Promise(r=>setTimeout(r,50));
 if(window.MESDB&&MESDB.ready){try{await MESDB.ready}catch(e){}}}
function selectRow(i,tr){const r=_vs[i];selRow=r;
 document.querySelectorAll('#body tr').forEach(x=>x.classList.remove('sel'));tr.classList.add('sel');
 group.value=r.process_group||'가공';process.value=r.process_code||'';vendor.value=r.vendor_code||'';
 price.value=r.unit_price||0;effective.value=r.effective_date||'';regDate.value=r.registered_date||regDate.value;
 registrant.value=r.registered_by||r.manager_name||'';
 message.textContent=`${r.process_code} / ${r.vendor_name||r.vendor_code} 단가를 선택했습니다.`}
async function reload(){
 await waitDB(); if(!online())return;
 try{const rs=await MESDB.table('process_price_changes').select('select=*&order=row_no');
  data.length=0;data.push(...rs);view=[...data];render()}catch(e){}
}
/* v62: 코드 입력 시 마스터에서 명칭을 채운다 (코드가 명칭 칸에 그대로 저장되어 MESPRICE 업체 매칭이 '타업체 단가' 로 표기되던 문제) */
async function nameOf(table,codeCol,nameCol,code){
 try{const rs=await MESDB.table(table).select(`select=${nameCol}&${codeCol}=eq.${encodeURIComponent(code)}&limit=1`);return rs&&rs[0]&&rs[0][nameCol]||null}catch(e){return null}
}
async function save(){
 if(!process.value.trim())return message.textContent='가공공정(코드)을 입력하세요.';
 if(!vendor.value.trim())return message.textContent='협력업체(코드)를 입력하세요.';
 if(!effective.value)return message.textContent='적용시작일을 입력하세요.';
 if(!online())return message.textContent='DB 미연결 상태에서는 저장할 수 없습니다.';
 const row={process_group:group.value,process_code:process.value.trim(),
  process_name:(await nameOf('processes','process_code','process_name',process.value.trim()))||(selRow&&selRow.process_code===process.value.trim()?selRow.process_name:process.value.trim()),
  vendor_code:vendor.value.trim(),
  vendor_name:(await nameOf('vendors','vendor_code','vendor_name',vendor.value.trim()))||(selRow&&selRow.vendor_code===vendor.value.trim()?selRow.vendor_name:vendor.value.trim()),
  unit_price:Number(price.value)||0,registered_by:registrant.value.trim()||null,
  manager_name:registrant.value.trim()||null,
  registered_date:regDate.value||new Date().toISOString().slice(0,10),
  effective_date:effective.value};
 if(selRow&&selRow.row_no!=null)row.row_no=Number(selRow.row_no);
 try{await MESDB.table('process_price_changes').upsert(row,'row_no');
  await reload();
  message.textContent=(row.row_no!=null?'수정':'등록')+`했습니다. ${row.process_code} / ${row.vendor_code} · ${Number(row.unit_price).toLocaleString()}원`;
 }catch(e){message.textContent='저장 실패: '+String(e.message||e).slice(0,140)}
}
function newRow(){selRow=null;process.value='';vendor.value='';price.value=0;effective.value='';
 document.querySelectorAll('#body tr').forEach(x=>x.classList.remove('sel'));message.textContent='신규 입력 상태입니다.'}
async function remove(){
 if(!selRow)return message.textContent='삭제할 행을 목록에서 선택하세요.';
 if(!online())return message.textContent='DB 미연결 상태에서는 삭제할 수 없습니다.';
 if(!confirm(`${selRow.process_code} / ${selRow.vendor_name||selRow.vendor_code} 단가를 삭제할까요?`))return;
 try{await MESDB.table('process_price_changes').delete({row_no:Number(selRow.row_no)});
  selRow=null;await reload();message.textContent='삭제했습니다.';
 }catch(e){message.textContent='삭제 실패: '+String(e.message||e).slice(0,140)}
}
function exportCsv(){const rows=view.filter(r=>r.registered_date);const h=['등록일','가공공정그룹','가공공정코드','가공공정명','협력업체코드','협력업체명','단가','담당자'];const csv='\ufeff'+[h,...rows.map(r=>[r.registered_date,r.process_group,r.process_code,r.process_name,r.vendor_code,r.vendor_name,r.unit_price,r.registered_by])].map(a=>a.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='process_price_change_registration.csv';a.click()}
window.MES={search,save,newRow,reload,delete:remove,exportCsv,setMessage:t=>message.textContent=t};registrant.value=registrant.value||OWNER;render();reload();

function sampleFill(){
  if(window.MESDEMO)return MESDEMO.run('process_price_change_registration');
  if(!window.MESSAMPLE)return (window.MES&&MES.setMessage?MES.setMessage:console.warn)('예제 모듈을 불러오지 못했습니다.');
  const r=MESSAMPLE.fill('process_price_change_registration'); if(window.MES&&MES.setMessage)MES.setMessage(r.msg);
}
window.sampleFill=sampleFill;
</script><script src="mes_sample.js?v=169"></script><script src="mes_demo.js?v=67"></script>
<script src="mes_db.js?v=171"></script>

<script src="mes_ctx.js?v=169"></script>
</body></html>
