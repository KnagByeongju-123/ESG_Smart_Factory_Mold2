<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>일평기연 현황판</title><style>
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font-family:"Malgun Gothic","맑은 고딕",Arial,sans-serif;background:#e8ecef;color:#20303d}
.wrap{height:100%;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:6px;padding:5px 8px;background:#dfe4e8;border-bottom:1px solid #b6c0c8}
.top button{height:30px;min-width:78px;border:1px solid #8f9ba6;background:linear-gradient(#fff,#dde4ea);cursor:pointer;font:inherit}
.top button.on{background:#1f3fbf;color:#fff;border-color:#12277a}
.tabs{display:flex;gap:2px;padding:0 8px;background:#dfe4e8}
.tabs button{height:26px;padding:0 14px;border:1px solid #b6c0c8;border-bottom:none;background:#eef2f5;cursor:pointer;font:inherit}
.tabs button.on{background:#fff;font-weight:700}
.meta{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px}
.meta input{width:56px;height:26px;border:1px solid #aeb9c3;text-align:center}
.pager{color:#c1440e;font-weight:700}
.pager button{min-width:26px;height:24px}
.stage{flex:1;min-height:0;overflow:auto;background:#fff;border-top:1px solid #b6c0c8}
table{border-collapse:collapse;width:100%;table-layout:fixed}
th,td{border:1px solid #c2ccd4;padding:7px 8px;font-size:17px}
th{background:#dfe6ec;color:#33475a;font-size:15px;position:sticky;top:0}
td.c{text-align:center}
tr.od td{background:#c0392b;color:#fff}
td.late{background:#c0392b;color:#fff;font-weight:700}
.notice{padding:40px;color:#7c8894;font-size:16px}
.clock{font-size:13px;color:#4b5b68}
</style></head><body><div class="wrap">
<div class="top">
 <button id="btnStart" class="on" onclick="start()">시작</button>
 <button onclick="stop()">정지</button>
 <button onclick="window.close()">닫기</button>
 <span style="font-weight:700;margin-left:10px">탭 전환시간(초)</span><input id="interval" value="60">
 <span class="pager"><button onclick="go(-1)">◀</button> <span id="pg">1</span> / <span id="pgs">11</span> <button onclick="go(1)">▶</button></span>
 <span class="meta"><span class="clock" id="clock"></span></span>
</div>
<div class="tabs"><button id="t1" onclick="setTab(0)">공지사항</button><button id="t2" class="on" onclick="setTab(1)">현황판</button><button id="t3" onclick="setTab(2)">품질목표(SQ)</button></div>
<div class="stage" id="stage"></div>
</div><script>
let rows=[];
let NOTICES=[];
let KPI=[];   /* v54: 품질목표 달성현황 (quality_kpi_summary_view) */
let TOTAL_PAGES=11;
let pages=[...new Set(rows.map(r=>r.page))].sort((a,b)=>a-b);
let tab=1,pi=0,timer=null;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function setTab(t){tab=t;t1.classList.toggle('on',t===0);t2.classList.toggle('on',t===1);
 t3.classList.toggle('on',t===2);
 if(t===2&&!KPI.length)loadKpi().then(render);else render()}
function go(d){pi=(pi+d+pages.length)%pages.length;render()}
function render(){
 pg.textContent=pages[pi];pgs.textContent=TOTAL_PAGES;
 if(tab===0){  /* v33: 공지사항 등록(notices)과 연결 */
  stage.innerHTML=NOTICES.length
   ? '<div class="notice">'+NOTICES.map(n=>`<div style="margin-bottom:14px"><b>${String(n.name||'').replace(/[<>]/g,'')}</b>`
     +`<span style="float:right;font-size:13px;color:#7b8794">${n.writer||''} ${n.posted_date||''}</span>`
     +`<div style="margin-top:6px;white-space:pre-wrap">${String(n.body||n.remark||'').replace(/[<>]/g,'')}</div></div>`).join('')+'</div>'
   : '<div class="notice">등록된 공지사항이 없습니다. (기준정보 &gt; 공지사항 등록)</div>';
  return}
 if(tab===2){  /* v54: 품질목표(SQ) 달성현황 */
  const C={'달성':'#1f7a3d','근접':'#8a6100','미달':'#b3261e','실적없음':'#8a97a2'};
  const BG={'달성':'#e8f6ec','근접':'#fff4d6','미달':'#fde7e7','실적없음':'#f2f5f7'};
  const y=new Date().getFullYear();
  stage.innerHTML=KPI.length
   ? `<table><thead><tr><th style="width:110px">KPI</th><th>지표명</th>`
     +`<th style="width:120px">목표</th><th style="width:120px">당월</th>`
     +`<th style="width:140px">연간누계</th><th style="width:130px">목표대비</th>`
     +`<th style="width:130px">달성</th><th style="width:130px">주관</th></tr></thead><tbody>`
     +KPI.map(k=>{const a=k.alert||'실적없음';const u=k.unit||'';
       const f=v=>(v===null||v===undefined||v==='')?'-':`${v}${u}`;
       return `<tr><td class="c">${esc(k.kpi_code)}</td><td>${esc(k.kpi_name)}</td>`
        +`<td class="c">${f(k.target_value)}${k.direction==='down'?' ↓':' ↑'}</td>`
        +`<td class="c">${f(k.this_month)}</td>`
        +`<td class="c" style="font-weight:700">${f(k.ytd)}</td>`
        +`<td class="c" style="color:${(Number(k.gap)>=0?'#1f7a3d':'#b3261e')}">`
        +`${k.gap===null||k.gap===undefined?'-':(Number(k.gap)>=0?'+':'')+k.gap}</td>`
        +`<td class="c" style="background:${BG[a]};color:${C[a]};font-weight:700">${esc(a)}</td>`
        +`<td class="c">${esc(k.owner||'')}</td></tr>`}).join('')
     +`</tbody></table>`
   : `<div class="notice">${y}년 품질목표가 없습니다. (SQ &gt; 품질목표 &gt; 품질목표 등록)</div>`;
  return}
 const rs=rows.filter(r=>r.page===pages[pi]);
 stage.innerHTML='<table><thead><tr><th style="width:60px">NO</th><th style="width:150px">제번</th><th>품명</th><th style="width:130px">수주일</th><th style="width:130px">T/O 납기</th><th style="width:130px">완료납기</th><th style="width:110px">영업담당</th><th style="width:110px">조립담당</th></tr></thead><tbody>'
 +rs.map(r=>`<tr><td class="c">${r.row_no}</td><td class="c">${esc(r.job_no)}</td><td>${esc(r.item_name||'')}</td><td class="c">${esc(r.order_date||'')}</td><td class="c${r.s1_overdue?' late':''}">${esc(r.s1_due_date||'')}</td><td class="c${r.completion_overdue?' late':''}">${esc(r.completion_due_date||'')}</td><td class="c">${esc(r.sales_manager||'')}</td><td class="c">${esc(r.assembly_manager||'')}</td></tr>`).join('')
 +'</tbody></table>';
}
function start(){stop();const s=Math.max(3,Number(interval.value)||60);timer=setInterval(()=>go(1),s*1000);btnStart.classList.add('on')}
function stop(){if(timer)clearInterval(timer);timer=null;btnStart.classList.remove('on')}
setInterval(()=>{const d=new Date();clock.textContent=d.toLocaleString('ko-KR')},1000);
/* v28: 수주 데이터(status_board_pool 뷰)에서 실시간 생성. DB 미연결 시 사진 판독본 유지 */
const online=()=>!!(window.MESDB&&MESDB.online);
/* v44: 공지사항 조회를 현황판 조회와 분리. 수주 데이터가 0건이어도 공지사항은 표시 */
async function loadNotices(){
 if(!online())return;
 try{
  const ns=await MESDB.table('notices').select('select=*&order=posted_date.desc&limit=20');
  NOTICES=(ns||[]).filter(n=>n.is_active!==false);
 }catch(e){NOTICES=[]}
}
async function loadRows(){
 if(!online())return;
 try{
  const rs=await MESDB.table('status_board_pool').select('select=*&order=row_no');
  if(rs&&rs.length){
   rows=rs;pages=[...new Set(rows.map(r=>r.page))].sort((a,b)=>a-b);
   TOTAL_PAGES=pages.length;if(pi>=pages.length)pi=0;
  }
 }catch(e){}
}
async function loadKpi(){
 if(!online())return;
 try{KPI=await MESDB.table('quality_kpi_summary_view').select('select=*&order=sort_order')||[]}
 catch(e){KPI=[]}
}
async function loadBoard(){
 if(!online()&&window.MESDB&&MESDB.ready){try{await MESDB.ready}catch(e){}}
 await loadNotices();
 await loadRows();
 await loadKpi();
 render();
}
window.MES={reload:loadBoard,setMessage:()=>{}};
render();start();setTimeout(loadBoard,300);
setInterval(loadBoard,300000);
</script><script src="mes_db.js?v=171"></script>

<script src="mes_ctx.js?v=169"></script>
</body></html>
