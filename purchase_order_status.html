<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>구매품 발주/입고현황</title>
<style>
:root{--line:#9daab6;--line2:#c5ced6;--ink:#344758}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:"Malgun Gothic","맑은 고딕",Arial,sans-serif;font-size:12px;color:var(--ink);background:#fff;overflow:hidden}button,input,select{font:inherit;color:inherit}
.screen{height:100%;display:flex;flex-direction:column}.title{height:46px;padding:9px 14px 4px;border-bottom:2px solid #3977ad;display:flex;align-items:center;gap:14px}.title h1{margin:0;font-size:21px;font-weight:500;color:#4b5b69}.title h1:before{content:'◯';margin-right:6px;color:#8795a1}.title .plant{margin-left:auto;display:flex;align-items:center;gap:6px;color:#6b7885}
.filters{padding:7px 14px;border-bottom:1px solid var(--line2);background:#fafbfc}.frow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.frow+.frow{margin-top:5px}.label{font-weight:700}.field{height:26px;border:1px solid #b7c2cb;background:#fff;padding:0 6px;outline:none}.field:focus{border-color:#4e88bb}.radios{display:flex;gap:9px;color:#5f6d79}
.gridbox{flex:1;min-height:0;margin:7px 14px;border:1px solid var(--line);display:flex;flex-direction:column;background:#fff}
.tablewrap{flex:1;min-height:0;overflow:auto}table{border-collapse:collapse;min-width:1890px;width:100%;table-layout:fixed}th,td{height:25px;padding:0 5px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}th{position:sticky;top:0;z-index:2;text-align:center;background:linear-gradient(#dbe9f4,#c7d9e8);color:#405266;font-weight:700}tbody tr:nth-child(even) td{background:#fafcfd}tbody tr:hover td{background:#edf6fd}tbody tr.sel td{background:#2e78bd;color:#fff}.c{text-align:center}.r{text-align:right}
tfoot th{position:sticky;bottom:0;background:linear-gradient(#e6eef5,#d3e0ea)}
.tag{display:inline-block;min-width:60px;text-align:center;border-radius:2px;padding:0 4px;color:#fff}.t-발주{background:#8e9aa6}.t-입고{background:#3d84c6}.t-입고확정{background:#3f9a6d}
.btn{height:28px;min-width:70px;border:1px solid #9ca9b5;background:linear-gradient(#fff,#dfe6eb)}.btn:hover{background:#fff}.btn.primary{background:linear-gradient(#f9ffff,#d2e7f6);color:#1e5e91}.btn.danger{background:linear-gradient(#fff,#f7e2e2);border-color:#c08a8a;color:#a13a3a}
.foot{height:42px;display:flex;align-items:center;padding:5px 14px;border-top:1px solid var(--line);background:#eef2f5;gap:5px}.msg{margin-left:10px;color:#687784}.foot .right{margin-left:auto;color:#7c8993}
@media(max-width:900px){.title h1{font-size:18px}}
</style>
</head>
<body>
<div class="screen">
  <div class="title"><h1>구매품 발주/입고현황</h1></div>
  <section class="filters">
    <div class="frow">
      <span class="label">구분</span>
      <div class="radios">
        <label><input type="radio" name="st" value="전체" checked onchange="search()"> 전체</label>
        <label><input type="radio" name="st" value="발주" onchange="search()"> 발주</label>
        <label><input type="radio" name="st" value="입고" onchange="search()"> 입고</label>
        <label><input type="radio" name="st" value="입고확정" onchange="search()"> 입고확정</label>
      </div>
      <span class="label">입고예정일</span><input id="rd1" class="field" type="date"><span>~</span><input id="rd2" class="field" type="date">
      <span class="label">입고일</span><input id="id1" class="field" type="date"><span>~</span><input id="id2" class="field" type="date">
      <span class="label">입고확정일</span><input id="cd1" class="field" type="date"><span>~</span><input id="cd2" class="field" type="date">
    </div>
    <div class="frow">
      <span class="label">제번</span><input id="jobQ" class="field" style="width:180px" placeholder="제번 입력/선택" autocomplete="off">
      <span class="label">품명</span><input id="itemQ" class="field" style="width:180px" placeholder="품명 입력/선택" list="itemDL" autocomplete="off"><datalist id="itemDL"></datalist>
      <span class="label">협력업체</span><select id="vendorQ" class="field" data-combo style="width:180px"><option value="">전체</option></select>
      <button class="btn" onclick="search()">⌕ 조회</button>
    </div>
  </section>
  <div class="gridbox"><div class="tablewrap"><table>
    <colgroup><col style="width:44px"><col style="width:76px"><col style="width:104px"><col style="width:104px"><col style="width:96px"><col style="width:46px"><col style="width:58px"><col style="width:66px"><col style="width:140px"><col style="width:56px"><col style="width:140px"><col style="width:56px"><col style="width:62px"><col style="width:92px"><col style="width:96px"><col style="width:92px"><col style="width:96px"><col style="width:100px"><col style="width:70px"><col style="width:100px"></colgroup>
    <thead><tr><th style="width:34px" title="전체 선택 / 해제"><input type="checkbox" id="chkAll" onclick="checkAll(this.checked)"></th><th>No</th><th>구분</th><th>업체명</th><th>제번</th><th>품명</th><th>공정</th><th>공정명</th><th>품번</th><th>부품명</th><th>재질</th><th>스펙</th><th>수량</th><th>단가</th><th>발주월</th><th>입고요구일</th><th>입고월</th><th>입고확정일</th><th title="매입가 = 수량 × 단가">매입가</th><th title="입고확정 때 적용한 네고율">네고율(%)</th><th title="입고확정 금액">확정가</th></tr></thead>
    <tbody id="body"></tbody>
    <tfoot><tr><th colspan="12" class="r">합계</th><th class="r" id="sumQty">0</th><th colspan="5"></th><th class="r" id="sumQuote">0</th><th></th><th class="r" id="sumFix">0</th></tr></tfoot>
  </table></div></div>
  <footer class="foot"><button class="btn" onclick="search()">⌕ 검색</button><button class="btn primary" onclick="exportCsv()">▤ EXCEL</button><button class="btn" onclick="cancelConfirm()" title="체크한 입고확정 건을 「입고」 상태로 되돌립니다">✖ 입고확정취소</button><button class="btn danger" onclick="cancelOrder()" title="선택한 발주 행을 취소합니다 (입고 전만 가능)">✕ 발주취소</button><button class="btn" onclick="window.parent?.closeActive?.()">⊠ 닫 기</button><span class="msg" id="message">구매품 발주현황을 조회했습니다.</span><span class="right" id="countText"></span></footer>
</div>
<script>
const rows=[];
let view=[...rows];
const money=v=>Number(v||0).toLocaleString('ko-KR');
let selIdx=-1;
/* order_lines 의 상태(발주/입고/입고확정)가 화면에는 대기/입고/확정 으로 들어온다. 표시·필터용으로 되돌린다 */
const ST=v=>v==='대기'?'발주':v==='확정'?'입고확정':(v||'');
const online=()=>!!(window.MESDB&&MESDB.online);
function within(v,a,b){if(!a&&!b)return true;if(!v)return false;return (!a||v>=a)&&(!b||v<=b)}
/* v258: 매입가 = 수량 × 단가 (단가가 없으면 발주 때 저장된 매입가) */
const buyOf=r=>{const q=Number(r.qty)||0,u=Number(r.price)||0;return u>0&&q>0?Math.round(q*u):(Number(r.quote)||0)};
function render(){selIdx=-1;body.innerHTML=view.length?view.map((r,i)=>`<tr onclick="sel(this,${i})"><td class="c"><input type="checkbox" data-no="${r.no}" ${CHK.has(Number(r.no))?'checked':''} onclick="event.stopPropagation();toggleChk(${Number(r.no)},this.checked)"></td><td class="c">${i+1}</td><td class="c"><span class="tag t-${ST(r.st)}">${ST(r.st)}</span></td><td>${r.vendor}</td><td>${r.job}</td><td>${r.item}</td><td class="c">${r.proc}</td><td class="c">${r.procName}</td><td>${r.part}${window.MESCYCLE?MESCYCLE.badge(r.cyc,null,r.cycWhy):''}</td><td>${r.partName}</td><td class="c">${r.mat}</td><td>${r.spec}</td><td class="r">${r.qty}</td><td class="r">${money(r.price)}</td><td class="c">${r.odate}</td><td class="c">${r.rdate}</td><td class="c">${r.idate}</td><td class="c">${r.cdate}</td><td class="r">${money(buyOf(r))}</td><td class="r">${r.rate!=null&&r.rate!==''&&(Number(r.rate)||r.st==='확정')?Number(r.rate).toFixed(2):''}</td><td class="r">${r.fix!=null&&r.fix!==''?money(r.fix):''}</td></tr>`).join(''):`<tr><td colspan="20" class="c" style="height:90px;color:#8a97a2">조회된 발주가 없습니다. 제번·기간 조건을 지우고 [⌕ 조회]를 다시 눌러보세요.</td></tr>`;
sumQty.textContent=money(view.reduce((a,r)=>a+(r.qty||0),0));sumQuote.textContent=money(view.reduce((a,r)=>a+buyOf(r),0));sumFix.textContent=money(view.reduce((a,r)=>a+(Number(r.fix)||0),0));updCount()}
function sel(tr,i){document.querySelectorAll('#body tr').forEach(x=>x.classList.remove('sel'));tr.classList.add('sel');selIdx=(i==null?-1:Number(i))}
/* ── v137: 행 선택 + [입고확정취소] — 확정된 발주를 「입고」 상태로 되돌린다 ───── */
const CHK=new Set();
function toggleChk(no,on){on?CHK.add(Number(no)):CHK.delete(Number(no));syncChkAll();updCount()}
function checkAll(on){view.forEach(r=>{on?CHK.add(Number(r.no)):CHK.delete(Number(r.no))});
 document.querySelectorAll('#body input[type=checkbox][data-no]').forEach(cb=>{cb.checked=on});syncChkAll();updCount()}
function syncChkAll(){const el=document.getElementById('chkAll');if(!el)return;
 const on=view.length>0&&view.every(r=>CHK.has(Number(r.no)));
 el.checked=on;el.indeterminate=!on&&view.some(r=>CHK.has(Number(r.no)))}
function updCount(){countText.textContent=`${view.length}건`+(CHK.size?` · 선택 ${CHK.size}`:'')}
/* 확정취소 — 입고확정일·확정가를 지우고 상태를 「입고」로 되돌린다 (DB 즉시 반영) */
async function cancelConfirm(){
 const sel=view.filter(r=>CHK.has(Number(r.no)));
 if(!sel.length)return msg('입고확정취소할 행을 체크하세요.');
 const t=sel.filter(r=>ST(r.st)==='입고확정'||r.cdate);
 if(!t.length)return msg('체크한 행 중 입고확정된 건이 없습니다.');
 if(!online())return msg('DB 미연결 상태에서는 확정취소할 수 없습니다.');
 const list=[...new Set(t.map(r=>`${r.job} ${r.part||''} ${r.partName||''}`))].slice(0,8).join('\n · ');
 if(!confirm(`입고확정 ${t.length}건을 취소합니다.\n\n · ${list}${t.length>8?'\n … 외 '+(t.length-8)+'건':''}\n\n`
   +`입고확정일과 확정가가 지워지고 「입고」 상태로 돌아갑니다. 계속할까요?`))return;
 let ok=0,ng=0,last='';
 for(const r of t){
  msg(`확정취소 중… ${ok+ng+1}/${t.length}`);
  try{await MESDB.table('order_lines').upsert({line_id:Number(r.no),status:'입고',confirm_date:null,confirm_price:null},'line_id');ok++;CHK.delete(Number(r.no))}
  catch(e){ng++;last=String(e.message||e)}
 }
 try{MESDB.notify&&MESDB.notify(['order_lines'])}catch(e){}
 try{MESDB.dropCache&&MESDB.dropCache('order_lines')}catch(e){}
 if(MESDB.reloadLines)await MESDB.reloadLines();
 itemLoad();loadVendorSel();_filterNow();
 msg(ng?`확정취소 — 성공 ${ok}건 · 실패 ${ng}건: ${last.slice(0,100)}`:`입고확정 ${ok}건을 취소했습니다. (「입고」 상태로 복귀)`);
}
/* v117: [⌕ 조회] 는 화면에 남아 있는 자료만 거르지 않고 DB 를 다시 읽는다.
   (다른 탭에서 발주한 건이 이 화면에 뜨지 않던 문제 — 외주가공발주현황과 동일한 방식) */
function search(){
 if(window.MESDB&&MESDB.reloadLines){
  msg('DB 에서 다시 읽는 중…');
  MESDB.reloadLines().then(n=>{itemLoad();loadVendorSel();_filterNow();
   if(n===-1)msg('DB 에서 읽지 못했습니다. 연결 상태를 확인하고 [⌕ 조회]를 다시 누르세요. (기준정보 › 에러로그에 사유가 남습니다)')})
   .catch(()=>{_filterNow();msg('DB 조회 실패 — 화면에 남아 있는 자료만 표시했습니다.')});
  return;
 }
 _filterNow();
}
function _filterNow(){const st=document.querySelector('input[name=st]:checked').value;const j=jobQ.value.trim().toLowerCase(),it=itemQ.value.trim().toLowerCase(),v=vendorQ.value.trim().toLowerCase();
view=rows.filter(r=>(st==='전체'||ST(r.st)===st)&&(!j||r.job.toLowerCase().includes(j))&&(!it||(r.item||'').toLowerCase().includes(it))&&(!v||r.vendor.toLowerCase().includes(v))&&within(r.rdate,rd1.value,rd2.value)&&within(r.idate,id1.value,id2.value)&&within(r.cdate,cd1.value,cd2.value));
render();msg(`${st} 기준 ${view.length}건을 조회했습니다.`)}
function exportCsv(){const out=[['구분','업체명','제번','품명','공정','공정명','품번','부품명','재질','스펙','수량','단가','발주월','입고요구일','입고월','입고확정일','매입가','네고율(%)','확정가'],...view.map(r=>[ST(r.st),r.vendor,r.job,r.item,r.proc,r.procName,r.part,r.partName,r.mat,r.spec,r.qty,r.price,r.odate,r.rdate,r.idate,r.cdate,buyOf(r),r.rate,r.fix])];const csv='\ufeff'+out.map(a=>a.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='purchase_order_status.csv';a.click();URL.revokeObjectURL(a.href);msg('EXCEL(CSV) 파일을 생성했습니다.')}
/* 발주취소 — 선택한 행의 order_lines 를 삭제한다. 입고된 건은 입고취소가 먼저다. */
async function cancelOrder(){
 /* v169: 체크한 행 전부 취소. 체크가 없으면 클릭해 선택한 한 행 */
 let sel=view.filter(r=>CHK.has(Number(r.no)));
 if(!sel.length&&view[selIdx])sel=[view[selIdx]];
 if(!sel.length)return msg('취소할 발주 행을 체크하거나 클릭해 선택하세요.');
 if(!online())return msg('DB 미연결 상태에서는 발주취소할 수 없습니다.');
 const t=sel.filter(r=>ST(r.st)==='발주'&&!r.idate&&!r.cdate),skip=sel.length-t.length;
 if(!t.length)return msg(`체크한 행이 모두 입고 처리된 발주입니다. 구매품 입고 화면에서 입고취소를 먼저 하세요.`);
 const list=t.slice(0,8).map(r=>`${r.job} · ${r.vendor||''} · ${r.part||''} ${r.partName||''} ${r.qty||''}개 (${r.odate||''})`).join('\n · ');
 if(!confirm(`구매품 발주 ${t.length}건을 취소합니다.\n\n · ${list}${t.length>8?'\n … 외 '+(t.length-8)+'건':''}${skip?`\n\n(입고 처리된 ${skip}건은 제외)`:''}\n\n취소하시겠습니까? (발주요청이 삭제됩니다)`))return;
 let ok=0,ng=0,last='';
 for(const r of t){
  msg(`발주취소 중… ${ok+ng+1}/${t.length}`);
  try{await MESDB.delLines([r.no]);ok++;CHK.delete(Number(r.no))}
  catch(e){ng++;last=String(e.message||e)}
 }
 try{MESDB.notify&&MESDB.notify(['order_lines'])}catch(e){}
 try{MESDB.dropCache&&MESDB.dropCache('order_lines')}catch(e){}
 if(MESDB.reloadLines)await MESDB.reloadLines();
 search();
 if(ng)msg(`발주취소 — 성공 ${ok}건 · 실패 ${ng}건: `+(/foreign key|무결성|23503/i.test(last)?'이 발주를 참조하는 입고 자료가 있습니다.':last.slice(0,100)));
 else msg(`발주 ${ok}건을 취소했습니다. 구매품 발주 화면에서 다시 발주할 수 있습니다.`);
}
function msg(t){message.textContent=t}
/* ── v150: 제번·품명·협력업체 — 목록에서 고르거나 직접 입력 (외주가공 발주현황과 동일) ──
   품명 목록은 조회된 발주자료의 제번↔품명으로 만든다. 제번을 고르면 품명이, 품명을 고르면 제번이 따라온다. */
const ITEMMAP=new Map();
function IT(job){return ITEMMAP.get(job)||''}
function itemLoad(){
 rows.forEach(r=>{if(r.job&&r.item&&!ITEMMAP.has(r.job))ITEMMAP.set(r.job,r.item)});
 const dl=document.getElementById('itemDL');if(!dl)return;
 const seen=new Set(),out=[];
 rows.forEach(r=>{const m=(r.item||'').trim();if(!m||seen.has(m))return;seen.add(m);out.push({m,job:r.job||''})});
 out.sort((a,b)=>a.m.localeCompare(b.m,'ko'));
 dl.innerHTML=out.map(o=>`<option value="${String(o.m).replace(/"/g,'')}">${String(o.job).replace(/</g,'')}</option>`).join('');
}
function jobPick(){const m=IT(String(jobQ.value||'').trim());if(m)itemQ.value=m;_filterNow()}
function itemPick(){
 const v=String(itemQ.value||'').trim();
 if(v){const jobs=[...ITEMMAP.entries()].filter(([,m])=>m.toLowerCase()===v.toLowerCase()).map(([j])=>j);
  if(jobs.length===1)jobQ.value=jobs[0];else if(jobs.length>1)jobQ.value='';}
 _filterNow();
}
/* 협력업체 — 기준정보(업체 관리) 목록, 비어 있으면 조회된 발주자료의 업체로 대체 */
async function loadVendorSel(){
 const sel=document.getElementById('vendorQ');if(!sel||sel.tagName!=='SELECT')return;
 const keep=sel.value;let n=0;
 try{
  for(let i=0;i<40&&!window.MESLOOK;i++)await new Promise(r=>setTimeout(r,50));
  if(window.MESLOOK){
   await MESLOOK.fillSelect(sel,'vendor_purchase',{keep:['전체'],value:r=>r.vendor_name||'',label:r=>r.vendor_name||''});
   n=sel.options.length-1;
  }
 }catch(e){}
 if(n<=0){
  const vs=[...new Set(rows.map(r=>r.vendor).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ko'));
  sel.innerHTML='<option value="">전체</option>'+vs.map(v=>`<option>${String(v).replace(/[<>&"]/g,'')}</option>`).join('');
  n=vs.length;
 }
 if([...sel.options].some(o=>o.value===keep))sel.value=keep;
 if(!sel.__vwire){sel.__vwire=1;sel.addEventListener('change',()=>{try{_filterNow()}catch(e){}})}
}
render();window.MES={search,exportCsv,cancelOrder,setMessage:msg};
</script>
