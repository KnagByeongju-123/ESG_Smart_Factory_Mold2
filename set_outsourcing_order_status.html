<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SET외주발주현황</title>
<!-- v230: 설계외주 3화면을 복제한 SET외주 (order_lines category=외주SET · set_outsourcing_receipts · set_outsourcing_status_view) -->
<style>
:root{--line:#9daab6;--line2:#c5ced6;--ink:#344758}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:"Malgun Gothic","맑은 고딕",Arial,sans-serif;font-size:12px;color:var(--ink);background:#fff;overflow:hidden}button,input,select{font:inherit;color:inherit}
.screen{height:100%;display:flex;flex-direction:column}.title{height:46px;padding:9px 14px 4px;border-bottom:2px solid #3977ad;display:flex;align-items:center;gap:14px}.title h1{margin:0;font-size:21px;font-weight:500;color:#4b5b69}.title h1:before{content:'◯';margin-right:6px;color:#8795a1}.title .plant{margin-left:auto;display:flex;align-items:center;gap:6px;color:#6b7885}
.filters{padding:7px 14px;border-bottom:1px solid var(--line2);background:#fafbfc}.frow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.frow+.frow{margin-top:5px}.label{font-weight:700}.field{height:26px;border:1px solid #b7c2cb;background:#fff;padding:0 6px;outline:none}.field:focus{border-color:#4e88bb}.radios{display:flex;gap:9px;color:#5f6d79}
.gridbox{flex:1;min-height:0;margin:7px 14px;border:1px solid var(--line);display:flex;flex-direction:column;background:#fff}
.tablewrap{flex:1;min-height:0;overflow:auto}table{border-collapse:collapse;min-width:1720px;width:100%;table-layout:fixed}th,td{height:25px;padding:0 5px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}th{position:sticky;top:0;z-index:2;text-align:center;background:linear-gradient(#dbe9f4,#c7d9e8);color:#405266;font-weight:700}tbody tr:nth-child(even) td{background:#fafcfd}tbody tr:hover td{background:#edf6fd}tbody tr.sel td{background:#2e78bd;color:#fff}.c{text-align:center}.r{text-align:right}
tfoot th{position:sticky;bottom:0;background:linear-gradient(#e6eef5,#d3e0ea)}
.bar{position:relative;height:14px;background:#e2e8ed;border:1px solid #c3ccd4}.bar i{position:absolute;left:0;top:0;bottom:0;background:#4a8cc7}.bar b{position:relative;display:block;text-align:center;font-weight:400;font-size:11px;line-height:12px;color:#2b3d4d}
.btn{height:28px;min-width:70px;border:1px solid #9ca9b5;background:linear-gradient(#fff,#dfe6eb)}.btn:hover{background:#fff}.btn.primary{background:linear-gradient(#f9ffff,#d2e7f6);color:#1e5e91}.btn.danger{background:linear-gradient(#fff,#f5dede);color:#9d3a3a;border-color:#c09a9a}.btn.danger:hover{background:#fff}
.foot{height:42px;display:flex;align-items:center;padding:5px 14px;border-top:1px solid var(--line);background:#eef2f5;gap:5px}.msg{margin-left:10px;color:#687784}.foot .right{margin-left:auto;color:#7c8993}
@media(max-width:900px){.title h1{font-size:18px}}
</style>
</head>
<body>
<div class="screen">
  <div class="title"><h1>SET외주현황</h1><small>영업관리 · SET외주</small></div>
  <section class="filters">
    <div class="frow">
      <span class="label">구분</span>
      <div class="radios"><label><input type="radio" name="st" value="전체" checked onchange="search()"> 전체</label><label><input type="radio" name="st" value="발주" onchange="search()"> 발주</label><label><input type="radio" name="st" value="입고" onchange="search()"> 입고</label></div>
      <span class="label" title="관리제번을 고르면 A~F 공정 발주가 모두 나옵니다. 공정 제번(26DSA057B)을 넣으면 그 공정만">관리제번</span><input id="jobQ" class="field" list="dl_base" autocomplete="off" style="width:200px" placeholder="관리제번 입력/선택"><datalist id="dl_base"></datalist>
      <span class="label">품명</span><input id="itemQ" class="field" style="width:170px">
      <span class="label">품번</span><input id="modelQ" class="field" style="width:150px">
    </div>
    <div class="frow">
      <span class="label">발주일</span><input id="od1" class="field" type="date"><span>~</span><input id="od2" class="field" type="date">
      <span class="label">입고예정일</span><input id="ed1" class="field" type="date"><span>~</span><input id="ed2" class="field" type="date">
      <span class="label">입고일</span><input id="rd1" class="field" type="date"><span>~</span><input id="rd2" class="field" type="date">
      <button class="btn" onclick="search()">⌕ 조회</button>
    </div>
  </section>
  <div class="gridbox"><div class="tablewrap"><table>
    <colgroup><col style="width:44px"><col style="width:110px"><col style="width:130px"><col style="width:110px"><col style="width:74px"><col style="width:110px"><col style="width:108px"><col style="width:50px"><col style="width:74px"><col style="width:90px"><col style="width:90px"><col style="width:90px"><col style="width:96px"><col style="width:86px"><col style="width:92px"><col style="width:100px"><col style="width:92px"></colgroup>
    <thead><tr><th>No</th><th title="관리제번 (괄호는 공정)">관리제번</th><th>품명</th><th>품번</th><th>국내/해외</th><th>거래처</th><th>수주가</th><th>공정</th><th>유상사급</th><th>견적가</th><th>네고가</th><th>차액</th><th>협력업체</th><th>진행률</th><th>발주일</th><th>입고예정일</th><th>입고일</th></tr></thead>
    <tbody id="body"></tbody>
    <tfoot><tr><th colspan="9" class="r">합계</th><th class="r" id="sumQuote">0</th><th class="r" id="sumNego">0</th><th class="r" id="sumDiff">0</th><th colspan="5"></th></tr></tfoot>
  </table></div></div>
  <footer class="foot"><button class="btn" onclick="search()">⌕ 검색</button><button class="btn primary" onclick="exportCsv()">▤ EXCEL</button><button class="btn danger" onclick="cancelOrder()" title="오발주 건을 선택하고 누르면 발주요청이 취소됩니다">✕ 발주취소</button><button class="btn" onclick="window.parent?.closeActive?.()">⊠ 닫기</button><span class="msg" id="message">행을 더블클릭하면 입고(진척) 이력을 볼 수 있습니다. · 오발주는 행 선택 후 [✕ 발주취소]</span><span class="right" id="countText"></span></footer>
</div>
<script>
const rows=[];
let view=[...rows];
const money=v=>Number(v||0).toLocaleString('ko-KR');
/* v30: page_state 스냅샷 → set_outsourcing_status_view 실조회 */
const online=()=>!!(window.MESDB&&MESDB.online);

/* v194: 관리제번 드롭다운 — 발주 행의 제번을 관리제번으로 묶어 「26DSA057 (A~F) · 품명」 으로 고른다 */
const JSPL=j=>{const m=/^(.*\d)([A-Z])$/.exec(String(j||'').trim());return m?{base:m[1],seq:m[2]}:{base:String(j||'').trim(),seq:''}};
const seqRange=q=>{q=[...new Set(q.filter(Boolean))].sort();if(!q.length)return '';const c=q.map(x=>x.charCodeAt(0));const run=c.every((v,i)=>!i||v===c[i-1]+1);
 return q.length===1?`(${q[0]})`:run?`(${q[0]}~${q[q.length-1]})`:`(${q.join('·')})`};
/* v199: 설계외주는 관리제번 단위 — 제번 칸에 「26DSA057 (A~C)」 */
const jobLab=(j,proc,name)=>{const s=JSPL(j);if(String(proc||'')==='ALL')return name||`${s.base} (전체)`;return s.seq?`${s.base} (${s.seq})`:String(j||'')};
function fillBaseDL(dlId,list){
 const dl=document.getElementById(dlId);if(!dl)return;const e=v=>String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
 const mp=new Map();list.forEach(({job,item})=>{const s=JSPL(job);let g=mp.get(s.base);if(!g){g={seqs:[],item:''};mp.set(s.base,g)}g.seqs.push(s.seq);if(!g.item&&item)g.item=item});
 dl.innerHTML=[...mp.keys()].sort((a,b)=>b.localeCompare(a)).map(b=>{const g=mp.get(b);return `<option value="${e(b)}">${e([seqRange(g.seqs),g.item].filter(Boolean).join(' · '))}</option>`}).join('');
}
async function loadRows(){
 for(let i=0;i<60&&!window.MESDB;i++)await new Promise(r=>setTimeout(r,50));
 if(window.MESDB&&MESDB.ready){try{await MESDB.ready}catch(e){}}
 if(!online()){msg('DB 미연결 — 목록을 불러올 수 없습니다.');render();return}
 try{
  const rs=await MESDB.table('set_outsourcing_status_view').select('select=*&order=row_no');
  rows.length=0;
  rs.forEach(r=>rows.push({job:r.job_no,item:r.item_name||'',model:r.model||'',area:r.area||'',
   cust:r.customer_name||'',amount:Number(r.order_price||0),proc:r.process_code||'',procName:r.process_name||'',
   line:r.line_id,status:r.status||'',
   paid:r.paid_supply||'',quote:Number(r.quote_price||0)||Number(r.nego_price||0),nego:Number(r.nego_price||0),   /* v200: 견적가가 없으면 네고가로 */
   diff:Number(r.quote_price||0)?Number(r.difference||0):0,partner:r.vendor_name||'',rate:Number(r.progress_rate||0),
   idate:r.receipt_date||'',odate:r.order_date||'',edate:r.required_date||''}));
  fillBaseDL('dl_base',rows.map(r=>({job:r.job,item:r.item})));
  view=[...rows];render();
  msg(`SET외주발주 ${rows.length}건 (입고 ${rs.filter(r=>r.status!=='발주').length} / 미입고 ${rs.filter(r=>r.status==='발주').length})`);
 }catch(e){msg('조회 실패: '+String(e.message||e).slice(0,120));render()}
}
function within(v,a,b){if(!a&&!b)return true;if(!v)return false;return (!a||v>=a)&&(!b||v<=b)}
function render(){selIdx=-1;body.innerHTML=view.map((r,i)=>`<tr onclick="sel(this,${i})" ondblclick="sel(this,${i});detail(${i})" title="더블클릭하면 입고 이력을 봅니다"><td class="c">${i+1}</td><td title="${r.job}">${jobLab(r.job,r.proc,r.procName)}</td><td>${r.item}</td><td>${r.model}</td><td class="c">${r.area}</td><td>${r.cust}</td><td class="r">${money(r.amount)}</td><td class="c">${r.proc==='ALL'?'전체':r.proc}</td><td class="c">${r.paid}</td><td class="r">${money(r.quote)}</td><td class="r">${money(r.nego)}</td><td class="r">${money(r.diff)}</td><td>${r.partner}</td><td><div class="bar"><i style="width:${r.rate}%"></i><b>${r.rate}%</b></div></td><td class="c">${r.odate}</td><td class="c">${r.edate}</td><td class="c">${r.idate}</td></tr>`).join('');
sumQuote.textContent=money(view.reduce((a,r)=>a+(Number(r.quote)||0),0));sumNego.textContent=money(view.reduce((a,r)=>a+(Number(r.nego)||0),0));sumDiff.textContent=money(view.reduce((a,r)=>a+(Number(r.diff)||0),0));countText.textContent=`${view.length}건`}
let selIdx=-1;
function sel(tr,i){selIdx=(i==null?-1:Number(i));document.querySelectorAll('#body tr').forEach(x=>x.classList.remove('sel'));tr.classList.add('sel')}
/* v81: 오발주 취소 — order_lines(외주설계) 발주행을 삭제해 발주요청을 되돌린다 */
async function cancelOrder(){
 const r=view[selIdx];
 if(!r)return msg('취소할 발주 행을 먼저 선택하세요.');
 if(!online())return msg('DB 미연결 상태에서는 발주취소할 수 없습니다.');
 if(r.idate||Number(r.rate)>0||['입고','입고확정'].includes(r.status))
  return msg('이미 입고(진척)가 등록된 발주입니다. SET외주발주입고에서 입고취소 후 다시 시도하세요.');
 try{const rc=await MESDB.table('set_outsourcing_receipts')
   .select(`select=receipt_no&order_seq=eq.${encodeURIComponent(r.line)}&limit=1`);
  if(rc&&rc.length)return msg('입고 이력이 있어 취소할 수 없습니다. SET외주발주입고에서 입고취소를 먼저 하세요.');
 }catch(e){}
 if(!confirm(`아래 SET외주 발주를 취소합니다.\n\n제 번 : ${r.job}\n협력업체 : ${r.partner||''}\n공 정 : ${r.proc||''}\n네고가 : ${money(r.nego)} 원\n발주일 : ${r.odate||''}\n\n취소하시겠습니까? (발주요청이 삭제됩니다)`))return;
 try{
  await MESDB.table('order_lines').delete({line_id:r.line});
  try{await MESDB.syncPlanOut(r.job,'set')}catch(e){}   /* v119 */
  try{MESDB.notify&&MESDB.notify(['order_lines'])}catch(e){}
  await loadRows();search();
  msg(`${r.job} · ${r.partner||''} 발주를 취소했습니다. SET외주발주등록에서 다시 발주할 수 있습니다.`);
 }catch(e){
  const m=String(e.message||e);
  msg(/foreign key|무결성|23503/i.test(m)?'발주취소 실패: 이 발주를 참조하는 입고/실적 자료가 있습니다.':'발주취소 실패: '+m.slice(0,130));
 }
}
function search(){const st=document.querySelector('input[name=st]:checked').value;const j=jobQ.value.trim().toLowerCase(),it=itemQ.value.trim().toLowerCase(),m=modelQ.value.trim().toLowerCase();
view=rows.filter(r=>(st==='전체'||(st==='입고'?!!r.idate:!r.idate))&&(!j||r.job.toLowerCase().includes(j))&&(!it||r.item.toLowerCase().includes(it))&&(!m||r.model.toLowerCase().includes(m))&&within(r.odate,od1.value,od2.value)&&within(r.edate,ed1.value,ed2.value)&&within(r.idate,rd1.value,rd2.value));
render();msg(`${st} 기준 ${view.length}건을 조회했습니다.`)}
function exportCsv(){const out=[['제번','품명','품번','국내/해외','거래처','수주가','공정','견적가','네고가','차액','협력업체','진행률','발주일','입고예정일','입고일'],...view.map(r=>[r.job,r.item,r.model,r.area,r.cust,r.amount,r.proc,r.quote,r.nego,r.diff,r.partner,r.rate,r.odate,r.edate,r.idate])];const csv='\ufeff'+out.map(a=>a.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='set_outsourcing_order_status.csv';a.click();URL.revokeObjectURL(a.href);msg('EXCEL(CSV) 파일을 생성했습니다.')}
function msg(t){message.textContent=t}
/* v73: 외주설계실적조회를 이 화면으로 통합 — 발주 행의 입고(진척) 이력을 팝업으로 본다 */
const esc=v=>String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function detail(i){
 const r=view[i];if(!r)return;
 let rc=[];
 if(online()){try{rc=await MESDB.table('set_outsourcing_receipts')
   .select(`select=*&order_seq=eq.${encodeURIComponent(r.line)}&order=receipt_date`)}catch(e){}}
 const rowsHtml=rc.length?rc.map((x,n)=>`<tr><td class="c">${n+1}</td><td class="c">${esc(x.receipt_date||'')}</td>`
   +`<td class="c">${Number(x.progress_rate||0)}%</td><td class="r">${money(x.amount)}</td>`
   +`<td class="c">${esc(x.inspector||'')}</td><td>${esc(x.remark||'')}</td></tr>`).join('')
  :'<tr><td colspan="6" class="c" style="height:70px;color:#8a97a2">입고 이력이 없습니다. SET외주발주입고에서 진척을 등록하세요.</td></tr>';
 const done=rc.reduce((a,x)=>a+(Number(x.amount)||0),0);
 const d=document.createElement('div');
 d.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:9999;display:flex;align-items:center;justify-content:center';
 d.innerHTML=`<div style="background:#fff;border:1px solid #7f8f9c;min-width:640px;max-width:92vw;max-height:86vh;overflow:auto">
  <div style="padding:6px 10px;font-weight:700;background:linear-gradient(#e8f1f8,#c8dbe9);color:#405266">SET외주 입고 이력</div>
  <div style="padding:8px 10px;font-size:12px;color:#4b5c6a">
   <b>${esc(r.job)}</b> · ${esc(r.partner)} · 공정 ${esc(r.proc)} · 네고가 ${money(r.nego)}원
   · 진척 ${r.rate}% · 상태 ${esc(r.status)}</div>
  <table style="border-collapse:collapse;width:100%;font-size:12px">
   <thead><tr style="background:#eef3f8"><th style="border:1px solid #c5d0d8;width:40px">NO</th>
   <th style="border:1px solid #c5d0d8;width:100px">입고일</th><th style="border:1px solid #c5d0d8;width:70px">진척률</th>
   <th style="border:1px solid #c5d0d8;width:110px">입고금액</th><th style="border:1px solid #c5d0d8;width:90px">검수자</th>
   <th style="border:1px solid #c5d0d8">비고</th></tr></thead>
   <tbody>${rowsHtml}</tbody>
   <tfoot><tr style="background:#f5f8fb"><th colspan="3" style="border:1px solid #c5d0d8;text-align:right">입고금액 누계</th>
   <th style="border:1px solid #c5d0d8;text-align:right">${money(done)}</th><th colspan="2" style="border:1px solid #c5d0d8"></th></tr></tfoot>
  </table>
  <div style="padding:8px 10px;text-align:right"><button class="btn">닫기</button></div></div>`;
 const close=()=>d.remove();
 d.addEventListener('click',e=>{if(e.target===d||e.target.tagName==='BUTTON')close()});
 document.addEventListener('keydown',function k(e){if(e.key==='Escape'){close();document.removeEventListener('keydown',k)}});
 document.body.appendChild(d);
}
/* 입고처리 화면에서 진척을 올리면 즉시 따라온다 */
(function(){const bind=()=>{if(window.MESDB&&MESDB.onChange){MESDB.onChange(['order_lines','set_outsourcing_receipts'],()=>loadRows());return true}return false};
 if(!bind()){let n=0;const iv=setInterval(()=>{if(bind()||++n>40)clearInterval(iv)},100)}})();
render();window.MES={search,exportCsv,cancel:cancelOrder,setMessage:msg};
</script>
<script src="mes_db.js?v=230"></script>
<script>loadRows();</script>
<script src="mes_ctx.js?v=230"></script>
<script src="mes_go.js?v=196"></script>
<script>/* v196: 금형원가내역(금형 공통비 · SET외주)에서 더블클릭으로 들어왔을 때 — 관리제번으로 조회 */
MES.go=async function(p){p=p||{};const base=String(p.base||p.job||'');if(!base)return;
 await MESGO.wait(()=>rows.length,8000);
 const all=document.querySelector('input[name=st][value="전체"]');if(all)all.checked=true;
 jobQ.value=base;try{itemQ.value='';modelQ.value=''}catch(e){}search();
 msg(`${base} SET외주 ${view.length}건 — 금형원가내역에서 이동했습니다.`)};
</script>
</body>
</html>
