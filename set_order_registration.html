<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SET외주제작등록</title><style>
:root{--line:#98a6b2;--line2:#c5d0d8;--blue:#2f75b5;--ink:#344757;--head1:#e8f1f8;--head2:#c8dbe9}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:"Malgun Gothic","맑은 고딕",Arial,sans-serif;font-size:12px;color:var(--ink);background:#fff;overflow:hidden}
button,input,select{font:inherit;color:inherit}.screen{height:100%;display:flex;flex-direction:column;background:#fff}
.title{height:48px;padding:8px 14px 5px;border-bottom:2px solid #3978ae;display:flex;align-items:center}.title h1{margin:0;font-size:22px;font-weight:500;color:#4b5c6a}.title h1:before{content:'◯';margin-right:6px;color:#8796a1}.title small{font-size:11px;color:#9ca7af;margin-left:12px}
.form{padding:7px 14px;background:#fafbfc;border-bottom:1px solid var(--line2)}.formrow{display:grid;grid-template-columns:78px 140px 78px 150px 90px 150px 90px minmax(160px,1fr);gap:5px;align-items:center}.formrow+.formrow{margin-top:5px}.label{font-weight:700}.field{height:27px;border:1px solid #b5c0c9;background:#fff;padding:0 6px;min-width:0}
.entrybox,.gridbox{margin:0 14px;border:1px solid var(--line);overflow:auto;background:#fff}.entrybox{height:190px}.gridbox{flex:1;min-height:0}
.searchline{height:39px;margin:0 14px;display:flex;align-items:center;gap:5px;border-left:1px solid var(--line);border-right:1px solid var(--line);padding:4px 8px;background:#f6f8fa}.searchline input{width:min(430px,48vw);height:27px;border:1px solid #aeb9c3;padding:0 7px}
.btn{height:29px;min-width:62px;border:1px solid #9ba8b4;background:linear-gradient(#fff,#dfe6eb);cursor:pointer}.btn:hover{background:#fff}
table{border-collapse:collapse;min-width:1040px;width:100%;table-layout:fixed}th,td{height:27px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:0 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}th{position:sticky;top:0;z-index:2;text-align:center;background:linear-gradient(var(--head1),var(--head2));color:#405266}tbody tr:nth-child(even) td{background:#fafcfd}tbody tr:hover td{background:#edf6fd}tbody tr.sel td{background:#2d75b7;color:#fff}.c{text-align:center}.num{text-align:right}.toolbar{height:40px;display:flex;align-items:center;gap:5px;padding:4px 14px;background:#f5f7f8;border-bottom:1px solid var(--line2)}
.foot{height:42px;display:flex;align-items:center;padding:5px 14px;border-top:1px solid var(--line);background:#eef2f5;gap:5px}.msg{margin-left:8px;color:#687784}.right{margin-left:auto;color:#7c8993}
.split{flex:1;min-height:0;display:grid;grid-template-rows:1fr 1fr;gap:10px;padding:0 14px 8px}.split .gridbox{margin:0}
@media(max-width:900px){.formrow{grid-template-columns:78px 1fr 78px 1fr}.entrybox,.gridbox,.searchline{margin-left:6px;margin-right:6px}}

.filt{padding:7px 14px;background:#fafbfc;border-bottom:1px solid var(--line2)}
.fr{display:grid;gap:5px;align-items:center}
.lb{font-weight:700;text-align:right;padding-right:3px}
.opts{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.opts label{display:flex;align-items:center;gap:3px;cursor:pointer}
.gtot td{background:#dfe9f2;font-weight:700}
.grp th{background:linear-gradient(#dbe9f5,#b9d2e6)}
.panes{flex:1;min-height:0;display:grid;gap:8px;padding:0 14px 8px}
.pane{border:1px solid var(--line);background:#fff;display:flex;flex-direction:column;min-height:0}
.ph{padding:5px 9px;font-weight:700;background:linear-gradient(var(--head1),var(--head2));color:#405266;border-bottom:1px solid var(--line2)}
.pb{flex:1;min-height:0;overflow:auto}
.f2{display:grid;grid-template-columns:repeat(4,72px minmax(110px,1fr));gap:5px;align-items:center}
.mask{position:fixed;inset:0;background:rgba(40,50,60,.3);display:none;align-items:flex-start;justify-content:center;z-index:50}
.mask.on{display:flex}
.dlg{margin-top:40px;width:min(1000px,96vw);background:#f3f6f8;border:1px solid #7d8d99;box-shadow:0 8px 26px rgba(0,0,0,.25)}
.dh{display:flex;align-items:center;height:30px;padding:0 6px 0 10px;background:linear-gradient(#eef4f9,#dbe6ef);border-bottom:1px solid #b9c6d0;font-weight:700}
.dh button{margin-left:auto;width:26px;height:20px;border:1px solid #b04a4a;background:#c9484a;color:#fff;cursor:pointer}
.db{padding:10px}
.kv{display:grid;grid-template-columns:repeat(4,84px minmax(90px,1fr));gap:4px;align-items:center;margin-bottom:8px}
.kv .lb{text-align:right}
.kv .v{border:1px solid #c3ccd4;background:#fff;height:26px;line-height:24px;padding:0 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:14px;background:#3f7fbf;border-radius:2px}
/* 요청(미저장) 행: 선택돼도 글자가 흰색이 되지 않게 색을 함께 고정한다 */
#dbody tr.req td{background:#fff8ee!important;color:#5a4a35!important}
#dbody tr.req.sel td{background:#fbe6c8!important;color:#7a3f10!important;font-weight:700}
#dbody tr.req:hover td{background:#fdf1dd!important}

/* v21 입력란 배치 보정: 좁은 폭에서 필드를 숨기지 않고 단계적으로 줄바꿈 */
.field,.formrow input,.formrow select,.formgrid input,.formgrid select,.detail-grid input,.detail-grid select{min-width:0;max-width:100%}
.lab,.label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:1400px){.formrow{grid-template-columns:78px minmax(0,1fr) 78px minmax(0,1fr)}}
@media(max-width:880px){.formrow{grid-template-columns:78px minmax(0,1fr)}}
.formrow>*{min-width:0}
#dbody tr/* v80: 입고 완료건을 흐리게 칠하면 '지워지다 만 잔상'처럼 보인다 → 배경만 옅게, 글자는 그대로 */
.done td{color:var(--ink);background:#eef3f7}
.st{display:inline-block;min-width:56px;padding:0 7px;border-radius:9px;font-size:11px;line-height:17px;font-weight:700}
.st.ord{background:#e6f0fa;color:#1e4f86;border:1px solid #a9c6e4}
.st.done{background:#e7f3ea;color:#1f6b37;border:1px solid #a6cdb3}
.st.req{background:#fdeee8;color:#a2481c;border:1px solid #eab49b}
#dbody tr.sel .st{background:transparent;color:#fff;border-color:#cfe2f4}

/* v78: 제번리스트·공정(조)수 매칭 리스트는 행을 촘촘하게 (설계외주발주와 동일한 24px) */
#hbody td,#mbody td,#vbody td{height:24px;padding:0 5px}

/* v193: 선택 행의 (A~F) 표시가 파란 바탕에 묻히지 않게 */
tr.sel td span{color:#fff!important}
</style></head><body><div class="screen"><div class="title"><h1>조립외주발주</h1><small>영업관리 · 조립외주</small></div><section class="filt"><div class="f2"><div class="lb" title="관리제번 또는 공정 제번">관리제번</div><div><input id="q_job" class="field" placeholder="관리제번 입력/선택"></div><div class="lb">품명</div><div><input id="q_item" class="field"></div><div></div><div></div></div></section><div class="panes" style="grid-template-rows:190px 1fr"><div class="panes" style="grid-template-columns:1.9fr .9fr;grid-template-rows:1fr;padding:0;gap:8px"><div class="pane"><div class="ph">제번리스트</div><div class="pb"><table style="min-width:520px"><thead><tr><th style="width:170px">관리제번</th><th style="width:200px">품명</th><th style="width:120px">완료예정일</th><th></th></tr></thead><tbody id="hbody"></tbody></table></div></div><div class="pane"><div class="ph">공정(조)수 매칭 리스트</div><div class="pb"><table style="min-width:0"><thead><tr><th style="width:36px"></th><th style="width:90px">공정(조)</th><th>공정 제번</th></tr></thead><tbody id="mbody"></tbody></table></div></div></div><div class="panes" style="grid-template-columns:.72fr 2.1fr;grid-template-rows:1fr;padding:0;gap:8px"><div class="pane"><div class="ph">협력업체리스트</div><div style="display:flex;gap:4px;padding:5px"><input id="pq" class="field" placeholder="Enter text to search..." oninput="renderP()"><button class="btn" onclick="renderP()">찾기</button><button class="btn" onclick="pq.value='';renderP()">지우기</button></div><div class="pb"><table style="min-width:0"><thead><tr><th style="width:36px"></th><th>협력업체</th></tr></thead><tbody id="vbody"></tbody></table></div></div><div class="pane"><div class="ph">조수공정 리스트</div><div style="display:flex;gap:4px;padding:5px;align-items:center;flex-wrap:wrap"><span class="lb" style="width:40px">조수</span><input id="fSeq" class="field" style="width:70px" value="" readonly title="공정(조)수 매칭 리스트에서 고른 조수"><span class="lb" style="width:52px">공정명</span><input id="fProc" class="field" style="width:110px" value="" readonly title="공정 제번"><span class="lb" style="width:52px">발주일</span><input id="fOdate" class="field" type="date" style="width:140px"><span class="lb" style="width:74px">입고요구일</span><input id="fRdate" class="field" type="date" style="width:140px"><span class="lb" style="width:52px">견적가</span><input id="fQuote" class="field" style="width:110px" placeholder="0"><span class="lb" style="width:52px">네고가</span><input id="fNego" class="field" style="width:110px" placeholder="0"><button class="btn" onclick="pushDown()" title="선택한 조수 × 협력업체를 요청 리스트에 담습니다">⬇ 요청추가</button><button class="btn" onclick="pullUp()" title="아직 저장하지 않은 요청행을 뺍니다">⬆ 요청삭제</button></div><div class="pb"><table style="min-width:900px"><thead><tr><th style="width:36px"></th><th style="width:120px">협력업체</th><th style="width:56px">조수</th><th style="width:80px">공정명</th><th style="width:100px">발주일</th><th style="width:110px">입고요구일</th><th style="width:110px">견적가</th><th style="width:110px">네고가</th><th style="width:90px">작성자</th><th style="width:96px">상태</th></tr></thead><tbody id="dbody"></tbody></table></div></div></div></div><footer class="foot"><button class="btn" onclick="search()">⌕ 검색</button><button class="btn" onclick="loadHeads()">⟳ 새로고침</button><button class="btn" onclick="save()">▤ 저장</button><button class="btn" onclick="cancelOrder()">✕ 발주취소</button><button class="btn" onclick="window.parent?.closeActive?.()">⊠ 닫기</button><span class="msg" id="message">제번·협력업체 선택 후 저장. 취소는 조수공정 리스트에서 체크 후 발주취소.</span><span class="right" id="countText"></span></footer></div><script>const heads=[];const partners=[];  /* v39: 하드코딩 → set_order_partners 마스터 로드 */const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const n=v=>v==null?'':Number(v).toLocaleString();const p=v=>v==null?'':Number(v).toFixed(2)+'%';
const msg=t=>message.textContent=t;
let view=[...heads],sel=null,pv=null;
let dets=[];                 /* set_order_lines (선택 제번의 발주라인) */
const TBL='set_order_lines';
const today=()=>new Date().toISOString().slice(0,10);
/* v77: 작성자 = 로그인한 사용자. 이름이 아직 안 왔으면 로그인 이메일 아이디로 대체한다 */
const me=()=>{try{
  const a=window.MES_AUTH||window.parent.MES_AUTH;
  if(!a)return '';
  const em=a.session&&a.session.user&&a.session.user.email;
  return a.name||a.user_name||(em?String(em).split('@')[0]:'')||'';
 }catch(e){return ''}};
const online=()=>!!(window.MESDB&&MESDB.online);
/* v193: 관리제번 → 공정(조). 제번리스트는 관리제번 1줄(A~F), 매칭 리스트는 공정 제번이 곧 조수 */
const JSPL=j=>{const m=/^(.*\d)([A-Z])$/.exec(String(j||'').trim());return m?{base:m[1],seq:m[2]}:{base:String(j||'').trim(),seq:''}};
const seqRange=q=>{q=q.filter(Boolean);if(!q.length)return '';const c=q.map(x=>x.charCodeAt(0));const run=c.every((v,i)=>!i||v===c[i-1]+1);
 return q.length===1?`(${q[0]})`:run?`(${q[0]}~${q[q.length-1]})`:`(${q.join('·')})`};
function groupHeads(rows){
 const mp=new Map();
 rows.forEach(r=>{const s=JSPL(r.job_no);let g=mp.get(s.base);
  if(!g){g={...r,job_no:s.base,base:s.base,jobs:[]};mp.set(s.base,g)}
  g.jobs.push({job:r.job_no,seq:s.seq,row:r});if(!g.item_name&&r.item_name)g.item_name=r.item_name;
  if(String(r.completion_planned_date||'')>String(g.completion_planned_date||''))g.completion_planned_date=r.completion_planned_date});
 const out=[...mp.values()];out.forEach(g=>g.jobs.sort((a,b)=>a.job.localeCompare(b.job)));return out;
}
const headLabel=g=>g?g.base+(g.jobs.some(x=>x.seq)?' '+seqRange(g.jobs.map(x=>x.seq)):''):'';
const jobsOf=g=>g?g.jobs.map(x=>x.job):[];

function render(){hbody.innerHTML=view.map((r,i)=>`<tr onclick="pick(${i},this)" title="${esc(jobsOf(r).join(', '))}"><td><b>${esc(r.base||r.job_no)}</b>${r.jobs&&r.jobs.some(x=>x.seq)?` <span style="color:#2a6191;font-weight:700">${esc(seqRange(r.jobs.map(x=>x.seq)))}</span>`:''}</td><td>${esc(r.item_name||'')}</td><td class="c">${esc(r.completion_planned_date||'')}</td><td></td></tr>`).join('');countText.textContent=view.length+'건';renderP();}
function renderP(){const q=pq.value.trim().toLowerCase();
 vbody.innerHTML=partners.filter(p=>!q||p.partner_vendor_name.toLowerCase().includes(q))
  .map(p=>`<tr class="${p.partner_vendor_name===pv?'sel':''}" onclick="pickP('${p.partner_vendor_name}')"><td class="c"><input type="checkbox" ${p.partner_vendor_name===pv?'checked':''}></td><td>${esc(p.partner_vendor_name)}</td></tr>`).join('');}
function pickP(v){pv=v;renderP();msg(`협력업체: ${v}`)}

async function pick(i,tr){sel=view[i];document.querySelectorAll('#hbody tr').forEach(x=>x.classList.remove('sel'));tr.classList.add('sel');
 REQ.length=0;
 renderSeq();
 await loadDets();
 msg(`${headLabel(sel)} · 공정(조) ${SEQ.length} · 발주 ${dets.length}건`);}
/* v73: 공정(조)수 매칭 리스트 — 제번의 공정(조)수만큼 A,B,C… 로 전개한다.
   (v72 까지는 'A / 1/1' 한 줄이 하드코딩돼 3조짜리도 1조분만 발주됐다) */
let SEQ=[];
/* v82: 공정(조)는 A,B,C 대신 1,2,3 (저장값 '1','2','3', 표시 1조·2조·3조) */
const seqCode=i=>String(i+1);
function renderSeq(){
 const procs=(sel&&sel.jobs||[]).filter(x=>x.seq);
 if(procs.length)SEQ=procs.map(x=>({code:x.seq,name:x.job,job:x.job}));   /* 공정 제번 = 조 */
 else{const one=(sel&&sel.jobs&&sel.jobs[0]&&sel.jobs[0].job)||(sel&&sel.job_no);
  const q=Math.max(1,Math.trunc(Number(sel&&sel.set_qty)||1));
  SEQ=Array.from({length:q},(_,i)=>({code:seqCode(i),name:`${i+1}조 (${i+1}/${q})`,job:one}))}
 mbody.innerHTML=SEQ.map((x,i)=>`<tr onclick="toggleSeq(${i})" class="${i===0?'sel':''}">`
  +`<td class="c"><input type="checkbox" data-i="${i}" ${i===0?'checked':''} onclick="event.stopPropagation();syncSeq()"></td>`
  +`<td>${x.code}</td><td>${x.name}</td></tr>`).join('');
 syncSeq();
}
/* 여러 조수를 한 번에 요청할 수 있게 다중선택 */
function toggleSeq(i){const tr=document.querySelectorAll('#mbody tr')[i];if(!tr)return;
 const cb=tr.querySelector('input');if(cb)cb.checked=!cb.checked;syncSeq();}
function pickedSeq(){return [...document.querySelectorAll('#mbody input:checked')].map(x=>SEQ[Number(x.dataset.i)]).filter(Boolean)}
function syncSeq(){
 document.querySelectorAll('#mbody tr').forEach(tr=>{const cb=tr.querySelector('input');tr.classList.toggle('sel',!!(cb&&cb.checked))});
 const ps=pickedSeq();
 fSeq.value=ps.map(x=>x.code).join(',');
 fProc.value=ps.length===1?ps[0].name:(ps.length?`${ps.length}조`:'');
}

/* 제번리스트 = 수주에서 직접 (뷰 set_order_job_pool) — 수주등록만 하면 여기 나타남 */
/* v39: SET 협력업체를 마스터에서 로드 (화면 하드코딩과 DB 가 어긋나던 문제) */
async function loadPartners(){
 if(!online())return;
 try{const rs=await MESDB.table('set_order_partners').select('select=*&order=row_no');
  partners.length=0;rs.forEach(r=>partners.push({row_no:r.row_no,partner_vendor_name:r.partner_vendor_name}));
  renderP();}catch(e){}
}
async function loadHeads(){
 if(!online()&&window.MESDB&&MESDB.ready){try{await MESDB.ready}catch(e){}}
 if(!online()){msg('DB 미연결 — 제번리스트를 불러올 수 없습니다.');render();return}
 try{
  await loadPartners();
  const rs=await MESDB.table('set_order_job_pool').select('select=*&order=row_no');
  heads.length=0;heads.push(...groupHeads(rs||[]));
  view=[...heads];sel=null;dets=[];render();renderD();
  msg(heads.length?`관리제번 ${heads.length}건`:'등록된 수주가 없습니다. 영업관리 > 수주등록에서 먼저 수주를 등록하세요.');
 }catch(e){msg('제번리스트 조회 실패: '+String(e.message||e).slice(0,110));render()}
}
/* ── DB 로드 ───────────────────────────────────────── */
async function loadDets(){
 dets=[];
 if(sel&&online()){
  try{dets=await MESDB.table(TBL).select(`select=*&job_no=in.(${jobsOf(sel).map(x=>encodeURIComponent(x)).join(',')})&order=job_no,line_id`)}
  catch(e){msg('조회 실패: '+String(e.message||e).slice(0,110))}
 }
 renderD();markSeq();
}
/* 이미 발주된 조수는 리스트에서 회색 처리 */
function markSeq(){document.querySelectorAll('#mbody tr').forEach((tr,i)=>{const x=SEQ[i];if(!x)return;
 const used=dets.some(d=>d.set_seq===x.code&&(!x.job||d.job_no===x.job));tr.style.color=used?'#8a97a2':'';
 tr.title=used?'이미 발주된 조수입니다':''});}
/* v73: 원재료 발주와 같은 '요청 → 저장' 방식. REQ 는 아직 DB 에 없는 대기 행 */
const REQ=[];
function pushDown(){
 if(!sel)return msg('제번을 선택하세요.');
 if(!pv)return msg('협력업체를 선택하세요.');
 const ps=pickedSeq();
 if(!ps.length)return msg('공정(조)수 매칭 리스트에서 조수를 선택하세요.');
 const numv=v=>{const x=Number(String(v??'').replace(/[^0-9.-]/g,''));return Number.isNaN(x)?0:x};
 const quote=numv(fQuote.value),nego=numv(fNego.value)||quote;
 if(nego>quote&&quote>0)return msg('네고가는 견적가를 넘을 수 없습니다.');
 let add=0,dup=0;
 for(const x of ps){
  const jb=x.job||sel.job_no;
  if(dets.some(d=>d.partner_vendor_name===pv&&d.set_seq===x.code&&d.job_no===jb)||REQ.some(r=>r.partner_vendor_name===pv&&r.set_seq===x.code&&r.job_no===jb)){dup++;continue}
  REQ.push({_no:(REQ.length?Math.max(...REQ.map(r=>r._no))+1:1),
   job_no:jb,partner_vendor_name:pv,set_seq:x.code,process_name:x.name,
   order_date:fOdate.value||today(),receipt_planned_date:fRdate.value||null,
   quote_price:quote,nego_price:nego,writer:me()});
  add++;
 }
 renderD();
 msg(add?`요청 리스트에 ${add}건 담았습니다.${dup?` (중복 ${dup}건 제외)`:''} [▤ 저장]을 눌러야 발주됩니다.`
        :'이미 발주되었거나 요청에 담긴 조수입니다.');
}
function pullUp(){
 const ids=[...dbody.querySelectorAll('input[data-req]:checked')].map(x=>Number(x.dataset.req));
 if(!ids.length)return msg('요청 리스트에서 뺄 행을 선택하세요. (저장 전 요청행만 삭제됩니다)');
 for(let i=REQ.length-1;i>=0;i--)if(ids.includes(REQ[i]._no))REQ.splice(i,1);
 renderD();msg(`${ids.length}건을 요청 리스트에서 뺐습니다.`);
}
function renderD(){
 const reqHtml=REQ.map(r=>`<tr class="req" onclick="pickD(this)">`
  +`<td class="c"><input type="checkbox" data-req="${r._no}"></td>`
  +`<td>${esc(r.partner_vendor_name)}</td><td class="c">${esc(r.set_seq)}</td><td class="c">${esc(r.process_name)}</td>`
  +`<td class="c">${esc(r.order_date||'')}</td><td class="c">${esc(r.receipt_planned_date||'')}</td>`
  +`<td class="num">${n(r.quote_price)}</td><td class="num">${n(r.nego_price)}</td>`
  +`<td class="c">${esc(r.writer||'')}</td>`
  +`<td class="c"><span class="st req">요청 (미저장)</span></td></tr>`).join('');
 dbody.innerHTML=(dets.length||REQ.length)?reqHtml+dets.map(d=>{
  const done=d.status!=='발주';
  return `<tr class="${done?'done':''}" onclick="pickD(this)"><td class="c"><input type="checkbox" data-id="${d.line_id}" ${done?'disabled title="입고건은 취소할 수 없습니다"':''}></td><td>${esc(d.partner_vendor_name)}</td><td class="c">${esc(d.set_seq)}</td><td class="c">${esc(d.process_name)}</td><td class="c">${esc(d.order_date||'')}</td><td class="c">${esc(d.receipt_planned_date||'')}</td><td class="num">${n(d.quote_price)}</td><td class="num">${n(d.nego_price)}</td><td class="c">${esc(d.writer||'')}</td><td class="c"><span class="st ${done?'done':'ord'}">${esc(d.status||'발주')}</span></td></tr>`}).join('')
  :`<tr><td colspan="10" class="c" style="height:80px;color:#8a97a2">${sel?(online()?'조수와 협력업체를 고르고 [⬇ 요청추가] → [▤ 저장] 하세요.':'DB 미연결 — 발주 등록/취소를 사용할 수 없습니다.'):'제번을 선택하세요.'}</td></tr>`;
 markSeq();
}
function pickD(tr){document.querySelectorAll('#dbody tr').forEach(x=>x.classList.remove('sel'));tr.classList.add('sel');
 const cb=tr.querySelector('input[type=checkbox]');if(cb&&!cb.disabled)cb.checked=!cb.checked;}

function search(){const j=q_job.value.trim().toLowerCase(),it=q_item.value.trim().toLowerCase();
 view=heads.filter(r=>(!j||r.base.toLowerCase().includes(JSPL(j.toUpperCase()).base.toLowerCase())||jobsOf(r).some(x=>x.toLowerCase().includes(j)))&&(!it||String(r.item_name??'').toLowerCase().includes(it)));
 sel=null;dets=[];render();renderD();msg(`조회결과 ${view.length}건입니다.`);}

/* ── 발주 등록 ─────────────────────────────────────── */
/* v73: 요청 리스트에 담긴 행을 한 번에 발주 등록한다.
   (v72 까지는 입력칸 한 줄만 저장돼 조수마다 반복 입력해야 했다) */
async function save(){
 if(!sel){msg('제번을 선택하세요.');return}
 if(!online()){msg('DB 미연결 상태에서는 발주를 등록할 수 없습니다.');return}
 if(!REQ.length){msg('요청 리스트가 비어 있습니다. 조수·협력업체를 고르고 [⬇ 요청추가] 하세요.');return}
 const sum=REQ.reduce((a,r)=>a+(Number(r.nego_price)||0),0);
 const lines=REQ.map(r=>`· ${r.partner_vendor_name} ${r.set_seq}(${r.process_name}) ${Number(r.nego_price||0).toLocaleString()}원`).join('\n');
 if(!confirm(`${headLabel(sel)} SET외주 발주 ${REQ.length}건\n${lines}\n\n네고가 합계 ${sum.toLocaleString()}원\n등록하시겠습니까?`))return;
 try{
  await MESDB.table(TBL).upsert(REQ.map(r=>({job_no:r.job_no,partner_vendor_name:r.partner_vendor_name,
   set_seq:r.set_seq,process_name:r.process_name,status:'발주',
   order_date:r.order_date||today(),receipt_planned_date:r.receipt_planned_date||null,
   quote_price:r.quote_price,nego_price:r.nego_price,unit_price:r.nego_price,writer:r.writer||me()})));
  for(const jb of [...new Set(REQ.map(r=>r.job_no))]){try{await MESDB.syncPlanOut(jb,'assembly')}catch(e){}}   /* v119: 제작계획 조립외주 여부 기록 */
  const cnt=REQ.length;REQ.length=0;
  await loadDets();
  msg(`${headLabel(sel)} SET외주 발주 ${cnt}건을 등록했습니다. (네고가 합계 ${sum.toLocaleString()}원)`);
 }catch(e){
  const m=String(e.message||e);
  msg(/duplicate|unique/i.test(m)?'이미 발주된 조수가 포함되어 있습니다. 요청 리스트를 확인하세요.':'등록 실패: '+m.slice(0,110));
 }
}

/* ── 발주 취소 ─────────────────────────────────────── */
async function cancelOrder(){
 if(!sel){msg('제번을 선택하세요.');return}
 if(!online()){msg('DB 미연결 상태에서는 발주취소를 사용할 수 없습니다.');return}
 if(!dets.length){msg('취소할 발주내역이 없습니다.');return}
 let ids=[...dbody.querySelectorAll('input[type=checkbox]:checked:not(:disabled)')].map(c=>Number(c.dataset.id));
 if(!ids.length){msg('취소할 발주내역을 체크하세요. (입고된 건은 입고취소 후 가능)');return}
 const tg=dets.filter(d=>ids.includes(d.line_id));
 const names=tg.map(d=>d.partner_vendor_name).join(', ');
 if(!confirm(`${headLabel(sel)}\n협력업체: ${names}\n발주를 취소하시겠습니까?`))return;
 const fail=[];
 for(const d of tg){
  try{await MESDB.table(TBL).delete({line_id:d.line_id})}
  catch(e){fail.push(d.partner_vendor_name+'('+String(e.message||e).slice(0,60)+')')}
 }
 for(const jb of [...new Set(tg.map(d=>d.job_no))]){try{await MESDB.syncPlanOut(jb,'assembly')}catch(e){}}   /* v119 */
 await loadDets();
 msg(fail.length?`일부 취소 실패: ${fail.join(', ')}`:`${headLabel(sel)} / ${names} 발주를 취소했습니다.`);
}
