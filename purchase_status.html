<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>매입현황</title><style>
:root{--line:#98a6b2;--line2:#c5d0d8;--blue:#2f75b5;--ink:#344757;--head1:#e8f1f8;--head2:#c8dbe9}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:"Malgun Gothic","맑은 고딕",Arial,sans-serif;font-size:12px;color:var(--ink);background:#fff;overflow:hidden}
button,input,select{font:inherit;color:inherit}.screen{height:100%;display:flex;flex-direction:column;background:#fff}
.title{height:48px;padding:8px 14px 5px;border-bottom:2px solid #3978ae;display:flex;align-items:center}.title h1{margin:0;font-size:22px;font-weight:500;color:#4b5c6a}.title h1:before{content:'◯';margin-right:6px;color:#8796a1}.title small{font-size:11px;color:#9ca7af;margin-left:12px}
.form{padding:7px 14px;background:#fafbfc;border-bottom:1px solid var(--line2)}.formrow{display:grid;grid-template-columns:78px 140px 78px 150px 90px 150px 90px minmax(160px,1fr);gap:5px;align-items:center}.formrow+.formrow{margin-top:5px}.label{font-weight:700}.field{height:27px;border:1px solid #b5c0c9;background:#fff;padding:0 6px;min-width:0}
.entrybox,.gridbox{margin:0 14px;border:1px solid var(--line);overflow:auto;background:#fff}.entrybox{height:190px}.gridbox{flex:1;min-height:0}
.searchline{height:39px;margin:0 14px;display:flex;align-items:center;gap:5px;border-left:1px solid var(--line);border-right:1px solid var(--line);padding:4px 8px;background:#f6f8fa}.searchline input{width:min(430px,48vw);height:27px;border:1px solid #aeb9c3;padding:0 7px}
.btn{height:29px;min-width:62px;border:1px solid #9ba8b4;background:linear-gradient(#fff,#dfe6eb);cursor:pointer}.btn:hover{background:#fff}
table{border-collapse:collapse;min-width:1040px;width:100%;table-layout:fixed}th,td{height:27px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:0 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}th{position:sticky;top:0;z-index:2;text-align:center;background:linear-gradient(var(--head1),var(--head2));color:#405266}tbody tr:nth-child(even) td{background:#fafcfd}tbody tr:hover td{background:#edf6fd}tbody tr.sel td{background:#2d75b7;color:#fff}.c{text-align:center}.num{text-align:right}.toolbar{height:40px;display:flex;align-items:center;gap:5px;padding:4px 14px;background:#f5f7f8;border-bottom:1px solid var(--line2)}
.foot{height:42px;display:flex;align-items:center;padding:5px 14px;border-top:1px solid var(--line);background:#eef2f5;gap:5px}.msg{margin-left:8px;color:#687784}.right{margin-left:auto;color:#7c8993}
.split{flex:1;min-height:0;display:grid;grid-template-rows:1fr 1fr;gap:10px;padding:0 14px 8px}.split .gridbox{margin:0}
@media(max-width:900px){.formrow{grid-template-columns:78px 1fr 78px 1fr}.entrybox,.gridbox,.searchline{margin-left:6px;margin-right:6px}}

.filt{padding:7px 14px;background:#fafbfc;border-bottom:1px solid var(--line2)}
.fr{display:grid;gap:5px;align-items:center}
.lb{font-weight:700;text-align:right;padding-right:3px}
.opts{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.opts label{display:flex;align-items:center;gap:3px;cursor:pointer}
.gtot td{background:#dfe9f2;font-weight:700}
.grp th{background:linear-gradient(#dbe9f5,#b9d2e6)}
.panes{flex:1;min-height:0;display:grid;gap:8px;padding:0 14px 8px}
.pane{border:1px solid var(--line);background:#fff;display:flex;flex-direction:column;min-height:0}
.ph{padding:5px 9px;font-weight:700;background:linear-gradient(var(--head1),var(--head2));color:#405266;border-bottom:1px solid var(--line2)}
.pb{flex:1;min-height:0;overflow:auto}
.f2{display:grid;grid-template-columns:repeat(4,72px minmax(110px,1fr));gap:5px;align-items:center}
.mask{position:fixed;inset:0;background:rgba(40,50,60,.3);display:none;align-items:flex-start;justify-content:center;z-index:50}
.mask.on{display:flex}
.dlg{margin-top:40px;width:min(1000px,96vw);background:#f3f6f8;border:1px solid #7d8d99;box-shadow:0 8px 26px rgba(0,0,0,.25)}
.dh{display:flex;align-items:center;height:30px;padding:0 6px 0 10px;background:linear-gradient(#eef4f9,#dbe6ef);border-bottom:1px solid #b9c6d0;font-weight:700}
.dh button{margin-left:auto;width:26px;height:20px;border:1px solid #b04a4a;background:#c9484a;color:#fff;cursor:pointer}
.db{padding:10px}
.kv{display:grid;grid-template-columns:repeat(4,84px minmax(90px,1fr));gap:4px;align-items:center;margin-bottom:8px}
.kv .lb{text-align:right}
.kv .v{border:1px solid #c3ccd4;background:#fff;height:26px;line-height:24px;padding:0 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:14px;background:#3f7fbf;border-radius:2px}

/* v21 입력란 배치 보정: 좁은 폭에서 필드를 숨기지 않고 단계적으로 줄바꿈 */
.field,.formrow input,.formrow select,.formgrid input,.formgrid select,.detail-grid input,.detail-grid select{min-width:0;max-width:100%}
.lab,.label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:1400px){.formrow{grid-template-columns:78px minmax(0,1fr) 78px minmax(0,1fr)}}
@media(max-width:880px){.formrow{grid-template-columns:78px minmax(0,1fr)}}
.formrow>*{min-width:0}
</style></head><body><div class="screen"><div class="title"><h1>매입현황</h1><small>원가관리 · 매입매출현황</small></div><section class="filt"><div class="opts"><span class="lb" style="width:44px">구분</span><label><input type="checkbox" id="k_all" checked>전체</label><label><input type="checkbox" name="k" value="구매품" checked>구매품</label><label><input type="checkbox" name="k" value="원재료" checked>원재료</label><label><input type="checkbox" name="k" value="외주가공" checked>외주가공</label><label><input type="checkbox" name="k" value="외주설계" checked>외주설계</label><label title="영업관리 › SET외주 발주"><input type="checkbox" name="k" value="외주SET" checked>SET외주</label><span class="lb" style="width:60px">관리제번</span><select id="q_base" class="field" style="width:180px"><option value="">전체</option></select><span class="lb" style="width:44px">제번</span><input id="q_job" class="field" style="width:140px" list="jobDL" autocomplete="off" placeholder="제번 선택/입력"><datalist id="jobDL"></datalist><span class="lb" style="width:44px">품번</span><input id="q_item" class="field" style="width:190px" list="modelDL" autocomplete="off" placeholder="품번 선택/입력"><datalist id="modelDL"></datalist><span class="lb" style="width:70px">협력업체</span><input id="q_ven" class="field" style="width:150px" list="venDL" autocomplete="off" placeholder="업체 선택/입력"><datalist id="venDL"></datalist><span style="display:inline-flex;gap:5px;align-items:center;white-space:nowrap"><span class="lb" style="width:44px">기간</span><select id="d_kind" class="field" style="width:96px"><option value="order_date">발주일</option><option value="receipt_date">입고일</option><option value="receipt_confirmed_date">입고확정일</option></select><input id="d1" type="date" class="field" style="width:135px"><span>~</span><input id="d2" type="date" class="field" style="width:135px"><button class="btn" onclick="search()">⌕ 조회</button></span></div></section><div class="gridbox"><table style="min-width:1780px"><thead><tr><th style="width:46px">NO</th><th style="width:76px">항목</th><th style="width:120px">제번</th><th style="width:170px">품번(제품)</th><th style="width:58px">공정/조수</th><th style="width:90px">공정명</th><th style="width:80px">품번</th><th style="width:140px">부품명</th><th style="width:74px">가공공정</th><th style="width:110px">가공공정명</th><th style="width:74px">발주자</th><th style="width:110px">협력업체</th><th style="width:96px">발주일</th><th style="width:100px">입고예정일</th><th style="width:96px">입고일</th><th style="width:100px">입고확정일</th><th style="width:104px">견적가</th><th style="width:104px">확정가</th></tr></thead><tbody id="body"></tbody><tfoot><tr class="gtot"><td colspan="18" class="c" id="totline">조회 0건</td></tr></tfoot></table></div><footer class="foot"><button class="btn" onclick="search()">⌕ 검색</button><button class="btn" onclick="csv()">▤ EXCEL</button><button class="btn" onclick="window.parent?.closeActive?.()">⊠ 닫기</button><span class="msg" id="message">조회 중…</span><span class="right" id="countText"></span></footer></div><script>const data=[];const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const n=v=>v==null?'':Number(v).toLocaleString();const p=v=>v==null?'':Number(v).toFixed(2)+'%';
const msg=t=>message.textContent=t;
let view=[...data];

function renderTotal(){
  const money=v=>Number(v||0).toLocaleString('ko-KR');
  const src=(typeof view!=='undefined'&&view)||[];
  const sum=k=>src.reduce((a,r)=>a+(Number(r[k])||0),0);
  const el=document.getElementById('totline'); if(!el)return;
  el.textContent = src.length ? `조회 ${src.length}건 · ` + ['견적가 '+money(sum('quotation_price')),'확정가 '+money(sum('confirmed_price'))].join(' / ') : '조회된 자료가 없습니다.';
}
function render(){body.innerHTML=view.map(r=>`<tr><td class="c">${r.row_no}</td><td class="c">${esc(CATLAB(r.category))}</td><td>${esc(r.job_no)}</td><td>${esc(modelOf(r.job_no))}</td><td class="c">${esc(r.process_code||'')}</td><td class="c">${esc(r.process_name||'')}</td><td>${esc(r.part_no||'')}</td><td>${esc(r.part_name||'')}</td><td class="c">${esc(r.machining_process_code||'')}</td><td>${esc(r.machining_process_name||'')}</td><td class="c">${esc(r.orderer_name||'')}</td><td>${esc(r.partner_vendor_name||'')}</td><td class="c">${esc(r.order_date||'')}</td><td class="c">${esc(r.receipt_planned_date||'')}</td><td class="c">${esc(r.receipt_date||'')}</td><td class="c">${esc(r.receipt_confirmed_date||'')}</td><td class="num">${n(r.quotation_price)}</td><td class="num">${n(r.confirmed_price)}</td></tr>`).join('');countText.textContent=view.length+'건';}
/* v139: 구분 체크박스(복수 선택) · 제번/품번 콤보(드롭+직접입력, 상호연동) · 조회 버튼 */
const JOBS=[];const MODEL_OF={};
const modelOf=j=>MODEL_OF[j]||'';
const ALL='모두';
function fillDL(){jobDL.innerHTML=`<option value="${ALL}">전체 제번</option>`+JOBS.map(r=>`<option value="${esc(r.job_no)}">${esc(r.model||'')}${r.customer_name?' · '+esc(r.customer_name):''}</option>`).join('');
 const ms=[...new Set(JOBS.map(r=>r.model).filter(Boolean))];
 modelDL.innerHTML=`<option value="${ALL}">전체 품번</option>`+ms.map(m=>`<option value="${esc(m)}">${esc(JOBS.filter(r=>r.model===m).map(r=>r.job_no).join(', '))}</option>`).join('')}
/* v196: 관리제번 드롭 — 수주(job_pool) 제번을 관리제번(A~F 공정 묶음)으로 */
const baseOf=j=>{const m=/^(.*\d)([A-Z])$/.exec(String(j||'').trim());return m?m[1]:String(j||'').trim()};
function fillBase(){const sel=document.getElementById('q_base');if(!sel)return;const cur=sel.value,G=new Map();
 JOBS.forEach(r=>{const j=String(r.job_no||'').trim();if(!j)return;const m=/^(.*\d)([A-Z])$/.exec(j),b=m?m[1]:j;let g=G.get(b);if(!g){g={seq:[],m:''};G.set(b,g)}if(m&&!g.seq.includes(m[2]))g.seq.push(m[2]);if(!g.m&&r.model)g.m=r.model});
 const rng=a=>{a.sort();return !a.length?'':a.length>2?` (${a[0]}~${a[a.length-1]})`:` (${a.join('·')})`};
 sel.innerHTML=`<option value="">전체 (${G.size})</option>`+[...G.keys()].sort((a,b)=>b.localeCompare(a)).map(b=>`<option value="${esc(b)}">${esc(b)}${rng(G.get(b).seq)}${G.get(b).m?' · '+esc(G.get(b).m):''}</option>`).join('');
 sel.value=G.has(cur)?cur:''}
/* v196: 협력업체 드롭 — 매입 자료에 나온 업체 (많이 거래한 순) */
function fillVen(){const dl=document.getElementById('venDL');if(!dl)return;const C=new Map();
 data.forEach(r=>{const v=String(r.partner_vendor_name||'').trim();if(v)C.set(v,(C.get(v)||0)+1)});
 dl.innerHTML=[...C].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'ko')).map(([v,n])=>`<option value="${esc(v)}">${n}건</option>`).join('')}
async function loadJobs(){if(!_online())return;try{const rs=await MESDB.table('job_pool').select('select=job_no,model,customer_name&order=row_no');JOBS.length=0;rs.forEach(r=>{JOBS.push(r);MODEL_OF[r.job_no]=r.model||''});fillDL();fillBase()}catch(e){}}
function onJobPick(){const v=q_job.value.trim();if(v===ALL){q_job.value='';q_item.value='';return}const r=JOBS.find(x=>x.job_no===v);if(r&&r.model!=null)q_item.value=r.model||''}
function onModelPick(){const v=q_item.value.trim();if(v===ALL){q_job.value='';q_item.value='';return}if(!v)return;const cur=q_job.value.trim();if(JOBS.some(x=>x.job_no===cur&&x.model===v))return;const r=JOBS.find(x=>x.model===v);if(r)q_job.value=r.job_no}
q_base.addEventListener('change',()=>{q_job.value='';q_item.value='';search()});q_ven.addEventListener('change',search);
q_job.addEventListener('change',()=>{onJobPick();search()});q_item.addEventListener('change',()=>{onModelPick();search()});
[q_job,q_item,q_ven,d1,d2].forEach(el=>el.addEventListener('keydown',e=>{if(e.key==='Enter')search()}));
[d_kind,d1,d2].forEach(el=>el.addEventListener('change',search));
const within=(v,a,b)=>{if(!a&&!b)return true;if(!v)return false;v=String(v).slice(0,10);return (!a||v>=a)&&(!b||v<=b)};
const kBoxes=()=>[...document.querySelectorAll('input[name="k"]')];
k_all.addEventListener('change',()=>{kBoxes().forEach(b=>b.checked=k_all.checked);search()});
kBoxes().forEach(b=>b.addEventListener('change',()=>{k_all.checked=kBoxes().every(x=>x.checked);search()}));
function search(){const ks=new Set(kBoxes().filter(b=>b.checked).map(b=>b.value));const j=q_job.value.trim().toLowerCase(),it=q_item.value.trim().toLowerCase(),v=q_ven.value.trim().toLowerCase(),bq=q_base.value;
 view=ks.size?data.filter(r=>ks.has(r.category)&&(!bq||baseOf(r.job_no)===bq)&&(!j||String(r.job_no??'').toLowerCase().includes(j))&&(!it||modelOf(r.job_no).toLowerCase().includes(it))&&(!v||String(r.partner_vendor_name??'').toLowerCase().includes(v))&&within(r[d_kind.value],d1.value,d2.value)):[];
 render();renderTotal();msg(ks.size?`조회결과 ${view.length}건입니다.`:'구분을 하나 이상 선택하세요.');}
function csv(){
 const h=['NO','항목','제번','품번(제품)','공정','공정명','품번','부품명','가공공정','가공공정명','발주자','협력업체','발주일','입고예정일','입고일','입고확정일','견적가','확정가'];
 const rows=view.map(r=>[r.row_no,CATLAB(r.category),r.job_no,modelOf(r.job_no),r.process_code,r.process_name,r.part_no,r.part_name,r.machining_process_code,r.machining_process_name,r.orderer_name,r.partner_vendor_name,r.order_date,r.receipt_planned_date,r.receipt_date,r.receipt_confirmed_date,r.quotation_price,r.confirmed_price]);
 const t='\ufeff'+[h,...rows].map(a=>a.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv;charset=utf-8'}));
 a.download='purchase_status.csv';a.click();URL.revokeObjectURL(a.href);msg(`${view.length}건을 엑셀로 내보냈습니다.`)}

/* v233: SET외주 — order_lines category=외주SET. 화면 표시는 「SET외주」 */
const CATLAB=c=>c==='외주SET'?'SET외주':(c||'');
/* purchase_status_view 에 외주SET 이 아직 안 잡히면 order_lines 에서 직접 읽어 같은 칸으로 붙인다 */
async function loadSet(){
 if(data.some(r=>r.category==='외주SET'))return 0;
 try{
  const ls=await MESDB.table('order_lines').select('select=*&category=eq.'+encodeURIComponent('외주SET')+'&order=order_date.desc,line_id.desc');
  const D=v=>v?String(v).slice(0,10):null,N=v=>v==null||v===''?null:Number(v);
  let no=data.reduce((a,r)=>Math.max(a,Number(r.row_no)||0),0);
  (ls||[]).forEach(l=>data.push({row_no:++no,category:'외주SET',job_no:l.job_no,process_code:l.process_code==='ALL'?'ALL':(l.process_code||''),
   process_name:l.process_name||'',part_no:l.part_no||'',part_name:l.part_name||'',machining_process_code:'',machining_process_name:'',
   orderer_name:l.owner_name||'',partner_vendor_name:l.vendor_name||'',order_date:D(l.order_date),receipt_planned_date:D(l.required_date),
   receipt_date:D(l.receipt_date),receipt_confirmed_date:D(l.confirm_date),quotation_price:N(l.quote_price),confirmed_price:N(l.confirm_price)}));
  return (ls||[]).length;
 }catch(e){return 0}
}
/* v32: 스냅샷 테이블 → purchase_status_view 실집계 조회 */
const _online=()=>!!(window.MESDB&&MESDB.online);
async function loadLive(){
 for(let i=0;i<60&&!window.MESDB;i++)await new Promise(r=>setTimeout(r,50));
 if(window.MESDB&&MESDB.ready){try{await MESDB.ready}catch(e){}}
 if(!_online())return;
 await loadJobs();
 try{
  const rs=await MESDB.table('purchase_status_view').select('select=*');
  data.length=0;
  rs.forEach(r=>data.push(r));
  await loadSet();   /* v233 */
  fillVen();
  if(typeof view!=='undefined'&&Array.isArray(view))view=[...data];
  (window.MES&&window.MES.search||window.search||window.render||function(){})();
  const m=document.getElementById('message');
  if(m)m.textContent=`실데이터 ${data.length}건을 조회했습니다.`;
 }catch(e){const m=document.getElementById('message');
  if(m)m.textContent='조회 실패: '+String(e.message||e).slice(0,110)}
}
window.MES={search,setMessage:msg};loadLive();render();renderTotal();</script><script src="mes_db.js?v=230"></script>
