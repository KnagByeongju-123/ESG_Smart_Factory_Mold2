<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>수주진척현황</title><style>
:root{--line:#98a6b2;--line2:#c5d0d8;--blue:#2f75b5;--ink:#344757;--head1:#e8f1f8;--head2:#c8dbe9;
--done:#2f7d4f;--doneb:#e2f1e8;--run:#b26a00;--runb:#fdf0d9;--wait:#93a1ab;--waitb:#f0f3f5;--late:#c0392b;--lateb:#fbeceb}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font-family:"Malgun Gothic","맑은 고딕",Arial,sans-serif;font-size:12px;color:var(--ink);background:#fff;overflow:hidden}
button,input,select{font:inherit;color:inherit}
.screen{height:100%;display:flex;flex-direction:column;background:#fff}
.title{height:48px;padding:8px 14px 5px;border-bottom:2px solid #3978ae;display:flex;align-items:center}
.title h1{margin:0;font-size:22px;font-weight:500;color:#4b5c6a}.title h1:before{content:'◯';margin-right:6px;color:#8796a1}
.title small{font-size:11px;color:#9ca7af;margin-left:12px}
.filt{padding:7px 14px;background:#fafbfc;border-bottom:1px solid var(--line2);display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.filt .lb{font-weight:700;margin-left:6px}
.field{height:27px;border:1px solid #b5c0c9;background:#fff;padding:0 6px;min-width:0}
.btn{height:29px;min-width:62px;border:1px solid #9ba8b4;background:linear-gradient(#fff,#dfe6eb);cursor:pointer}
.btn:hover{background:#fff}
.btn.on{background:#2d75b7;color:#fff;border-color:#1d5a92}

/* 요약 밴드 */
.sum{display:flex;flex-wrap:wrap;gap:5px;padding:7px 14px;background:#f5f7f8;border-bottom:1px solid var(--line2);align-items:center}
.pill{border:1px solid var(--line2);background:#fff;padding:3px 10px;cursor:pointer;display:flex;gap:6px;align-items:center;white-space:nowrap}
.pill:hover{background:#edf6fd}
.pill.on{background:#2d75b7;color:#fff;border-color:#1d5a92}
.pill b{font-size:13px}
.pill.late{border-color:#e2b3ae;background:var(--lateb);color:var(--late)}
.pill.late.on{background:var(--late);color:#fff}

/* 보드 */
.board{flex:1;min-height:0;overflow:auto;padding:8px 14px 10px;background:#f7f9fa}
.card{border:1px solid var(--line2);background:#fff;margin-bottom:7px}
.card.late{border-left:4px solid var(--late)}
.chead{display:flex;align-items:center;gap:11px;padding:9px 12px;border-bottom:1px solid #e6ecef;cursor:pointer}
.chead:hover{background:#f4f9fd}
.jno{font-size:18px;font-weight:700;color:#20456b;min-width:130px}
.item{color:#34434f;font-size:14px;font-weight:600;max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cust{color:#6e7c87;font-size:13px;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:11px;border:1px solid var(--line2);padding:1px 6px;color:#5c6b76;background:#f4f7f9}
.tag.out{border-color:#b9cfe2;background:#eaf3fa;color:#2a6191}
.dday{margin-left:auto;display:flex;align-items:center;gap:8px}
.dday .d{font-weight:700;font-size:14px}
.dday .d.warn{color:var(--run)}.dday .d.bad{color:var(--late)}
.bar{width:130px;height:12px;border:1px solid var(--line2);background:#eef2f4;position:relative}
.bar i{display:block;height:100%;background:linear-gradient(#5aa0d8,#2f75b5)}
.pctxt{width:44px;text-align:right;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;color:#5c6b76}

/* 파이프라인 */
.pipe{display:flex;flex-wrap:nowrap;gap:0;padding:12px 10px 6px;overflow-x:auto}
.stp{position:relative;flex:1 1 0;min-width:96px;padding:11px 6px 10px 18px;text-align:center;background:#e3e8ec;color:#7a8791;
 clip-path:polygon(0 0,calc(100% - 16px) 0,100% 50%,calc(100% - 16px) 100%,0 100%,16px 50%);margin-left:-12px}
.stp:first-child{margin-left:0;clip-path:polygon(0 0,calc(100% - 16px) 0,100% 50%,calc(100% - 16px) 100%,0 100%);padding-left:8px}
.stp b{display:block;font-size:16px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.stp span{display:block;font-size:13px;margin-top:4px;font-weight:600}
.stp.done{background:#3f8f5f;color:#fff}
.stp.done span{color:#dcf3e4}
.stp.run{background:#e3e8ec;color:#7a8791}
.stp.here,.stp.run.here,.stp.wait.here{background:#e08a00;color:#fff;transform:scaleY(1.12);z-index:2;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.stp.here span{color:#fff5dd}
.stp.here b:after{content:' ◀ 진행중';font-size:11px;font-weight:700;color:#fff;background:#b8321f;padding:1px 6px;border-radius:9px;margin-left:5px;vertical-align:2px}

/* 다음 조치 */
.next{display:flex;align-items:center;gap:10px;padding:8px 12px 12px;flex-wrap:wrap;background:#f9fbfc;border-top:1px solid #edf1f4}
.owner{font-weight:700;color:#fff;background:#5b6e7d;padding:4px 12px;font-size:14px;border-radius:3px}
.owner.영업{background:#2f6ea5}.owner.설계{background:#7a4fa3}.owner.구매{background:#1f7a63}
.owner.가공{background:#a8621b}.owner.조립{background:#39627f}.owner.품질{background:#9c3b52}
.ntxt{color:#25333f;font-size:14.5px;font-weight:600}
.go{margin-left:auto;height:32px;font-size:13px;font-weight:700;padding:0 14px}
.del{height:32px;font-size:13px;padding:0 12px;color:#8c2f2f;border-color:#d9aaa5;background:linear-gradient(#fff,#f7e6e4)}
.del:hover{background:#fbeceb}

/* 상세 */
.det{border-top:1px dashed var(--line2);padding:8px 10px 10px;background:#fbfcfd}
.det table{border-collapse:collapse;width:100%}
.det th,.det td{border:1px solid #dde4e9;padding:3px 7px;font-size:11.5px}
.det th{background:#eef3f7;color:#41586b;font-weight:700;white-space:nowrap;text-align:center;width:92px}
.det td{background:#fff}
.det td.c{text-align:center}
.empty{padding:60px;text-align:center;color:#8a97a2}
.foot{height:42px;display:flex;align-items:center;padding:5px 14px;border-top:1px solid var(--line);background:#eef2f5;gap:5px}
.msg{margin-left:8px;color:#687784}.right{margin-left:auto;color:#7c8993}
/* v182: 관리제번 카드 — 대표(가장 늦은) 공정 1줄 + 펼치면 공정별 */
.seqs{font-size:12px;color:#2a6191;border:1px solid #b9cfe2;background:#eaf3fa;padding:1px 7px;border-radius:9px;white-space:nowrap}
.seqs b{color:#1d5a92}
.slow{font-size:11px;color:#fff;background:#e08a00;padding:1px 7px;border-radius:9px;margin-right:4px}
.fold{font-size:12px;color:#7c8993;white-space:nowrap}
.procs{border-top:1px dashed var(--line2);background:#fbfcfd;padding:4px 10px 8px}
.prow{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #edf1f4}
.prow:last-child{border-bottom:0}
.prow .pl{flex:0 0 118px;display:flex;flex-direction:column;gap:2px}
.prow .pl .sq{font-size:16px;font-weight:700;color:#20456b}
.prow .pl .jn{font-size:11px;color:#7c8993}
.prow .pl .pc{font-size:12px;font-weight:700;color:#5c6b76}
.prow .pipe{flex:1 1 auto;padding:4px 0}
.prow .pipe .stp{padding:6px 4px 5px 16px;min-width:70px}
.prow .pipe .stp:first-child{padding-left:6px}
.prow .pipe .stp b{font-size:13px}.prow .pipe .stp span{font-size:11px;margin-top:2px}
.prow .pipe .stp.here{transform:none}
.prow .pipe .stp.here b:after{display:none}
.prow .pn{flex:0 0 280px;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.prow .pn .ntxt{font-size:12.5px}
.prow .pn .btns{display:flex;gap:4px}
.prow .pn .btn{height:26px;min-width:0;font-size:12px;padding:0 8px}
.prow .pn .owner{font-size:12px;padding:2px 8px}
@media(max-width:980px){.prow{flex-wrap:wrap}.prow .pn{flex-basis:100%}}
@media(max-width:980px){.item,.cust{display:none}.stp{min-width:84px}.stp b{font-size:14px}.stp span{font-size:12px}}
</style></head><body>
<div class="screen">
 <div class="title"><h1>수주진척현황</h1><small>영업관리 · 수주</small></div>

 <div class="filt">
  <span class="lb" style="margin-left:0" title="관리제번 또는 공정 제번(A·B·C)">관리제번</span><input id="qJob" class="field" style="width:130px" oninput="apply()">
  <span class="lb">품명</span><input id="qItem" class="field" style="width:150px" oninput="apply()">
  <span class="lb">고객사</span><input id="qCust" class="field" style="width:130px" oninput="apply()">
  <span class="lb">정렬</span>
  <select id="qSort" class="field" style="width:130px" onchange="apply()">
   <option value="due">납기 임박순</option>
   <option value="pct">진척 낮은순</option>
   <option value="pctd">진척 높은순</option>
   <option value="job">관리제번순</option>
  </select>
  <label style="margin-left:8px"><input type="checkbox" id="qOpen" checked onchange="apply()"> 납품미완료</label>
  <button class="btn" onclick="load()">⟳ 새로고침</button>
  <button class="btn" onclick="expandAll(true)">▼ 전체펼침</button>
  <button class="btn" onclick="expandAll(false)">▲ 접기</button>
 </div>

 <div class="sum" id="sum"></div>
 <div class="board" id="board"></div>

 <footer class="foot">
  <button class="btn" onclick="load()">⌕ 조회</button>
  <button class="btn" onclick="exportCsv()">▤ EXCEL</button>
  <button class="btn" onclick="window.parent?.closeActive?.()">⊠ 닫기</button>
  <span class="msg" id="message">관리제번 1장에 가장 늦은 공정을 대표로 보여줍니다. 카드를 클릭하면 공정별(A·B·C) 진행이 펼쳐집니다.</span>
  <span class="right" id="countText"></span>
 </footer>
</div>

<script>
const STAGES=[
 {k:'order',    n:'수주'},
 {k:'plan',     n:'제작계획'},
 {k:'design',   n:'설계'},
 {k:'partlist', n:'PartList'},
 {k:'purchase', n:'구매'},
 {k:'machining',n:'가공'},
 {k:'assembly', n:'조립'},
 {k:'inspect',  n:'검사'},
 {k:'tryout',   n:'T/O'},
 {k:'delivery', n:'납품'}
];
const OWNERS=['영업','설계','구매','가공','조립','품질'];
const SAMPLE=[];

let rows=[...SAMPLE],view=[],fOwner='',fLate=false,open=new Set();
/* v182: 관리제번(제번에서 공정 문자 A~Z 를 뺀 것)으로 묶는다 */
const jsplit=j=>{const m=/^(.*\d)([A-Z])$/.exec(String(j||'').trim());return m?{base:m[1],seq:m[2]}:{base:String(j||'').trim(),seq:''}};
const hereOf=r=>{const i=STAGES.findIndex(s=>(r['st_'+s.k]||'wait')!=='done');return i<0?STAGES.length:i};
const isLate=r=>!!(r.s1_overdue||r.delivery_overdue);
function groupRows(list){
 const mp=new Map();
 list.forEach(r=>{const s=jsplit(r.job_no);let g=mp.get(s.base);if(!g){g={base:s.base,jobs:[]};mp.set(s.base,g)}g.jobs.push(r)});
 const out=[...mp.values()];
 out.forEach(g=>{
  g.jobs.sort((a,b)=>String(a.job_no).localeCompare(String(b.job_no)));
  /* 대표 = 가장 늦은 공정 (진행 단계가 가장 앞 → 진척률 낮은 순) */
  g.rep=g.jobs.slice().sort((a,b)=>hereOf(a)-hereOf(b)||n0(a.progress_pct)-n0(b.progress_pct))[0];
  g.pct=Math.round(g.jobs.reduce((s,r)=>s+n0(r.progress_pct),0)/g.jobs.length);
  const ds=g.jobs.filter(r=>r.st_delivery!=='done'&&r.delivery_days_left!=null).map(r=>Number(r.delivery_days_left));
  g.days=ds.length?Math.min(...ds):null;
  g.late=g.jobs.some(isLate);g.s1late=g.jobs.some(r=>r.s1_overdue);
  g.delivered=g.jobs.every(r=>r.st_delivery==='done');
  g.owners=new Set(g.jobs.map(r=>r.next_owner).filter(Boolean));
  g.item=(g.jobs.map(r=>r.product_name||r.item_name).find(Boolean))||'';
  g.cust=(g.jobs.map(r=>r.customer_name).find(Boolean))||'';
 });
 return out;
}
let groups=[],allGroups=[];
/* v184: 공정 범위 표기 — 연속이면 (A~D), 하나면 (A), 떨어져 있으면 (A·C) */
function seqRange(q){q=q.filter(x=>/^[A-Z]$/.test(x));if(!q.length)return '';const c=q.map(x=>x.charCodeAt(0));
 const run=c.every((v,i)=>!i||v===c[i-1]+1);return q.length===1?`(${q[0]})`:run?`(${q[0]}~${q[q.length-1]})`:`(${q.join('·')})`}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const n0=v=>Number(v||0);
const msg=t=>message.textContent=t;
const online=()=>!!(window.MESDB&&MESDB.online);

/* ── 조회 ────────────────────────────────── */
async function load(){
 if(!online()&&window.MESDB&&MESDB.ready){try{await MESDB.ready}catch(e){}}
 if(!online()){apply();return msg('DB 미연결 - 예시 데이터를 표시합니다.')}
 try{
  const rs=await MESDB.table('job_progress_view').select('select=*&order=job_no');
  rows=rs||[];apply();
  msg(`${rows.length}건을 조회했습니다. (${new Date().toLocaleTimeString('ko-KR')})`);
 }catch(e){msg('조회 실패: '+String(e.message||e).slice(0,120))}
}

/* ── 필터·정렬 ───────────────────────────── */
function apply(){
 const j=qJob.value.trim().toLowerCase(),i=qItem.value.trim().toLowerCase(),c=qCust.value.trim().toLowerCase();
 const onlyOpen=qOpen.checked;
 /* 공정 제번 단위로 걸러 → 관리제번으로 묶는다. 담당·지연 필터는 공정 하나라도 해당하면 관리제번을 보인다 */
 view=rows.filter(r=>{
  if(j&&!String(r.job_no||'').toLowerCase().includes(j))return false;
  if(i&&!((String(r.item_name||'')+' '+String(r.product_name||'')).toLowerCase().includes(i)))return false;
  if(c&&!String(r.customer_name||'').toLowerCase().includes(c))return false;
  if(onlyOpen&&r.st_delivery==='done')return false;
  return true;
 });
 allGroups=groupRows(view);
 groups=allGroups.filter(g=>(!fOwner||g.owners.has(fOwner))&&(!fLate||g.late));
 const s=qSort.value;
 const dd=g=>g.days==null?99999:g.days;
 groups.sort((a,b)=>s==='pct'?a.pct-b.pct
  :s==='pctd'?b.pct-a.pct
  :s==='job'?String(a.base).localeCompare(String(b.base))
  :dd(a)-dd(b));
 render();
}

/* ── 요약 밴드 ───────────────────────────── */
function renderSum(){
 const late=allGroups.filter(g=>g.late).length;
 const cnt=o=>allGroups.filter(g=>g.owners.has(o)).length;
 sum.innerHTML=
  `<span style="font-weight:700" title="관리제번 기준 건수 (공정 하나라도 해당하면 포함)">다음 조치</span>`
  +`<button class="pill${fOwner===''?' on':''}" onclick="setOwner('')">전체 <b>${allGroups.length}</b></button>`
  +OWNERS.map(o=>`<button class="pill${fOwner===o?' on':''}" onclick="setOwner('${o}')">${o} <b>${cnt(o)}</b></button>`).join('')
  +`<button class="pill late${fLate?' on':''}" style="margin-left:10px" onclick="setLate()">⚠ 지연 <b>${late}</b></button>`;
}
function setOwner(o){fOwner=(fOwner===o?'':o);apply()}
function setLate(){fLate=!fLate;apply()}

/* ── 카드 ────────────────────────────────── */
function stageCell(r,st,here){
 const v=r['st_'+st.k]||'wait';
 let sub='';
 if(st.k==='design'&&r.design_outsourced)sub=`외주 ${Math.round(n0(r.od_pct))}%`;
 else if(st.k==='design')sub=n0(r.dsg_steps)?`${n0(r.dsg_done_steps)}/${n0(r.dsg_steps)}`:'';
 else if(st.k==='partlist')sub=(n0(r.pl_mat)+n0(r.pl_pur))?`${n0(r.pl_mat)+n0(r.pl_pur)}건`:'';
 else if(st.k==='purchase')sub=n0(r.buy_ord)?`${n0(r.buy_cfm)}/${n0(r.buy_ord)}`:'';
 else if(st.k==='machining')sub=(n0(r.mac_ord)+n0(r.wo_cnt))?`${n0(r.mac_cfm)+n0(r.wo_done)}/${n0(r.mac_ord)+n0(r.wo_cnt)}`:'';
 else if(st.k==='assembly')sub=n0(r.asm_steps)?`${n0(r.asm_done_steps)}/${n0(r.asm_steps)}`:(n0(r.set_ord)?'SET외주':'');
 else if(st.k==='inspect')sub=n0(r.insp_cnt)?(n0(r.insp_ng)?`부적합 ${n0(r.insp_ng)}`:`${n0(r.insp_cnt)}건`):'';
 else if(st.k==='tryout')sub=(v==='done'&&r.s1_completed_date)?String(r.s1_completed_date).slice(5):'';
 else if(st.k==='delivery')sub=(v==='done'&&r.delivery_completed_date)?String(r.delivery_completed_date).slice(5):'';
 if(!sub)sub=v==='done'?'완료':v==='run'?'진행':'대기';
 return `<div class="stp ${v}${here?' here':''}"><b>${st.n}</b><span>${esc(sub)}</span></div>`;
}
function dueTxt(r,g){
 if(g?g.delivered:r.st_delivery==='done')return '<span class="d" style="color:#2f7d4f">납품완료</span>';
 const d=g?g.days:r.delivery_days_left;
 if(d==null)return '<span class="d" style="color:#93a1ab">납기 미지정</span>';
 const k=Number(d);
 return `<span class="d ${k<0?'bad':k<=7?'warn':''}">납기 ${k<0?'D+'+(-k):'D-'+k}</span>`;
}
function nextHtml(r,small){
 return `${r.next_owner?`<span class="owner ${esc(r.next_owner)}">${esc(r.next_owner)}</span>`:'<span class="owner" style="background:#2f7d4f">완료</span>'}
    <span class="ntxt">${esc(r.next_step||'')}</span>`;
}
function btnHtml(r){
 /* v234: 카드는 관리제번 단위 — 삭제도 관리제번(A~F 공정 전체) 단위로. 종전엔 대표 공정 제번 하나만 지워 나머지 공정이 남았다 */
 const base=jsplit(r.job_no).base;
 return `${r.next_screen?`<button class="btn go" onclick="event.stopPropagation();goScreen('${esc(r.next_screen)}')">↗ ${esc(r.next_screen)}</button>`:''}
    ${canReset()?`<button class="btn del" onclick="event.stopPropagation();resetJob('${esc(base)}')" title="관리제번 ${esc(base)} 의 모든 공정 제번과 이력을 지웁니다">✕ 진행삭제</button>`:''}`;
}
function render(){
 board.innerHTML=groups.length?groups.map(g=>{
  const r=g.rep,p=g.pct,multi=g.jobs.length>1||!!jsplit(r.job_no).seq;
  const hereIdx=STAGES.findIndex(s=>(r['st_'+s.k]||'wait')!=='done');
  const isOpen=open.has(g.base);
  const seqs=g.jobs.map(x=>jsplit(x.job_no).seq||'단일');
  return `<div class="card${g.late?' late':''}">
   <div class="chead" onclick="toggle('${esc(g.base)}')">
    <span class="jno">${esc(g.base)}${multi?` <span style="font-size:15px;color:#2a6191">${esc(seqRange(seqs))}</span>`:''}</span>
    ${multi?`<span class="seqs" title="${esc(g.jobs.map(x=>x.job_no).join(', '))}">공정 <b>${g.jobs.length}</b></span>`:''}
    <span class="item">${esc(g.item)}</span>
    <span class="cust">${esc(g.cust)}</span>
    ${!r.has_plan?'<span class="tag" style="color:#9aa5ad">계획 미등록</span>':r.design_outsourced?'<span class="tag out">설계 외주</span>':'<span class="tag">설계 사내</span>'}
    ${g.s1late?'<span class="tag" style="border-color:#e2b3ae;background:#fbeceb;color:#c0392b">T/O 지연</span>':''}
    <span class="dday">${multi?`<span class="fold">${isOpen?'▲ 접기':'▼ 공정별 보기'}</span>`:''}${dueTxt(r,g)}
     <span class="bar" title="공정 평균 진척률"><i style="width:${p}%"></i></span><span class="pctxt">${p}%</span></span>
   </div>
   <div class="pipe">${STAGES.map((s,i)=>stageCell(r,s,i===hereIdx)).join('')}</div>
   <div class="next">
    ${multi?`<span class="slow" title="A·B·C 중 가장 늦은 공정">${esc(jsplit(r.job_no).seq||'단일')} 공정 기준</span>`:''}
    ${nextHtml(r)}

   </div>
   ${isOpen?(multi?procsHtml(g):detail(r)):''}
  </div>`}).join('')
 :'<div class="empty">조회 결과가 없습니다.</div>';
 countText.textContent=`관리제번 ${groups.length} / ${allGroups.length}건 (공정 제번 ${view.length}건)`;
 renderSum();
}

function toggle(job){open.has(job)?open.delete(job):open.add(job);render()}
function expandAll(on){open=on?new Set(groups.map(g=>g.base)):new Set();render()}
/* 진행삭제: 수주정보(제번)까지 포함해 그 제번의 모든 기록을 지운다 (관리자만) */
function canReset(){try{const a=MESDB.auth&&MESDB.auth();const r=a&&a.role;return r==='master'||r==='admin'}catch(e){return false}}
/* v234: 관리제번 단위 완전 삭제
 *  1) 관리제번에 딸린 공정 제번(A~F) 전부를 화면·DB(jobs·sale_orders·sales_plans·order_lines) 에서 모아
 *  2) 공정 제번마다 기존 RPC mes_reset_job_progress 로 지우고
 *  3) DB 함수 mes_purge_job_base(관리제번) 로 job_no 를 가진 모든 표를 한 번 더 훑어 잔여 행을 지운다 (sql_v234)
 *  4) 그래도 남으면 화면에서 표별로 직접 지우고, 끝까지 남는 표를 알린다 */
const RESET_TABLES=['outsourcing_moves','set_outsourcing_receipts','outsourced_design_receipts','order_lines','set_order_lines','set_order_registrations','set_order_receipts',
 'part_cycles','work_order_details','process_history_cards','machining_plan_parts','machining_plans','design_results','design_plan_steps','design_plans',
 'partlist_materials','partlist_purchases','assembly_steps','assembly_jobs','inspection_results','expenses','nonconformances','corrective_actions',
 'sales_plans','sale_orders','jobs','job_pool'];
async function jobsOfBase(base){
 const set=new Set();
 rows.forEach(r=>{if(jsplit(r.job_no).base===base)set.add(r.job_no)});
 const like=encodeURIComponent(base)+'*';
 for(const t of ['jobs','sale_orders','sales_plans','order_lines','set_order_lines','design_plans','partlist_materials','partlist_purchases']){
  try{const rs=await MESDB.table(t).select(`select=job_no&job_no=like.${like}`,{fresh:true});
   (rs||[]).forEach(x=>{if(x.job_no&&jsplit(x.job_no).base===base)set.add(x.job_no)})}catch(e){}
 }
 if(!set.size)set.add(base);
 return [...set].sort();
}
async function resetJob(base){
 if(!online())return msg('DB 미연결 - 진행삭제를 사용할 수 없습니다.');
 base=jsplit(base).base;
 msg(`${base} 공정 제번 확인 중...`);
 const jobs=await jobsOfBase(base);
 const ok=confirm(`관리제번 [${base}] 을(를) 완전히 삭제합니다.\n\n공정 제번 ${jobs.length}건: ${jobs.join(', ')}\n\n삭제 대상: 수주정보(제번), 제작계획, 외주설계·SET외주·원재료·구매품·외주가공 발주/입고, 설계계획·실적, PartList, 가공계획·작업지시·이력카드, 조립실적, 검사실적, 경비, 부적합\n\n되돌릴 수 없습니다. 계속할까요?`);
 if(!ok)return;
 const typed=prompt(`확인을 위해 관리제번을 그대로 입력하세요:\n${base}`);
 if(typed===null){msg(`${base} 삭제를 취소했습니다. (아무것도 지워지지 않았습니다)`);return}
 if(typed.trim().toUpperCase()!==base.toUpperCase()){
  alert(`입력한 제번이 다릅니다.\n\n입력: ${typed.trim()}\n대상: ${base}\n\n아무것도 삭제하지 않았습니다.`);
  msg(`제번이 일치하지 않아 취소했습니다. (입력: ${typed.trim()} / 대상: ${base}) — 아무것도 지워지지 않았습니다.`);return}
 const errs=[];let n=0,tabs='';
 try{
  /* 1) 공정 제번마다 기존 RPC */
  for(const job of jobs){
   msg(`${job} 진행내용 삭제 중... (${jobs.indexOf(job)+1}/${jobs.length})`);
   try{const r=await MESDB.rpc('mes_reset_job_progress',{p_job:job});if(r&&r.deleted!=null)n+=Number(r.deleted)||0}
   catch(e){errs.push(job+': '+String(e.message||e).slice(0,80))}
  }
  /* 2) 관리제번으로 모든 표 일괄 정리 (sql_v234 — 함수가 없으면 화면에서 직접) */
  let swept=false;
  try{const r=await MESDB.rpc('mes_purge_job_base',{p_base:base});swept=true;
   if(r&&r.deleted!=null)n+=Number(r.deleted)||0;
   tabs=r&&r.tables?Object.entries(r.tables).filter(([,v])=>Number(v)>0).map(([k,v])=>`${k} ${v}`).join(', '):'';
  }catch(e){if(!/PGRST202|404|Could not find the function/i.test(String(e.message||e)))errs.push('일괄정리: '+String(e.message||e).slice(0,80))}
  if(!swept){
   for(const t of RESET_TABLES)for(const job of jobs){try{await MESDB.table(t).delete({job_no:job})}catch(e){}}
  }
  try{MESDB.dropCache&&MESDB.dropCache('rpc');MESDB.notify&&MESDB.notify(['jobs','sale_orders','job_pool','sale_order_status_rows','sales_plans','sales_plan_status_rows','order_lines','design_plans','design_plan_steps','design_results','partlist_materials','partlist_purchases','assembly_jobs','assembly_steps','work_order_details','inspection_results','set_order_lines','set_outsourcing_receipts','outsourced_design_receipts','expenses'])}catch(e){}
  open.delete(base);
  rows=rows.filter(x=>jsplit(x.job_no).base!==base);apply();
  await load();
  setTimeout(load,800);
  /* 3) 정말로 지워졌는지 — 남은 표를 알린다 */
  const leftIn=[];
  for(const t of RESET_TABLES){
   try{const chk=await MESDB.table(t).select(`select=job_no&job_no=like.${encodeURIComponent(base)}*&limit=50`,{fresh:true});
    const hit=(chk||[]).filter(x=>jsplit(x.job_no).base===base);
    if(hit.length){for(const x of new Set(hit.map(h=>h.job_no))){try{await MESDB.table(t).delete({job_no:x})}catch(e){}}
     const re=await MESDB.table(t).select(`select=job_no&job_no=like.${encodeURIComponent(base)}*&limit=5`,{fresh:true});
     if((re||[]).some(x=>jsplit(x.job_no).base===base))leftIn.push(t)}}catch(e){}
  }
  if(leftIn.length||errs.length){
   const why=leftIn.length?`남은 표: ${leftIn.join(', ')}`:'';
   alert(`${base} 삭제가 완전히 되지 않았습니다.\n${why}${errs.length?'\n오류: '+errs.join('\n'):''}\n\n${leftIn.length?'sql_v234_purge_job.sql 을 실행했는지 확인하세요.':''}`);
   msg(`${base} 삭제가 완전히 되지 않았습니다. ${why} ${errs.join(' / ')}`);
  }else{
   msg(`관리제번 ${base} (공정 제번 ${jobs.length}건) 을(를) 삭제했습니다.`+(n?` ${n}건`:'')+(tabs?` (${tabs})`:''));
  }
 }catch(e){msg('진행삭제 실패: '+String(e.message||e).slice(0,140))}
}
function goScreen(name){
 try{if(window.parent&&window.parent.openByName){window.parent.openByName(name);return}}catch(e){}
 msg(`${name} 화면을 좌측 메뉴에서 열어주세요.`);
}
function exportCsv(){
 const head=['관리제번','공정 제번','대표 공정','품명','고객사','설계구분','진척률(평균)','T/O예정','납기예정','다음담당','다음화면','다음할일',
  ...STAGES.map(s=>s.n)];
 const out=[head,...groups.map(g=>{const r=g.rep;return [g.base+(g.jobs.length>1?' '+seqRange(g.jobs.map(x=>jsplit(x.job_no).seq)):''),g.jobs.map(x=>x.job_no).join(' '),r.job_no,g.item,g.cust,
  r.design_outsourced?'외주':'사내',g.pct+'%',r.s1_planned_date||'',r.delivery_planned_date||'',
  r.next_owner||'',r.next_screen||'',r.next_step||'',
  ...STAGES.map(s=>({done:'완료',run:'진행',wait:'대기'}[r['st_'+s.k]||'wait']))]})];
 const csv='\ufeff'+out.map(a=>a.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
 a.download='job_progress_board.csv';a.click();URL.revokeObjectURL(a.href);msg('CSV 파일을 생성했습니다.');
}

apply();
window.MES=Object.assign(window.MES||{},{search:load,reload:load,exportCsv,setMessage:msg});

(function(){let t=null;const go=()=>{clearTimeout(t);t=setTimeout(load,400)};
 const bind=()=>{if(window.MESDB&&MESDB.onChange){MESDB.onChange(
   ['sale_orders','sales_plans','order_lines','design_plans','design_plan_steps','design_results',
    'partlist_materials','partlist_purchases','assembly_jobs','assembly_steps','work_order_details',
    'inspection_results','set_order_lines'],go);return true}return false};
 if(!bind()){let n=0;const iv=setInterval(()=>{if(bind()||++n>40)clearInterval(iv)},100)}})();
setTimeout(load,300);
setInterval(()=>{if(online())load()},300000);
</script>
