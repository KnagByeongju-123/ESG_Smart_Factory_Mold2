<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>설계실적등록</title><style>

:root{--line:#98a6b2;--line2:#c5d0d8;--blue:#2f75b5;--ink:#344757;--head1:#e8f1f8;--head2:#c8dbe9}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:"Malgun Gothic","맑은 고딕",Arial,sans-serif;font-size:12px;color:var(--ink);background:#fff;overflow:hidden}
button,input,select{font:inherit;color:inherit}.screen{height:100%;display:flex;flex-direction:column;background:#fff}
.title{height:48px;padding:8px 14px 5px;border-bottom:2px solid #3978ae;display:flex;align-items:center}.title h1{margin:0;font-size:22px;font-weight:500;color:#4b5c6a}.title h1:before{content:'◯';margin-right:6px;color:#8796a1}.title small{font-size:11px;color:#9ca7af;margin-left:12px}
.form{padding:7px 14px;background:#fafbfc;border-bottom:1px solid var(--line2)}.formrow{display:grid;grid-template-columns:78px 140px 78px 150px 90px 150px 90px minmax(160px,1fr);gap:5px;align-items:center}.formrow+.formrow{margin-top:5px}.label{font-weight:700}.field{height:27px;border:1px solid #b5c0c9;background:#fff;padding:0 6px;min-width:0}
.entrybox,.gridbox{margin:0 14px;border:1px solid var(--line);overflow:auto;background:#fff}.entrybox{height:190px}.gridbox{flex:1;min-height:0}
.searchline{height:39px;margin:0 14px;display:flex;align-items:center;gap:5px;border-left:1px solid var(--line);border-right:1px solid var(--line);padding:4px 8px;background:#f6f8fa}.searchline input{width:min(430px,48vw);height:27px;border:1px solid #aeb9c3;padding:0 7px}
.btn{height:29px;min-width:62px;border:1px solid #9ba8b4;background:linear-gradient(#fff,#dfe6eb);cursor:pointer}.btn:hover{background:#fff}
table{border-collapse:collapse;min-width:1040px;width:100%;table-layout:fixed}th,td{height:27px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:0 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}th{position:sticky;top:0;z-index:2;text-align:center;background:linear-gradient(var(--head1),var(--head2));color:#405266}tbody tr:nth-child(even) td{background:#fafcfd}tbody tr:hover td{background:#edf6fd}tbody tr.sel td{background:#2d75b7;color:#fff}.c{text-align:center}.num{text-align:right}.toolbar{height:40px;display:flex;align-items:center;gap:5px;padding:4px 14px;background:#f5f7f8;border-bottom:1px solid var(--line2)}
.foot{height:42px;display:flex;align-items:center;padding:5px 14px;border-top:1px solid var(--line);background:#eef2f5;gap:5px}.msg{margin-left:8px;color:#687784}.right{margin-left:auto;color:#7c8993}
.split{flex:1;min-height:0;display:grid;grid-template-rows:1fr 1fr;gap:10px;padding:0 14px 8px}.split .gridbox{margin:0}
@media(max-width:900px){.formrow{grid-template-columns:78px 1fr 78px 1fr}.entrybox,.gridbox,.searchline{margin-left:6px;margin-right:6px}}

.filt{padding:7px 14px;background:#fafbfc;border-bottom:1px solid var(--line2)}
/* v78: 이 화면에는 .panes/.pane 스타일이 빠져 있어 그리드가 동작하지 않았다 */
.panes{flex:1;min-height:0;display:grid;gap:8px;padding:0 14px 8px}
.pane{border:1px solid var(--line);background:#fff;display:flex;flex-direction:column;min-height:0}
.ph{padding:5px 9px;font-weight:700;background:linear-gradient(var(--head1),var(--head2));color:#405266;border-bottom:1px solid var(--line2)}
.pb{flex:1;min-height:0;overflow:auto}
/* 실적등록 칸은 입력부·버튼이 항상 보이도록 목록만 줄인다 */
.rform,.rbtns{flex:0 0 auto}
/* 실적등록 입력부 */
.rform{padding:8px 9px;display:grid;grid-template-columns:74px 1fr;gap:5px;align-items:center;border-top:1px solid var(--line2);background:#f7fafc}
.rform .field{width:100%}
.rform .wk{display:grid;grid-template-columns:74px 1fr;gap:4px}
.rbtns{padding:6px 9px 8px;display:grid;grid-template-columns:1fr 1fr;gap:5px;background:#f7fafc}
.rbtns .btn{min-width:0;width:100%}
.rbtns .wide{grid-column:1/3}
.fr{display:grid;gap:5px;align-items:center}
.lb{font-weight:700;text-align:right;padding-right:3px;white-space:nowrap}
.opts{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.opts label{display:flex;align-items:center;gap:3px;cursor:pointer}
.gtot td{background:#dfe9f2;font-weight:700}
.grp th{background:linear-gradient(#dbe9f5,#b9d2e6)}
.tag{display:inline-block;min-width:34px;padding:0 5px;border-radius:3px;font-size:11px;line-height:17px;text-align:center;border:1px solid}
.tag.in{background:#eef3f7;border-color:#b9c8d5;color:#4a5c6b}
.tag.out{background:#fdefe2;border-color:#e0a86a;color:#9a5410;font-weight:700}
tbody tr.sel .tag{background:transparent;border-color:#cfe2f4;color:#fff}
/* v21 입력란 배치 보정: 좁은 폭에서 필드를 숨기지 않고 단계적으로 줄바꿈 */
.field,.formrow input,.formrow select,.formgrid input,.formgrid select,.detail-grid input,.detail-grid select{min-width:0;max-width:100%}
.lab,.label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:1400px){.formrow{grid-template-columns:78px minmax(0,1fr) 78px minmax(0,1fr)}}
@media(max-width:880px){.formrow{grid-template-columns:78px minmax(0,1fr)}}
.formrow>*{min-width:0}
</style></head><body><div class="screen"><div class="title"><h1>설계실적등록</h1><small>설계관리</small></div><section class="filt"><div class="opts"><label><input type="radio" name="k" value="미완료" checked>미완료</label><label><input type="radio" name="k" value="완료">완료</label><span class="lb" style="padding-left:10px;border-left:1px solid #c5d0d8;white-space:nowrap">설계구분</span><label><input type="radio" name="src" value="전체" checked>전체</label><label><input type="radio" name="src" value="사내">사내</label><label><input type="radio" name="src" value="외주">외주</label><span class="lb" style="width:56px">제번</span><input id="qJob" class="field cbo" style="width:190px" list="dl_job" autocomplete="off" placeholder="입력 또는 선택"><span class="lb" style="width:56px">품명</span><input id="qItem" class="field cbo" style="width:210px" list="dl_item" autocomplete="off" placeholder="입력 또는 선택"></div></section><div class="panes" style="grid-template-rows:160px 1fr"><div class="pane"><div class="ph">제번리스트</div><div class="pb"><table style="min-width:1080px"><thead><tr><th style="width:100px">설계완료여부</th><th style="width:80px">사내/외주</th><th style="width:130px">제번</th><th style="width:200px">품명</th><th style="width:90px">공정코드</th><th style="width:90px">공정명</th><th style="width:130px">설계완료예정일</th><th style="width:110px">T/O 예정일</th><th>고객요구일</th></tr></thead><tbody id="hbody"></tbody></table></div></div><div class="panes" style="grid-template-columns:1fr 340px;grid-template-rows:1fr;padding:0;gap:8px"><div class="pane"><div class="ph">세부공정 리스트</div><div class="pb"><table style="min-width:840px"><thead><tr><th style="width:80px">완료여부</th><th style="width:64px">공정</th><th style="width:110px">가공공정코드</th><th style="width:140px">가공공정명</th><th style="width:110px">완료 예정일</th><th style="width:100px">작업시간(분)</th><th>설계진척(%)</th></tr></thead><tbody id="sbody"></tbody></table></div></div><div class="pane"><div class="ph">실적등록 <span id="srcBadge" style="margin-left:8px;font-weight:400"></span></div><div class="pb"><table style="min-width:0"><thead><tr><th>작업자</th><th style="width:100px">작업일자</th><th style="width:90px">작업시간(분)</th></tr></thead><tbody id="rbody"></tbody></table><div class="rform"><div class="lb">작업시간(분)</div><input id="fMin" class="field" placeholder="예: 240" title="투입 시간을 분 단위로 입력합니다. 240분 = 4시간"><div class="lb">작업일</div><input id="fDate" type="date" class="field"><div class="lb">작업자</div><div class="wk"><input id="fWorkerCd" class="field" placeholder="코드" title="사번/코드"><input id="fWorker" class="field cbo" list="dl_emp" autocomplete="off" placeholder="입력 또는 선택"></div></div><div class="rbtns"><button class="btn wide" onclick="addResult()" style="font-weight:700">＋ 실적 등록</button><button class="btn" onclick="delResult()">－ 실적 삭제</button><button class="btn" onclick="doneStep()">✓ 세부공정 완료</button><button class="btn" onclick="doneDesign()">✓ 설계 완료</button></div></div></div></div></div><footer class="foot"><button class="btn" onclick="search()">⌕ 검색</button><button class="btn" onclick="window.parent?.closeActive?.()">⊠ 닫기</button><span class="msg" id="message">제번을 선택하고 세부공정을 고른 뒤 실적을 등록하세요.</span></footer></div>
<datalist id="dl_emp"></datalist>
<datalist id="dl_job"></datalist>
<datalist id="dl_item"></datalist>
<script>const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const n=v=>v==null?'':Number(v).toLocaleString();const p=v=>v==null?'':Number(v).toFixed(2)+'%';
const msg=t=>message.textContent=t;
/* v30: 전면 스텁 → design_plans / design_plan_steps / design_results 실연동
 * v68: 제작계획(sales_plans.design_outsourced)의 사내/외주를 제번리스트에 표시·필터하고
 *      실적 저장 시 design_source 로 함께 기록한다 (설계실적조회에서 사내/외주로 검색). */
const online=()=>!!(window.MESDB&&MESDB.online);
async function waitDB(){for(let i=0;i<60&&!window.MESDB;i++)await new Promise(r=>setTimeout(r,50));
 if(window.MESDB&&MESDB.ready){try{await MESDB.ready}catch(e){}}}
const numv=v=>{const x=Number(String(v??'').replace(/[^0-9.-]/g,''));return Number.isNaN(x)?0:x};
let heads=[],steps=[],results=[],selJob=null,selStep=null;
/* v115: 제번·품명 드롭다운+직접입력 겸용 콤보(datalist) — 글자를 치면 브라우저가 목록을 걸러 준다 */
let JOBMAP=new Map(),ITEMMAP=new Map();
function fillCombo(list){
 JOBMAP=new Map();ITEMMAP=new Map();
 (list||[]).forEach(p=>{const j=String(p.job_no??'').trim(),it=String(p.item_name??'').trim();
  if(j&&!JOBMAP.has(j))JOBMAP.set(j,it);
  if(it&&!ITEMMAP.has(it))ITEMMAP.set(it,j);});
 dl_job.innerHTML=[...JOBMAP].map(([v,l])=>`<option value="${esc(v)}">${esc(l)}</option>`).join('');
 dl_item.innerHTML=[...ITEMMAP].map(([v,l])=>`<option value="${esc(v)}">${esc(l)}</option>`).join('');
}

const tag=v=>`<span class="tag ${v==='외주'?'out':'in'}">${v}</span>`;

function renderHeads(){
 hbody.innerHTML=heads.length?heads.map((r,i)=>`<tr onclick="pickJob(${i},this)">
  <td class="c">${r.done?'완료':'미완료'}</td><td class="c">${tag(r.src)}</td><td class="c">${esc(r.job_no)}</td><td>${esc(r.item_name||'')}</td>
  <td class="c">${esc(r.process_code||'')}</td><td class="c">${esc(r.process_name||'')}</td>
  <td class="c">${esc(r.design_completion_planned_date||'')}</td><td class="c">${esc(r.s1_date||'')}</td>
  <td class="c">${esc(r.customer_request_date||'')}</td></tr>`).join('')
  :'<tr><td colspan="9" class="c" style="height:120px;color:#8a97a2">조회결과가 없습니다.</td></tr>';
}
function renderSteps(){
 sbody.innerHTML=steps.length?steps.map((s,i)=>{
  const mins=results.filter(r=>r.process_code===s.process_code&&r.machining_process_code===s.machining_process_code)
    .reduce((a,r)=>a+numv(r.work_minutes),0);
  const rate=s.plan_minutes?Math.min(100,Math.round(mins/s.plan_minutes*100)):(s.done?100:(mins?50:0));
  return `<tr onclick="pickStep(${i},this)"><td class="c">${s.done?'완료':'미완료'}</td>
   <td class="c">${esc(s.process_code)}</td><td class="c">${esc(s.machining_process_code||'')}</td>
   <td>${esc(s.machining_process_name||'')}</td><td class="c">${esc(s.completion_planned_date||'')}</td>
   <td class="num">${mins}</td><td class="num">${rate}%</td></tr>`}).join('')
  :'<tr><td colspan="7" class="c" style="height:120px;color:#8a97a2">조회결과가 없습니다.</td></tr>';
}
function renderResults(){
 rbody.innerHTML=results.length?results.map(r=>`<tr>
  <td><input type="checkbox" data-row="${r.row_no}"> ${esc(r.worker_name||'')}</td>
  <td class="c">${esc(r.work_date||'')}</td><td class="num">${numv(r.work_minutes)}</td></tr>`).join('')
  :'<tr><td colspan="3" class="c" style="height:80px;color:#8a97a2">등록된 실적이 없습니다.</td></tr>';
}
async function search(){
 await waitDB();
 if(!online()){msg('DB 미연결 — 조회할 수 없습니다.');return}
 try{
  const mode=document.querySelector('input[name=k]:checked').value;
  const sv=(document.querySelector('input[name=src]:checked')||{}).value||'전체';
  const [plans,allSteps,sp]=await Promise.all([
   MESDB.table('design_plans').select('select=*&order=row_no'),
   MESDB.table('design_plan_steps').select('select=*&order=row_no'),
   MESDB.table('sales_plans').select('select=job_no,design_outsourced')]);
  const SRC={};sp.forEach(x=>SRC[x.job_no]=x.design_outsourced===true?'외주':'사내');
 const j=(qJob.value||'').trim().toUpperCase(),it=(qItem.value||'').trim().toUpperCase();
 /* v115: 콤보 후보 = 제번·품명 입력을 뺀 현재 라디오(미완료/완료·사내/외주) 조건의 목록 */
 let pool=plans.map(p=>({...p,done:!!p.design_completed,src:SRC[p.job_no]||'사내'}));
 pool=pool.filter(p=>mode==='완료'?p.done:!p.done);
 if(sv!=='전체')pool=pool.filter(p=>p.src===sv);
 fillCombo(pool);
 heads=pool.filter(p=>(!j||String(p.job_no??'').toUpperCase().includes(j))
   &&(!it||String(p.item_name??'').toUpperCase().includes(it)))
  .map(p=>{const st=allSteps.filter(s=>s.job_no===p.job_no);
   return {...p,process_code:st[0]?.process_code||'',process_name:st[0]?.process_name||'',_steps:st}});
  selJob=null;selStep=null;steps=[];results=[];srcBadge.innerHTML='';
  renderHeads();renderSteps();renderResults();
  msg(`조회결과 ${heads.length}건 (${mode}${sv!=='전체'?' · '+sv:''})`);
 }catch(e){msg('조회 실패: '+String(e.message||e).slice(0,120))}
}
async function pickJob(i,tr){
 selJob=heads[i];selStep=null;
 document.querySelectorAll('#hbody tr').forEach(x=>x.classList.remove('sel'));if(tr)tr.classList.add('sel');
 steps=(selJob._steps||[]).map(s=>({...s,done:!!s.step_completed}));   /* v62: 완료상태 DB 파생 */
 srcBadge.innerHTML=`${esc(selJob.job_no)} ${tag(selJob.src)}`;
 qItem.value=selJob.item_name||'';   /* v78: 제번 선택 시 품명 자동 */
 await loadResults();renderSteps();
 msg(`${selJob.job_no} (${selJob.src}설계) · 세부공정 ${steps.length}건 · 실적 ${results.length}건`);
}
function pickStep(i,tr){selStep=steps[i];
 document.querySelectorAll('#sbody tr').forEach(x=>x.classList.remove('sel'));if(tr)tr.classList.add('sel');
 msg(`세부공정 ${selStep.process_code}/${selStep.machining_process_code||'-'} 선택`);}
async function loadResults(){
 if(!selJob||!online()){results=[];renderResults();return}
 try{results=await MESDB.table('design_results').select(`select=*&job_no=eq.${encodeURIComponent(selJob.job_no)}&order=row_no`);
  renderResults()}catch(e){results=[];renderResults()}
}
async function addResult(){
 if(!selJob){msg('제번을 선택하세요.');return}
 if(!selStep){msg('세부공정을 선택하세요.');return}
 const mins=numv(fMin.value);
 if(!mins){msg('작업시간(분)을 입력하세요.');return}
 if(!fDate.value){msg('작업일을 선택하세요.');return}
 if(!online()){msg('DB 미연결 상태에서는 실적을 등록할 수 없습니다.');return}
 try{
  /* v39: row_no 는 DB identity 가 채운다. v68: design_source(사내/외주) 함께 기록 */
  await MESDB.table('design_results').upsert({
   work_type:'설계',design_source:selJob.src||'사내',worker_name:(fWorker.value||'').trim()||null,job_no:selJob.job_no,
   process_code:selStep.process_code,machining_process_code:selStep.machining_process_code||null,
   machining_process_name:selStep.machining_process_name||null,
   work_date:fDate.value,work_minutes:mins},'row_no');
  await loadResults();renderSteps();
  msg(`${selJob.job_no} ${selJob.src}설계 실적 ${mins}분을 등록했습니다. (설계실적현황/조회에 즉시 반영)`);
 }catch(e){const m=String(e.message||e);
  msg(/무결성|foreign key/i.test(m)?'등록 실패: 등록되지 않은 제번입니다.':'등록 실패: '+m.slice(0,120))}
}
async function delResult(){
 const ids=[...rbody.querySelectorAll('input[type=checkbox]:checked')].map(c=>Number(c.dataset.row));
 if(!ids.length){msg('삭제할 실적을 선택하세요.');return}
 if(!confirm(`실적 ${ids.length}건을 삭제하시겠습니까?`))return;
 try{for(const id of ids)await MESDB.table('design_results').delete({row_no:id});
  await loadResults();renderSteps();msg(`실적 ${ids.length}건을 삭제했습니다.`);
 }catch(e){msg('삭제 실패: '+String(e.message||e).slice(0,120))}
}
async function doneStep(){
 if(!selStep){msg('세부공정을 선택하세요.');return}
 try{await MESDB.table('design_plan_steps').upsert({row_no:selStep.row_no,step_completed:true,
   completion_date:new Date().toISOString().slice(0,10)},'row_no');
  selStep.done=true;renderSteps();msg(`세부공정 ${selStep.process_code} 을(를) 완료 처리했습니다.`);
 }catch(e){msg('완료 처리 실패: '+String(e.message||e).slice(0,120))}
}
async function doneDesign(){
 if(!selJob){msg('제번을 선택하세요.');return}
 if(!confirm(`${selJob.job_no} 설계를 완료 처리하시겠습니까?`))return;
 /* v43: design_plans 의 PK 는 job_no 이고 row_no 는 DB identity 다.
    row_no 가 비어 있으면 null 이 전송돼 NOT NULL 위반이 나므로 아예 보내지 않는다. */
 try{await MESDB.table('design_plans').upsert({job_no:selJob.job_no,
   design_completed:true,design_completed_date:new Date().toISOString().slice(0,10)},'job_no');
  msg(`${selJob.job_no} 설계를 완료 처리했습니다.`);await search();
 }catch(e){msg('완료 처리 실패: '+String(e.message||e).slice(0,120))}
}
document.querySelectorAll('input[name=k],input[name=src]').forEach(x=>x.addEventListener('change',search));
/* v115: 목록에서 고르면(=정확히 일치하면) 짝 항목을 자동 채우고 바로 조회한다 */
function comboPick(from){
 const jv=(qJob.value||'').trim(),iv=(qItem.value||'').trim();
 if(from==='job'&&JOBMAP.has(jv)){const t=JOBMAP.get(jv);if(t)qItem.value=t;}
 if(from==='item'&&ITEMMAP.has(iv)){const t=ITEMMAP.get(iv);if(t)qJob.value=t;}
 search();
}
