<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>원재료 입고확정</title>
<style>
:root{--line:#9daab6;--line2:#c5ced6;--ink:#344758}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:"Malgun Gothic","맑은 고딕",Arial,sans-serif;font-size:12px;color:var(--ink);background:#fff;overflow:hidden}button,input,select{font:inherit;color:inherit}
.screen{height:100%;display:flex;flex-direction:column}.title{height:46px;padding:9px 14px 4px;border-bottom:2px solid #3977ad;display:flex;align-items:center;gap:16px}.title h1{margin:0;font-size:21px;font-weight:500;color:#4b5b69}.title h1:before{content:'◯';margin-right:6px;color:#8795a1}.title .opts{display:flex;align-items:center;gap:10px;color:#5f6d79}.title .plant{margin-left:auto;display:flex;align-items:center;gap:6px;color:#6b7885}
.filters{padding:7px 14px;border-bottom:1px solid var(--line2);background:#fafbfc;display:flex;gap:6px;align-items:center;flex-wrap:wrap}.label{font-weight:700}.field{height:27px;border:1px solid #b7c2cb;background:#fff;padding:0 7px;outline:none}.field:focus{border-color:#4e88bb}
.gridbox{flex:1;min-height:0;margin:7px 14px 0;border:1px solid var(--line);display:flex;flex-direction:column;background:#fff}.grid-title{height:26px;display:flex;align-items:center;justify-content:center;background:linear-gradient(#deebf5,#caddea);border-bottom:1px solid var(--line);font-weight:700;color:#536677}
.tablewrap{flex:1;min-height:0;overflow:auto}table{border-collapse:collapse;min-width:1600px;width:100%;table-layout:fixed}th,td{height:25px;padding:0 5px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}th{position:sticky;top:0;z-index:2;text-align:center;background:linear-gradient(#dbe9f4,#c7d9e8);color:#405266;font-weight:700}tbody tr:nth-child(even) td{background:#fafcfd}tbody tr:hover td{background:#edf6fd}tbody tr.sel td{background:#2e78bd;color:#fff}.c{text-align:center}.r{text-align:right}
tfoot th{position:sticky;bottom:0;background:linear-gradient(#e6eef5,#d3e0ea)}
.summary{height:50px;margin:0 14px;border:1px solid var(--line);border-top:0;background:#eef3f6;display:flex;align-items:center;gap:7px;padding:6px}.summary input{height:28px;border:1px solid #aeb9c3;background:#fff;padding:0 6px}.summary .money{width:170px;text-align:right}.summary .rateinput{width:90px;text-align:right}.summary .dateinput{width:135px}.spacer{flex:1}
.btn{height:28px;min-width:70px;border:1px solid #9ca9b5;background:linear-gradient(#fff,#dfe6eb)}.btn:hover{background:#fff}.btn.primary{background:linear-gradient(#f9ffff,#d2e7f6);color:#1e5e91}.btn.confirm{background:linear-gradient(#fff3f7,#f3c3d5);color:#a8235a;border-color:#d38aa6;font-weight:700}.btn.confirm:hover{background:linear-gradient(#fff,#f7d3e0)}.btn.warn{color:#a63a2f}
.foot{height:42px;display:flex;align-items:center;padding:5px 14px;border-top:1px solid var(--line);background:#eef2f5;gap:5px}.msg{margin-left:10px;color:#687784}.foot .right{margin-left:auto;color:#7c8993}
@media(max-width:900px){.title h1{font-size:18px}.summary{overflow:auto}}

/* v249: 확정가 직접 입력 */
input.fixin{width:100%;height:20px;border:1px solid #cbd4dc;padding:0 3px;text-align:right;font:inherit}input.fixin.man{background:#fff8e1;border-color:#e0b64a}
.summary .fixbulk{width:110px;text-align:right}
input.qtyin{width:100%;height:20px;border:1px solid #cbd4dc;padding:0 3px;text-align:right;font:inherit}
.cbo{background:#fff url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6'%3E%3Cpath d='M0 0h10L5 6z' fill='%23708090'/%3E%3C/svg%3E") no-repeat right 8px center;padding-right:22px}.cbo::-webkit-calendar-picker-indicator{opacity:0;width:16px;margin-right:-16px;cursor:pointer}
</style>
</head>
<body>
<div class="screen">
  <div class="title"><h1>원재료 입고확정</h1>
    <div class="opts"><label><input type="radio" name="done" value="미완료" checked onchange="search()"> 미완료</label><label><input type="radio" name="done" value="완료" onchange="search()"> 완료</label></div>
  </div>
  <section class="filters">
    <span class="label">협력업체</span><input id="vendorQ" class="field cbo" list="venDL" autocomplete="off" style="width:190px" placeholder="업체 입력/선택"><datalist id="venDL"></datalist>
    <span class="label">관리제번</span><input id="baseQ" class="field cbo" list="baseDL" autocomplete="off" style="width:170px" placeholder="관리제번 입력/선택" title="관리제번을 고르면 A~F 공정 제번이 모두 나옵니다"><datalist id="baseDL"></datalist><span class="label">제번</span><input id="jobQ" class="field" style="width:190px" placeholder="제번">
    <span class="label">품명</span><input id="itemQ" class="field" style="width:190px" placeholder="품명">
    <button class="btn" onclick="search()">⌕ 조회</button>
  </section>
  <div class="gridbox">
    <div class="grid-title">입고 확정 대기 리스트</div>
    <div class="tablewrap"><table>
      <colgroup><col style="width:44px"><col style="width:40px"><col style="width:112px"><col style="width:120px"><col style="width:48px"><col style="width:60px"><col style="width:70px"><col style="width:130px"><col style="width:64px"><col style="width:100px"><col style="width:92px"><col style="width:92px"><col style="width:92px"><col style="width:60px"><col style="width:60px"><col style="width:84px"><col style="width:92px"><col style="width:76px"><col style="width:92px"><col style="width:64px"></colgroup>
      <thead><tr><th>No</th><th><input type="checkbox" id="chkAll" onclick="chkAllToggle(this)" title="전체선택 / 전체해제"></th><th>제번</th><th>품명</th><th>공정</th><th>공정명</th><th>품번</th><th>부품명</th><th>재질</th><th>협력업체</th><th>발주일</th><th>입고일</th><th>입고확정일</th><th title="발주수량">발주수량</th><th title="입고수량 — 미확정 행은 수정 가능">입고수량</th><th title="단가 — 미확정 행은 수정 가능">단가</th><th title="매입가 = 입고수량 × 단가">매입가</th><th>네고율(%)</th><th>확정가</th><th>상태</th></tr></thead>
      <tbody id="body"></tbody>
      <tfoot><tr><th colspan="13" class="r">합계</th><th class="r" id="sumOrd">0</th><th class="r" id="sumGot">0</th><th></th><th class="r" id="sumBuy">0</th><th></th><th class="r" id="sumFix">0</th><th></th></tr></tfoot>
    </table></div>
  </div>
  <div class="summary">
    <span class="label">매입가 합계</span><input id="total" class="money" readonly>
    <span class="label">네고율</span><input id="nego" class="rateinput" type="number" step="0.01" value="0.00"><button class="btn" onclick="applyNego()">네고율 적용</button>
    <span class="label">확정가</span><input id="fixBulk" class="fixbulk" inputmode="numeric" placeholder="선택 행 일괄" inputmode="decimal" title="선택한 행에 같은 확정가를 넣습니다 (행마다 표의 확정가 칸에서 따로 입력해도 됩니다)"><button class="btn" onclick="applyFix()">확정가 적용</button>
    <span class="label">입고확정일</span><input id="confirmDate" class="dateinput" type="date"><button class="btn confirm" onclick="confirmSelected()">▣ 입고확정</button>
    <div class="spacer"></div><span id="selectedText">선택 0건</span>
  </div>
  <footer class="foot"><button class="btn" onclick="search()">⌕ 검색</button><button class="btn" onclick="save()">▣ 저장</button><button class="btn warn" onclick="cancelConfirm()" title="확정된 건은 위쪽 [완료]로 조회한 뒤 고르세요">✖ 입고확정취소</button><button class="btn" onclick="window.parent?.closeActive?.()">⊠ 닫기</button><span class="msg" id="message">입고 확정 대기 자료를 조회했습니다.</span><span class="right" id="countText"></span></footer>
</div>
<script>
const rows=[];
let view=[...rows];
const money=v=>Number(v||0).toLocaleString('ko-KR');
/* v249: 확정가는 직접 입력이 우선 (r.fixManual) — 매입가가 0 이거나 네고율로 안 떨어지는 금액도 확정할 수 있다 */
const fix=r=>r.fixManual!=null?Number(r.fixManual)||0:Math.round((Number(r.price)||0)*(1-(r.rate||0)/100));
function setFix(no,v){const r=rows.find(x=>x.no===no);if(!r)return;const n=Number(String(v||'').replace(/[^0-9.\-]/g,''));
 if(v===''||!Number.isFinite(n)){r.fixManual=null}else{r.fixManual=Math.round(n);if(Number(r.price)>0)r.rate=Number(((1-r.fixManual/Number(r.price))*100).toFixed(2))}
 render();const cb=document.querySelector(`#body input[data-no="${no}"]`);if(cb)cb.checked=true;summary();
 msg(r.fixManual!=null?`${r.part} 확정가를 ${money(r.fixManual)}원으로 입력했습니다.`:`${r.part} 확정가를 네고율 계산값으로 되돌렸습니다.`)}
/* v251: 매입가 직접 수정 — 발주 때 단가가 없거나 틀린 경우 여기서 바로잡는다 */
function setPrice(no,v){const r=rows.find(x=>x.no===no);if(!r)return;const n=Number(String(v||'').replace(/[^0-9.\-]/g,''));
 r.price=Number.isFinite(n)&&n>=0?Math.round(n):0;
 if(r.fixManual!=null&&r.price>0)r.rate=Number(((1-r.fixManual/r.price)*100).toFixed(2));
 render();const cb=document.querySelector(`#body input[data-no="${no}"]`);if(cb)cb.checked=true;summary();
 msg(`${r.part} 매입가를 ${money(r.price)}원으로 수정했습니다 · 확정가 ${money(fix(r))}원`)}
/* v254: 매입가 = 입고수량 × 단가 (단가·입고수량을 고치면 자동). 단가가 없으면 발주 때 저장된 매입가를 그대로 */
const buyOf=r=>{const q=Number(r.got)||Number(r.ord)||0,u=Number(r.unit)||0;return u>0?Math.round(q*u):(Number(r.price)||0)};
function setUnit(no,v){const r=rows.find(x=>x.no===no);if(!r)return;const n=Number(String(v||'').replace(/[^0-9.\-]/g,''));
 r.unit=Number.isFinite(n)&&n>=0?n:0;r.price=buyOf(r);if(r.fixManual!=null&&r.price>0)r.rate=Number(((1-r.fixManual/r.price)*100).toFixed(2));
 render();const cb=document.querySelector(`#body input[data-no="${no}"]`);if(cb)cb.checked=true;summary();
 msg(`${r.part} 단가 ${money(r.unit)}원 × 입고수량 ${Number(r.got)||Number(r.ord)||0} = 매입가 ${money(r.price)}원 · 확정가 ${money(fix(r))}원`)}
/* v253: 입고수량 수정 — 단가가 있으면 매입가도 다시 계산 */
function setGot(no,v){const r=rows.find(x=>x.no===no);if(!r)return;const n=Number(String(v||'').replace(/[^0-9.]/g,''));r.got=Number.isFinite(n)&&v!==''?n:null;if(Number(r.unit)>0){r.price=buyOf(r);if(r.fixManual!=null&&r.price>0)r.rate=Number(((1-r.fixManual/r.price)*100).toFixed(2))}render();const cb=document.querySelector(`#body input[data-no="${no}"]`);if(cb)cb.checked=true;summary();msg(`${r.part} 입고수량을 ${r.got??'-'}(으)로 수정했습니다.`)}
function applyFix(){const s=selected();if(!s.length)return msg('확정가를 적용할 행을 선택하세요.');const n=Math.round(Number(String(fixBulk.value||'').replace(/[^0-9.\-]/g,'')));
 if(!Number.isFinite(n)||n<0)return msg('확정가를 숫자로 입력하세요.');
 s.forEach(r=>{r.fixManual=n;if(Number(r.price)>0)r.rate=Number(((1-n/Number(r.price))*100).toFixed(2))});render();s.forEach(r=>{const cb=document.querySelector(`#body input[data-no="${r.no}"]`);if(cb)cb.checked=true});summary();
 msg(`${s.length}건에 확정가 ${money(n)}원을 적용했습니다.`)}
function doneMode(){return document.querySelector('input[name=done]:checked').value}
function render(){try{fillVenDL();fillBaseDL()}catch(e){}body.innerHTML=view.map((r,i)=>`<tr onclick="pick(event,${r.no})"><td class="c">${i+1}</td><td class="c"><input type="checkbox" data-no="${r.no}" onchange="summary()"></td><td>${r.job}</td><td>${r.item}</td><td class="c">${r.proc}</td><td class="c">${r.procName}</td><td>${r.part}${window.MESCYCLE?MESCYCLE.badge(r.cyc,null,r.cycWhy):''}</td><td>${r.partName}</td><td class="c">${r.mat}</td><td>${r.vendor}</td><td class="c">${r.odate}</td><td class="c">${r.idate}</td><td class="c">${r.cdate}</td><td class="r">${r.ord??''}</td><td class="r">${r.status==='확정'?(r.got??''):`<input class="qtyin" value="${r.got??''}" placeholder="${r.ord??''}" onclick="event.stopPropagation()" onfocus="this.select()" onchange="setGot(${r.no},this.value)" title="입고수량 수정">`}</td><td class="r">${r.status==='확정'?money(r.unit):`<input class="fixin" value="${C3(Number(r.unit))}" placeholder="0" onclick="event.stopPropagation()" onfocus="this.select()" onchange="setUnit(${r.no},this.value)" title="단가 — 매입가 = 입고수량 × 단가">`}</td><td class="r">${money(buyOf(r))}</td><td class="r">${(r.rate||0).toFixed(2)}</td><td class="r">${r.status==='확정'?money(fix(r)):`<input class="fixin${r.fixManual!=null?' man':''}" value="${C3(fix(r))}" placeholder="0" onclick="event.stopPropagation()" onfocus="this.select()" onchange="setFix(${r.no},this.value)" title="확정가 직접 입력 — 비우면 매입가×(1-네고율) 로 돌아갑니다">`}</td><td class="c">${r.status}</td></tr>`).join('');
sumOrd.textContent=view.reduce((a,r)=>a+(Number(r.ord)||0),0);sumGot.textContent=view.reduce((a,r)=>a+(Number(r.got)||0),0);sumBuy.textContent=money(view.reduce((a,r)=>a+(Number(r.price)||0),0));sumFix.textContent=money(view.reduce((a,r)=>a+fix(r),0));countText.textContent=`${view.length}건`;summary()}
/* v115: 제목행 마스터 체크박스 — 전체선택/해제, 부분선택은 중간 표시 */
function chks(){return [...document.querySelectorAll('#body input[type=checkbox]')]}
function chkAllToggle(el){chks().forEach(c=>c.checked=el.checked);summary();
 msg(el.checked?`${chks().length}건을 모두 선택했습니다.`:'선택을 모두 해제했습니다.')}
function syncChkAll(){
 const all=document.getElementById('chkAll');if(!all)return;
 const cs=chks(),on=cs.filter(c=>c.checked).length;
 all.checked=cs.length>0&&on===cs.length;all.indeterminate=on>0&&on<cs.length;
}
function pick(e,no){if(e.target.tagName==='INPUT')return;const cb=document.querySelector(`#body input[data-no="${no}"]`);if(cb){cb.checked=!cb.checked;summary()}}
function selected(){const ids=[...document.querySelectorAll('#body input:checked')].map(x=>Number(x.dataset.no));return rows.filter(r=>ids.includes(r.no))}
function summary(){const s=selected();total.value=money(s.reduce((a,r)=>a+(Number(r.price)||0),0));selectedText.textContent=`선택 ${s.length}건`;
 document.querySelectorAll('#body tr').forEach(tr=>tr.classList.toggle('sel',!!tr.querySelector('input:checked')));
 syncChkAll()}
/* v255: 협력업체 드롭다운/입력 — 조회된 자료의 업체(많이 나온 순) + 기준정보 협력업체 */
function fillVenDL(){const dl=document.getElementById('venDL');if(!dl)return;const C=new Map();
 rows.forEach(r=>{const v=String(r.vendor||'').trim();if(v)C.set(v,(C.get(v)||0)+1)});
 const e=v=>String(v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
 let opts=[...C].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'ko')).map(([v,n])=>`<option value="${e(v)}">${n}건</option>`);
 (window.__venMaster||[]).forEach(v=>{if(!C.has(v))opts.push(`<option value="${e(v)}">`)});
 dl.innerHTML=opts.join('')}
(async()=>{try{for(let i=0;i<60&&!window.MESLOOK;i++)await new Promise(r=>setTimeout(r,100));if(!window.MESLOOK)return;
 const ns=await MESLOOK.names('vendor_material');window.__venMaster=ns||[];fillVenDL()}catch(e){}})();
vendorQ.addEventListener('change',()=>search());
/* v256: 관리제번 드롭다운/입력 — 조회 자료의 제번을 관리제번(A~F 공정 묶음)으로 */
const JSPL2=j=>{const m=/^(.*\d)([A-Z])$/.exec(String(j||'').trim());return m?{base:m[1],seq:m[2]}:{base:String(j||'').trim(),seq:''}};
function fillBaseDL(){const dl=document.getElementById('baseDL');if(!dl)return;const G=new Map();
 rows.forEach(r=>{const s=JSPL2(r.job);if(!s.base)return;let g=G.get(s.base);if(!g){g={seq:new Set(),n:0,item:''};G.set(s.base,g)}if(s.seq)g.seq.add(s.seq);g.n++;if(!g.item&&r.item)g.item=r.item});
 const e=v=>String(v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
 const rng=a=>{a=[...a].sort();return !a.length?'':a.length>1?`(${a[0]}~${a[a.length-1]}) `:`(${a[0]}) `};
 dl.innerHTML=[...G.keys()].sort((a,b)=>b.localeCompare(a)).map(b=>{const g=G.get(b);return `<option value="${e(b)}">${e(rng(g.seq)+(g.item||''))} · ${g.n}건</option>`}).join('')}
baseQ.addEventListener('change',()=>{baseQ.value=baseQ.value.trim().toUpperCase();search()});
/* v257: 단가·확정가 입력칸 천단위 구분기호 — 입력하는 동안에도 콤마 표시 (저장값은 숫자) */
const C3=v=>{const n=Number(v);return v===''||v==null||!Number.isFinite(n)||n===0?'':n.toLocaleString('ko-KR',{maximumFractionDigits:2})};
document.addEventListener('input',e=>{const el=e.target;if(!(el&&el.matches&&el.matches('input.fixin,#fixBulk')))return;
 const raw=el.value,pos=el.selectionStart||raw.length,digitsBefore=raw.slice(0,pos).replace(/[^0-9.]/g,'').length;
 const clean=raw.replace(/[^0-9.]/g,'').replace(/(\..*)\./g,'$1');if(clean===''){el.value='';return}
 const [i,d]=clean.split('.');const out=Number(i||0).toLocaleString('ko-KR')+(d!==undefined?'.'+d:'');el.value=out;
 let k=0,p=0;while(p<out.length&&k<digitsBefore){if(/[0-9.]/.test(out[p]))k++;p++}try{el.setSelectionRange(p,p)}catch(_){}});
function search(){const v=vendorQ.value.trim().toLowerCase(),j=jobQ.value.trim().toLowerCase(),it=itemQ.value.trim().toLowerCase(),m=doneMode();view=rows.filter(r=>(!baseQ.value.trim()||JSPL2(r.job).base===baseQ.value.trim().toUpperCase())&&(m==='완료'?r.status==='확정':r.status!=='확정')&&(!v||r.vendor.toLowerCase().includes(v))&&(!j||r.job.toLowerCase().includes(j))&&(!it||(r.item||'').toLowerCase().includes(it)));render();msg(`${m} 기준 ${view.length}건을 조회했습니다.`)}
function applyNego(){const s=selected();if(!s.length)return msg('네고율을 적용할 행을 선택하세요.');const rate=Math.max(0,Math.min(100,Number(nego.value)||0));s.forEach(r=>{r.rate=rate;r.fixManual=null});render();s.forEach(r=>{const cb=document.querySelector(`#body input[data-no="${r.no}"]`);if(cb)cb.checked=true});summary();msg(`${s.length}건에 네고율 ${rate.toFixed(2)}%를 적용했습니다.`)}
let dirty=false;   /* v62: 확정취소만 하고 저장하는 경우도 DB 반영 */
/* v96: [입고확정] = 즉시 DB 반영. 확정된 행은 미완료 목록에서 빠지고 완료 팝업이 뜬다 ([완료] 로 조회하면 다시 보임, 확정취소 가능). DB 미연결이면 종전처럼 화면만 바꾸고 [저장] 으로 반영. */
async function confirmSelected(){const s=selected();if(!s.length)return msg('입고확정할 행을 선택하세요.');const d=confirmDate.value||new Date().toISOString().slice(0,10);
 s.forEach(r=>{r.cdate=d;r.status='확정';r.fix=fix(r)});dirty=true;
 if(!window.MESDB||!MESDB.online){render();return msg(`${s.length}건을 ${d} 기준으로 입고확정했습니다. (DB 미연결 - 로컬, [저장]으로 반영)`)}
 msg('입고확정 반영 중…');
 try{await MESDB.syncLines()}catch(e){}
 let rl=0;try{rl=MESDB.reloadLines?await MESDB.reloadLines():0}catch(e){rl=-1}
 if(rl===-1){render();return msg('입고확정 저장 실패: DB 반영이 되지 않았습니다. [저장]을 다시 눌러주세요.')}
 dirty=false;search();
 const okm=`${s.length}건을 ${d} 기준으로 입고확정했습니다.`;
 /* v116: 입고확정 완료 팝업을 직접 띄운다 (상태줄 감시에만 의존하지 않음) */
 try{(window.MESPOP||window.parent?.MESPOP)?.ok(okm+'\n'+[...new Set(s.map(r=>r.part).filter(Boolean))].slice(0,8).join(', '),'입고확정 완료')}catch(e){}
 msg(okm+` (DB 저장 완료${doneMode()==='완료'?'':' - 미완료 목록에서 제외'})`)}
/* v135: 입고확정취소 — 고르고 누르면 바로 DB 에 반영한다 ([저장]을 따로 누르지 않아도 된다).
   확정된 건은 「완료」로 조회하면 목록에 나온다. */
async function cancelConfirm(){
 const s=selected();
 if(!s.length)return msg('확정취소할 행을 선택하세요. (확정된 건은 위쪽 [완료]로 조회하면 나옵니다)');
 const t=s.filter(r=>r.status==='확정'||r.cdate);
 if(!t.length)return msg('선택한 행 중 입고확정된 건이 없습니다. [완료]로 조회해 확정된 행을 고르세요.');
 const list=[...new Set(t.map(r=>`${r.job} ${r.part||''}`))].slice(0,8).join('\n · ');
 if(!confirm(`입고확정 ${t.length}건을 취소합니다.\n\n · ${list}${t.length>8?'\n … 외 '+(t.length-8)+'건':''}\n\n`
   +`입고확정일과 확정가가 지워지고 「입고」 상태로 돌아갑니다. 계속할까요?`))return;
 t.forEach(r=>{r.cdate='';r.status='입고';r.fix='';r.fixManual=null});dirty=true;
 if(!window.MESDB||!MESDB.online){render();return msg(`${t.length}건의 입고확정을 취소했습니다. (DB 미연결 - 로컬, [저장]으로 반영)`)}
 msg('확정취소 반영 중…');
 try{await MESDB.syncLines()}catch(e){}
 let rl=0;try{rl=MESDB.reloadLines?await MESDB.reloadLines():0}catch(e){rl=-1}
 if(rl===-1){render();return msg('확정취소 저장 실패: DB 반영이 되지 않았습니다. [저장]을 다시 눌러주세요.')}
 dirty=false;search();
 msg(`입고확정 ${t.length}건을 취소했습니다. (「입고」 상태로 복귀 · DB 저장 완료)`);
}
async function save(){const done=rows.filter(r=>r.status==='확정').length;
 if(!done&&dirty&&window.MESDB&&MESDB.online){try{await MESDB.syncLines();dirty=false;return msg('입고확정 취소 내용을 DB에 반영했습니다. (해당 라인은 입고 상태로 복귀)')}catch(e){return msg('저장 실패: '+String(e.message||e).slice(0,140))}}
 if(!done){alert('확정 처리된 행이 없습니다.\n\n행을 선택하고 확정 처리한 뒤 [저장]을 눌러주세요.');return msg('저장할 확정 내역이 없습니다.')}if(!window.MESDB||!MESDB.online)return msg('원재료 입고확정 변경사항을 저장했습니다. (DB 미연결 - 로컬)');try{rows.forEach(r=>{if(r.status==='확정')r.fix=fix(r)});await MESDB.syncLines();dirty=false;const n=rows.filter(r=>r.status==='확정').length;msg(`원재료 입고확정을 DB에 저장했습니다. 확정 ${n}건`)}catch(e){msg('저장 실패: '+e.message.slice(0,140))}}
function exportCsv(){const out=[['제번','품명','공정','공정명','품번','부품명','재질','협력업체','발주일','입고일','입고확정일','매입가','네고율','확정가','상태'],...view.map(r=>[r.job,r.item,r.proc,r.procName,r.part,r.partName,r.mat,r.vendor,r.odate,r.idate,r.cdate,r.price,r.rate,fix(r),r.status])];const csv='\ufeff'+out.map(a=>a.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='material_receipt_confirmation.csv';a.click();URL.revokeObjectURL(a.href)}
function msg(t){message.textContent=t}
confirmDate.value=new Date().toISOString().slice(0,10);render();window.MES={search,save,exportCsv,setMessage:msg};
</script>
